# `deterministic` não tem provider dentro da etapa na v1alpha1 (§14.3).
apiVersion: automation/v1alpha1
kind: Skill
metadata: {id: ig.teste, name: Teste, app: instagram}
spec:
  invocation: {command_template: "abra as mensagens no instagram"}
  nodes:
    - {id: abrir_inbox, capability: OPEN_INBOX, strategies: [deterministic, ai_actor]}
