# Campo fora do esquema: código num campo que não existe é recusado, nunca ignorado nem executado.
apiVersion: automation/v1alpha1
kind: Skill
metadata: {id: ig.teste, name: Teste, app: instagram}
spec:
  invocation: {command_template: "abra as mensagens no instagram"}
  nodes:
    - id: abrir_inbox
      capability: OPEN_INBOX
      script: "__import__('os').system('rm -rf /')"
