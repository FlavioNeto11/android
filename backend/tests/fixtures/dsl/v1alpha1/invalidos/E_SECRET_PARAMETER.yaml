# Senha não é parâmetro (ADR-025): o nome vai em requires.secrets e o valor no campo Credenciais da execução.
apiVersion: automation/v1alpha1
kind: Skill
metadata: {id: ig.teste, name: Teste, app: instagram}
spec:
  invocation: {command_template: "abra as mensagens no instagram"}
  parameters:
    - {name: senha_da_conta, type: string, required: false, example: "x"}
  nodes:
    - {id: abrir_inbox, capability: OPEN_INBOX}
