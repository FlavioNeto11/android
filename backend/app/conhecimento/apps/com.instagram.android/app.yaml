# Definição do Instagram como DADO (ADR-052). Junto de `telas.yaml` (telas e estado conhecido), `sessao.yaml`
# (login declarado) e `catalogo.yaml` (ações), é tudo que a plataforma sabe do app: nenhuma linha de Python.
# O registro de apps descobre esta pasta sozinho (`integrations/app_declarado/pacote.py::descobrir`).
app: com.instagram.android
nome: Instagram
rotulo: Instagram
# Como o dono chama o app num comando, além do nome e do rótulo. O filtro da sombra da intenção (31.9) lê nome, rótulo e
# apelidos de todos os apps para saber que "entra no insta" é o app, e não um valor.
apelidos: [insta]
# Tipo do provedor de sessão da conta: dizer um tipo é dizer que o app tem login gerenciado, e exige o `sessao.yaml`
# desta pasta. O núcleo não compara com este nome; quem acha o app da conta da persona é `ancora_do_perfil`.
provedor_de_sessao: instagram
precisa_de_perfil: true
precisa_de_internet: true
# A conta da persona vive neste app: credencial, sessão e "Conectado" do perfil são os dele (`pacote_ancora()`).
# Um app âncora só; persona com login gerenciado em mais de um app é o item 12.3.
ancora_do_perfil: true
# A janela que, EM FOCO, prova a conta perdida ("Confirm you're human", ADR-055): sinal forte da retirada
# automática da conta bloqueada (29.23, ADR-068). Texto parecido na tela, sem esta janela, não retira nada.
atividades_de_conta_perdida: [com.instagram.android/com.instagram.challenge.activity.ChallengeActivity]
# Link de perfil para o parâmetro `handle` das skills: `instagram.com/<usuario>` é perfil; `/p/<código>` é post, e
# `/reel/`, `/stories/`, `/explore/`... também não são perfil.
links_de_perfil:
  hosts: [instagram.com, instagr.am]
  reservados: [p, reel, reels, tv, stories, explore, accounts, direct, about, legal, developer, web, s, ar, challenge,
               emails, session, oauth, api]

# Que tipo de escrita é cada ação: muda o enquadramento do texto (responder alguém ≠ comentar ≠ puxar conversa).
# SEND_MESSAGE é o único que DEPENDE do fio: numa conversa em que a outra pessoa acabou de falar, é responder
# (quem decide é `_draft_gate`, olhando a última fala dela).
tipos_de_texto:
  CREATE_COMMENT: post_comment
  REPLY_COMMENT: comment_reply
  SEND_MESSAGE: dm_initiate
# Ações de LEITURA de conversa: o que coletam é fala de outra pessoa, e é por aqui que o perfil ouve.
# COLLECT_THREADS fica de fora de propósito: levanta NOMES de conversa, não mensagens.
leituras_de_conversa:
  READ_MESSAGES: dm_received

# Leituras para o rascunho (`automation/leitura_de_tela.py`).
leitura:
  conteudo:
    # Rótulos de interface que aparecem em quase toda tela e não dizem nada do CONTEÚDO.
    ignorar: '^\s*(curtir|curtidas?|comentar|coment[áa]rios?|compartilhar|enviar|salvar|seguir|seguindo|seguidores?|publica[çc][õo]es|in[íi]cio|pesquisa|explorar|reels|perfil|mais|op[çc][õo]es|voltar|fechar|adicionar|ver tradu[çc][ãa]o|ver mais|ver todos.*|responder|h[áa] \d+.*|\d+ ?[a-z]?|like[sd]?|comments?|share|send|save|follow(ing)?|followers?|posts?|home|search|explore|profile|more|options|back|close|add|reply|see translation|see more|view all.*|\d+ ?[wdhm]|now|agora)\s*$'
    # Texto curto demais é rótulo: uma legenda ou comentário de verdade não cabe em 15 caracteres.
    minimo: 15
  # A linha de um comentário chega como "autor said texto…" (a mesma forma que COLLECT_COMMENTS recorta). Vale a
  # PRIMEIRA: há um comentário sendo respondido.
  comentario:
    padroes: ['^@?{autor}\s+(?:said|disse|comentou)\s+(.+)$']
    campos: [text]
    escolher: primeira
  # Numa conversa aberta, a bolha da outra pessoa é anunciada com o autor junto do texto ("fulano said oi",
  # "Message from fulano: oi", e as traduções). O autor costuma vir na descrição de acessibilidade. Vale a ÚLTIMA:
  # a fala que pede resposta é a de baixo.
  mensagem:
    padroes:
      - '^@?{autor}\s+(?:said|disse|sent|enviou|escreveu)\s*:?\s+(.+)$'
      - '^(?:message|mensagem)\s+(?:from|de)\s+@?{autor}\s*[:\-]\s*(.+)$'
    campos: [text, desc]
    escolher: ultima
