# Conhecimento de TELAS do Instagram, como dado (ADR-052, fatia 1). Lido pelo classificador genérico
# (`app/automation/conhecimento_de_telas.py`); o Python do Instagram não guarda mais sinais nem ids de tela.
#
# Estrutura primeiro, texto só desempata: os ids do Instagram são ofuscados e mudam de versão, então as regras usam
# PREFIXOS do final do resource-id e o atributo `password` do Android. Acrescentar idioma é acrescentar chave em
# `sinais`, não espalhar texto pelo código. `en` é a variante do emulador do projeto.
#
# Desafio e 2FA daqui são conferidos contra `automation/hierarchy.py` (`_CONTA_TRAVADA` e `_CODIGO`) por
# `tests/test_sensitive_input.py`: segurança não se edita só aqui.
#
# ADR-055 (29/09/2026): `challenge` é a conta TRAVADA — perfil bloqueado, nada tocado, sem campo de texto exigido;
# `two_factor` é o código de login/2FA — precisa de pessoa, sem bloquear. Os dois casam na UNIÃO dos idiomas, contra o
# texto normalizado (apóstrofo simples, sem acento), por isso cada classe acentuada traz a forma sem acento. Só FRASES:
# o detector roda no meio da execução, em DMs e legendas, onde "suspeito" ou "unusual" soltos são conversa comum.
#
# Desde a fatia 3, `login_button`, `facebook`, `save_dismiss`, `wrong_password`, `user_not_found` e `login_error`
# são lidos pelo `sessao.yaml` desta pasta (login e desfechos depois do envio): cada um tem de existir em todo idioma.
app: com.instagram.android
versao: 1
idioma_padrao: en

sinais:
  en:
    login_button: '^\s*(log ?in|sign ?in)\s*$'
    facebook: 'facebook'
    # "Enter the code we sent" é o código de login por e-mail: saiu de `challenge` (decisão b do ADR-055).
    two_factor: '(two[- ]factor|security code|confirmation code|login code|6[- ]digit( (security |login |confirmation )?code)?|enter the code we sent|we sent (you )?a code)'
    # achado #104: "confirm you're human" (r-20260920143652-132c2e); nunca só "to use your account", que aparece em
    # onboarding comum. "Confirm you are human", por extenso, é como o dono relatou a tela.
    challenge: "((confirm|verify|prove) (that )?you('?re| are) (a )?(human|real person)|confirm it'?s you|help us confirm|verify your account|(we|we'?ve|we have) detected (an? |some )?(unusual|suspicious)|(suspicious|unusual) (login|activity|attempt|behavio)|automated behavio|captcha|i'?m not a robot)"
    save_login: 'save (your )?login info'
    save_dismiss: '^\s*not now\s*$'
    wrong_password: '(incorrect password|password (you )?entered .* incorrect|wrong password)'
    user_not_found: "(couldn'?t find|user not found|no account found)"
    # Diálogo genérico depois de Entrar (android-06): NÃO diz a causa, então nunca é "senha errada".
    login_error: '(unable to log ?in|an unexpected error occurred|please try logging in again)'
    switcher: '(switch accounts?|log into another account)'
    inbox: '^\s*(messages|direct)\s*$'
  pt:
    login_button: '^\s*(entrar|fazer login)\s*$'
    facebook: 'facebook'
    two_factor: '(autentica[çc][ãa]o de dois fatores|c[óo]digo de seguran[çc]a|c[óo]digo de confirma|c[óo]digo de login|insira o c[óo]digo|digite o c[óo]digo|enviamos um c[óo]digo)'
    # achado #104: "confirme que você é humano/uma pessoa" tem outra ordem de palavras.
    challenge: '((confirme|confirmar|verifique|comprove) que (voc[êe] )?[ée] (um[ae]? pessoa( real)?|humano)|confirme que [ée] voc[êe]|ajude a confirmar|verifique sua conta|detectamos (uma? |algum[ae]? )?(tentativa|atividade|acesso|login|comportamento)|(atividade|tentativa de login|login|acesso|comportamento) (suspeit|incomum)|comportamento automatizado|captcha|n[ãa]o sou um rob[ôo])'
    save_login: 'salvar (suas )?informa[çc][õo]es de login'
    save_dismiss: '^\s*agora n[ãa]o\s*$'
    wrong_password: '(senha incorreta|senha .* incorreta)'
    user_not_found: '(n[ãa]o foi poss[íi]vel encontrar|usu[áa]rio n[ãa]o encontrado)'
    login_error: '(n[ãa]o foi poss[íi]vel (entrar|fazer login)|ocorreu um erro inesperado|tente (entrar|fazer login) novamente)'
    switcher: '(trocar de conta|entrar em outra conta)'
    inbox: '^\s*(mensagens|direct)\s*$'

# Leitura da conta aberta. `conta_no_cabecalho` é a fonte confiável de QUEM está logado: só ids de cabeçalho de
# perfil (no feed, o mesmo `action_bar_title` mostra o autor do reel). `arroba_solto` é o palpite pelo primeiro
# `@usuario` da tela, seguro só em perfil e troca de contas.
extracoes:
  conta_no_cabecalho:
    ids: [username, action_bar_title, profile_header_username, row_profile_header_textview_username]
    padrao: '^@?([A-Za-z0-9._]{1,30})$'
    arroba_solto: true

# Em ordem de precedência: a primeira regra que casar vence. Desafio e 2FA vêm ANTES do login, porque também têm
# campo de entrada, e confundir faria digitar senha numa tela de código.
telas:
  - {tela: challenge, tipo: desafio, sinal: challenge, razao: a tela pede confirmação adicional}
  - {tela: two_factor, tipo: dois_fatores, sinal: two_factor, razao: a tela pede código de dois fatores}
  - {tela: save_login_prompt, tipo: intersticial, autenticada: true, sinal: save_login,
     razao: o app pergunta se quer salvar os dados de login}
  - {tela: account_switcher, tipo: intersticial, autenticada: true, sinal: switcher, razao: seletor de contas aberto}
  - {tela: login, tipo: login, formulario_de_senha: true, razao: há um campo de senha na tela}
  - {tela: loading, tipo: carregando, sem_elementos: true, razao: tela ainda sem elementos}
  - {tela: inbox, tipo: autenticada, autenticada: true, sinal: inbox, razao: caixa de mensagens}
  - {tela: profile, tipo: autenticada, autenticada: true, extracao: conta_no_cabecalho,
     ids: [profile_header, row_profile_header, profile_tab], razao: tela de perfil}
  - {tela: feed, tipo: autenticada, autenticada: true,
     ids: [feed_tab, tab_bar, main_tab_bar, feed_timeline, action_bar_inbox_button],
     razao: barra de navegação principal visível}
  # Fatia 1 (execução r-20260928165254-e31953): telas de DENTRO do app, logadas, sem a barra de navegação. Antes
  # caíam em "nenhum sinal conhecido" e a checagem de sessão chamava uma pessoa. Ids vistos em execução real
  # (e31953) e nas provas locais do catálogo (OPEN_THREAD, OPEN_COMMENTS, CREATE_COMMENT, LIKE_POST).
  - {tela: thread, tipo: autenticada, autenticada: true, ids: [row_thread_composer], razao: conversa aberta}
  - {tela: comments, tipo: autenticada, autenticada: true, ids: [layout_comment_thread],
     razao: folha de comentários aberta}
  - {tela: post, tipo: autenticada, autenticada: true, ids: [row_feed_button_like], razao: publicação aberta}
  - {tela: search, tipo: autenticada, autenticada: true, ids: [action_bar_search_edit_text], razao: busca aberta}

# Onde a conta pode ser lida (a barra com a aba de perfil existe) e como chegar lá sem efeito externo: voltar do
# Android até `voltar_max` vezes e, se o app sair da frente ou a tela seguir desconhecida, reabri-lo uma vez.
# Nunca se volta de login, desafio, 2FA ou intersticial: essas telas têm tratamento próprio.
estado_conhecido:
  telas: [feed, profile]
  voltar_max: 4
  reabrir: true
