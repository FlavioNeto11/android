# Catálogo de ações do Instagram, como DADO (ADR-052, fatia 2). Lido e validado por `carregar_catalogo`
# (`app/planning/capabilities.py`), pedido pela descoberta de pacotes (`integrations/app_declarado/pacote.py`)
# por `catalogo_do_pacote`. Nenhum Python do Instagram monta `Capability`: acrescentar ou corrigir uma ação é mudar este
# arquivo.
#
# Cada entrada é um contrato: o que a etapa faz, o que precisa antes, o que comprova depois, se tem efeito externo,
# qual o risco, quem dispara o efeito e como reconciliar. Os textos de tela são da variante `en-US`, que é a suportada
# nesta rodada (medido no emulador desta máquina) — outra variante entra como tabela de sinais própria, não como
# remendo espalhado pelo código.
#
# Os campos são os de `Capability`; o que não aparece vale o padrão da dataclass. Campo desconhecido, obrigatório
# ausente, tipo errado, ação repetida, chave repetida, risco/política/pós-condição fora do vocabulário e prova local
# mal escrita são recusados na CARGA, não no meio de uma execução. A equivalência com o catálogo em Python que este
# arquivo substituiu é conferida por `tests/test_catalogo_como_dado.py` contra
# `tests/fixtures/catalogo_instagram_antes.json`; toda mudança feita DEPOIS entra lá, campo a campo, com o motivo.
#
# Três decisões que valem explicação:
#
# * Login e verificação de conta são `internal`. Quem autentica é código determinístico, fora do laço da IA, e a
#   porta de sessão do despacho já garante que nenhuma etapa roda sem conta verificada. Oferecê-las ao planejador
#   criaria um segundo caminho para digitar senha — exatamente o que o canal sensível existe para impedir.
# * Toda ação com efeito declara `commit_selector`. Sem ele, o efeito seria adivinhado pelo texto do elemento, e numa
#   lista de sugestões qualquer linha viraria commit. Commit falso é irreversível.
# * Seguir, comentar e mandar mensagem nascem em `approval_required`. É o padrão conservador do §17; o perfil pode
#   afrouxar de propósito, nunca por omissão.
app: com.instagram.android
# Versão do contrato das ações. O carregador só aceita 1 enquanto o registro de capabilities
# (`modules/capabilities/infrastructure/catalog_registry.py`) comparar com a constante em vez de ler daqui.
contract_version: 1

acoes:

  # ---------------------------------------------------------------------------------- sessão (resolvidas por código)
  - key: AUTHENTICATE_INSTAGRAM
    title: Autenticar no Instagram
    internal: true
    goal: Abrir o Instagram e garantir a sessão da conta esperada.
    post_kind: model_judged
    post_value: sessão autenticada na conta esperada
    post_description: O app mostra a conta conectada esperada.
    risk: high
    default_policy: manual_only
    reconciliation: 'Observar a tela depois do envio: feed, erro de credencial, desafio ou outra conta.'

  - key: VERIFY_ACCOUNT
    title: Confirmar a conta conectada
    internal: true
    goal: Ler na tela qual conta está conectada e comparar com a esperada.
    post_kind: model_judged
    post_value: conta conectada confirmada
    post_description: A tela de perfil mostra o nome de usuário esperado.
    reconciliation: A conta lida da tela é a única prova; nunca presumir pelo estado salvo.

  - key: LOGOUT
    title: Sair da conta
    goal: Sair da conta conectada neste aparelho.
    post_kind: model_judged
    post_value: sessão encerrada
    post_description: O app volta à tela de entrada.
    side_effect: true
    risk: high
    commit_selector: text=Log out
    commit_guard: [Log out]
    default_policy: manual_only
    reconciliation: Depois de sair, a tela de login precisa aparecer; sessão salva deixa de valer.

  # ------------------------------------------------------------------------------------------ navegação (sem efeito)
  - key: OPEN_FEED
    title: Abrir o feed
    goal: Ir para a aba inicial do Instagram.
    post_kind: element_present
    # Lido da hierarquia real do app 447 em 24/09 (`GET /api/instances/android-01/hierarchy`): a barra do feed é
    # `main_feed_action_bar` (com `action_bar_title_view` e `title_logo` dentro). O `action_bar_title_logo` de antes
    # não existe mais e derrubava a etapa 6 vezes seguidas (ig-abrir-mensagens, r-…-e2a48a).
    post_value: id=main_feed_action_bar
    post_description: A barra superior do feed está visível.

  - key: OPEN_PROFILE
    title: Abrir o perfil de {username}
    bindings: [username]
    goal: Abrir o perfil de {username} pela busca ou por um link na tela.
    post_kind: model_judged
    post_value: perfil de {username} aberto
    post_description: A tela mostra o perfil de {username}, com seguidores e publicações.
    # Medido no app 447: o perfil aberto traz o username no `action_bar_title` (a tela mostra "capitaotarcisio…", sem
    # a arroba). Prova positiva dispensa o verificador; se o título não casar, o modelo julga como antes.
    local_proof: selector:id=action_bar_title|text=={username}

  - key: OPEN_POST
    title: Abrir a publicação
    bindings: [target]
    # `caption_contains`: um trecho literal da legenda, quando o pedido identifica a publicação por um texto dela.
    # Sem ele, a publicação é por posição ("a primeira da grade") e nada muda.
    optional_bindings: [caption_contains]
    goal: Abrir a publicação identificada por {target}. Se ela não aparecer nem depois de rolar, chame step_blocked
      em vez de abrir outra no lugar.
    post_kind: element_present
    # Medido em eda77f: publicação (ou reel) aberta a partir da grade do perfil tem `action_bar_title` "Posts"; o feed
    # inicial tem `action_bar_title_logo` e o perfil tem o username no título — então "Posts" exato só casa a
    # publicação aberta. NÃO usar `row_feed_button_like`: existe em todo cartão do feed, e um `press_back` do perfil
    # cai no feed — a etapa "passaria" lá e a curtida seguinte iria num post qualquer.
    post_value: id=action_bar_title|text==Posts
    post_description: A publicação está aberta (título "Posts"), com curtidas e comentários visíveis; quando a etapa
      traz um texto da legenda, esse texto aparece na tela.
    # "Posts" vale para QUALQUER publicação aberta: em r-20260928165254-e31953 e r-20260928195344-02ee9e o pedido era
    # "o post que contém 'Ainda sobre Setembro Amarelo 2024'" e a etapa passava com outra. Com `caption_contains`, a
    # legenda também precisa estar na tela (fora do seletor: uma legenda com `|` quebraria a gramática).
    card_guard: ['{caption_contains}']

  - key: OPEN_COMMENTS
    title: Abrir os comentários
    optional_bindings: [caption_contains]
    # Sem legenda nesta etapa, vale a da etapa anterior do plano (a que abriu o post): o planejador às vezes a cita só
    # em OPEN_POST, e sem ela o balão de qualquer cartão passava. OPEN_POST não herda — ele COMEÇA um alvo, e abrir
    # outro post por posição não pode exigir a legenda do anterior.
    inherited_bindings: [caption_contains]
    precondition: Uma publicação está aberta.
    goal: Abrir a lista de comentários da publicação aberta.
    post_kind: element_present
    # Medido em eda77f: a folha de comentários tem `title_text_view` "Comments".
    post_value: id=title_text_view|text==Comments
    post_description: Os comentários da publicação estão visíveis (folha "Comments").
    # A folha "Comments" é igual para qualquer publicação: numa recuperação ela passaria aberta sobre outra. Medido em
    # r-20260928165254-e31953 (tela lida para o rascunho da comment_1): com a folha aberta, a legenda da publicação
    # continua na árvore — então, com `caption_contains`, ela é exigida junto do título.
    card_guard: ['{caption_contains}']
    # Pelo mesmo motivo, a legenda na tela não diz de QUE cartão foi o balão tocado: com dois cartões, o do vizinho
    # abre a folha do post errado, a pós-condição acima passa (a legenda certa segue no fundo) e o comentário seguinte
    # sai no post errado. Com `caption_contains`, o toque neste controle só vale no cartão da legenda (a receita, que
    # não distingue argumentos, pode repetir o primeiro balão da tela). Medido em r-20260928165254-e31953, ação e29 da
    # open_comments_1: `row_feed_button_comment`, desc "Comment", [131,455][179,547] no android-06.
    #
    # PENDENTE: o link "View all N comments" (abaixo da legenda) abre a mesma folha e ainda passa SEM guarda. O id não
    # foi medido: a árvore do android-06 lida em 2026-09-29T00:28Z (`GET /api/instances/android-06/hierarchy`) tinha a
    # folha aberta sobre um post com um comentário de prévia e nenhum "View all". Medir o resource-id numa tela que o
    # mostre e acrescentar a esta lista — e, junto, conferir a região do cartão: `UiTree.text_in_card` procura a
    # legenda do TOPO do controle para BAIXO (feito para o balão, acima dela); para um controle abaixo da legenda ela
    # não acharia a do próprio cartão (recusa o certo) e a janela alcançaria o cartão seguinte.
    card_control: [id=row_feed_button_comment]

  - key: OPEN_INBOX
    title: Abrir as mensagens
    goal: Abrir a caixa de mensagens diretas.
    post_kind: model_judged
    post_value: caixa de mensagens aberta
    # Caixa VAZIA é caixa aberta: uma conta nova mostra "No messages yet" e nenhuma conversa. O que a etapa precisa
    # comprovar é que a tela já terminou de carregar — "Loading…" não passa, lista vazia passa.
    post_description: 'A caixa de mensagens está aberta e terminou de carregar: a lista de conversas aparece,
      mesmo que vazia ("No messages yet"). Ainda carregando ("Loading…") não conta.'

  - key: OPEN_THREAD
    title: Abrir a conversa com {username}
    bindings: [username]
    precondition: A caixa de mensagens está aberta.
    goal: Abrir a conversa com {username}, seja uma conversa existente na lista, seja uma nova.
    post_kind: model_judged
    post_value: conversa com {username} aberta
    # Exigir o cabeçalho era impossível de cumprir em conversa NOVA: o Instagram mostra "New message" no topo e o
    # destinatário em "To:". A etapa era reprovada com a conversa aberta e o compositor pronto, e o envio acabava
    # cancelado (visto em r-20260918213007-a353d8). O que importa é o destinatário certo e poder escrever — não onde o
    # nome aparece.
    post_description: 'A conversa com {username} está aberta e pronta para escrever: {username} aparece como
      destinatário (no cabeçalho de uma conversa existente, ou em "To:"/"Para:" de uma conversa nova) e o campo
      de escrever mensagem está disponível.'
    # Atalho positivo: o username visível junto do campo de escrita da conversa já é a conversa certa aberta (com ou
    # sem arroba). Sem isso, o modelo julga como antes. Até 27/09 a prova só pedia o username — e uma linha da caixa
    # de entrada com o mesmo nome passava sem a conversa aberta. O id do compositor foi lido das telas reais julgadas
    # na bateria de 24–25/09 (`row_thread_composer_edittext`, "Message…", em conversa nova e existente).
    local_proof: selector:text=={username}&id=row_thread_composer_edittext

  - key: OPEN_FOLLOW_REQUESTS
    title: Abrir os pedidos para seguir
    goal: Abrir a lista de pedidos de seguidores pendentes.
    post_kind: model_judged
    post_value: lista de pedidos aberta
    post_description: A lista de pedidos para seguir está visível.

  # ------------------------------------------------------------------------------------------------ leitura e coleta
  - key: READ_MESSAGES
    title: Ler as mensagens da conversa
    precondition: Uma conversa está aberta.
    goal: Ler as mensagens recentes da conversa aberta, sem responder.
    collect: true
    collect_limit: 20
    collect_from_top: false
    post_kind: items_collected
    post_value: texto de cada mensagem recente da conversa
    post_description: As mensagens recentes foram lidas.

  - key: COLLECT_THREADS
    title: Levantar as conversas da caixa de entrada
    precondition: A caixa de mensagens está aberta.
    goal: Levantar o nome de cada conversa da lista.
    collect: true
    collect_limit: 20
    collect_from_top: false
    post_kind: items_collected
    post_value: nome de cada conversa da lista
    post_description: As conversas da lista foram levantadas.

  - key: COLLECT_COMMENTS
    title: Levantar os comentários da publicação
    precondition: A lista de comentários está aberta.
    goal: Levantar o autor e o texto de cada comentário visível.
    collect: true
    collect_limit: 20
    collect_from_top: false
    collect_rewind: true
    # A linha do comentário é lida como "autor said texto…". Quem identifica o alvo é o autor: é ele que precisa virar
    # `{username}` nas etapas do bloco, senão `commit_guard`/`band_guard` exigiriam a frase inteira (com emojis)
    # visível na tela — e a curtida do comentário nunca fecharia.
    item_key: ^(\S+)\s+said\s
    post_kind: items_collected
    post_value: autor e texto de cada comentário da lista
    post_description: Os comentários foram levantados.

  # -------------------------------------------------------------------------------------------------- efeito externo
  - key: LIKE_POST
    title: Curtir a publicação
    interaction_type: post_liked
    optional_bindings: [caption_contains]
    inherited_bindings: [caption_contains]      # a legenda da etapa anterior (ver OPEN_COMMENTS)
    precondition: A publicação alvo está aberta na tela.
    goal: Curtir a publicação aberta, uma única vez.
    post_kind: model_judged
    post_value: publicação curtida
    post_description: O ícone de curtir aparece marcado na publicação aberta.
    side_effect: true
    risk: medium
    # `desc==Like` EXATO: por substring, "Like" também casava "Liked" — o toque num post já curtido era aceito como
    # commit e DESCURTIA. A prova local é o mesmo botão marcado depois do toque.
    commit_selector: desc==Like
    # A tela "Posts" é um feed: cada cartão tem o seu `desc==Like`. Em r-20260928165254-e31953 a receita tocou o
    # primeiro da tela (e26) e `desc==Liked` provava qualquer cartão. Com `caption_contains`, a legenda precisa estar
    # visível (e aparece ao ator entre os textos da guarda) e o coração tocado — e o marcado, na prova — precisa ser
    # o do CARTÃO dela, logo acima da legenda.
    commit_guard: ['{caption_contains}']
    card_guard: ['{caption_contains}']
    limit_bucket: likes
    default_policy: autonomous
    local_proof: selector:desc==Liked
    reconciliation: 'Depois do toque, observar o ícone: marcado = curtido. Nunca tocar de novo por timeout.'

  - key: UNLIKE_POST
    title: Descurtir a publicação
    interaction_type: post_unliked
    precondition: A publicação alvo está aberta na tela.
    goal: Remover a curtida da publicação aberta.
    post_kind: model_judged
    post_value: curtida removida
    post_description: O ícone de curtir aparece desmarcado.
    side_effect: true
    risk: medium
    commit_selector: desc==Liked
    limit_bucket: likes
    default_policy: approval_required
    local_proof: selector:desc==Like
    reconciliation: Observar o ícone depois do toque; desmarcado = removida.

  - key: LIKE_COMMENT
    title: Curtir o comentário de {username}
    interaction_type: comment_liked
    bindings: [username]
    precondition: A lista de comentários está aberta.
    goal: Curtir o comentário de {username}, uma única vez.
    post_kind: model_judged
    post_value: comentário de {username} curtido
    post_description: O comentário de {username} aparece com a curtida marcada.
    side_effect: true
    risk: medium
    commit_selector: desc==Like
    commit_guard: ['{username}']
    band_guard: ['{username}']
    limit_bucket: likes
    # O coração marcado tem de estar na FAIXA do comentário de {username}: o de cima não prova o de baixo.
    local_proof: selector_band:desc==Liked
    reconciliation: Observar o ícone do comentário alvo depois do toque.

  - key: CREATE_COMMENT
    title: Comentar na publicação
    interaction_type: comment_replied
    optional_bindings: [content_brief, content, content_verbatim, caption_contains]
    # Só a legenda: o texto a escrever nunca herda (o carregador recusa), senão o segundo comentário repetiria o
    # primeiro.
    inherited_bindings: [caption_contains]
    precondition: A lista de comentários está aberta e o texto já foi escrito e aprovado.
    goal: Publicar o comentário com o conteúdo aprovado.
    post_kind: model_judged
    post_value: comentário publicado
    post_description: O comentário aparece na lista, atribuído à conta conectada.
    side_effect: true
    risk: high
    # Medido no app real (447): o botão de enviar só EXISTE depois que há texto no campo, e sua descrição é "Post",
    # não "Post comment". Com o seletor errado o commit nunca casava, o executor rejeitava o toque e a etapa morria em
    # "o efeito externo foi tentado no elemento errado" — com a IA fazendo tudo certo.
    commit_selector: id=layout_comment_thread_post_button_icon
    # A legenda do post alvo (`caption_contains`) visível antes de publicar: a folha "Comments" não diz de que
    # publicação é, e a do post errado passaria (r-20260928165254-e31953). Guarda de CARTÃO não serve aqui: o botão
    # "Post" é o do campo de escrita, fora de qualquer cartão. Esta guarda é só de presença; de QUE publicação é a
    # folha quem garante é o `card_control` de OPEN_COMMENTS, no toque que a abriu.
    commit_guard: ['{content}', '{caption_contains}']
    limit_bucket: comments
    default_policy: approval_required
    needs_draft: true
    reconciliation: O comentário precisa aparecer na lista; enviar de novo criaria dois comentários.

  - key: REPLY_COMMENT
    title: Responder o comentário de {username}
    interaction_type: comment_replied
    bindings: [username]
    optional_bindings: [content_brief, content, content_verbatim]
    precondition: A lista de comentários está aberta, com a resposta já escrita e aprovada.
    goal: Responder o comentário de {username} com o conteúdo aprovado.
    post_kind: model_judged
    post_value: resposta publicada
    post_description: A resposta aparece abaixo do comentário de {username}.
    side_effect: true
    risk: high
    commit_selector: id=layout_comment_thread_post_button_icon
    commit_guard: ['{username}', '{content}']
    band_guard: ['{username}']
    limit_bucket: comments
    default_policy: approval_required
    needs_draft: true
    reconciliation: A resposta precisa aparecer na conversa do comentário; nunca reenviar por timeout.

  - key: SEND_MESSAGE
    title: Enviar a mensagem para {username}
    interaction_type: dm_sent
    bindings: [username]
    optional_bindings: [content_brief, content, content_verbatim]
    precondition: A conversa com {username} está aberta e o texto já foi escrito e aprovado.
    goal: Enviar o conteúdo aprovado na conversa aberta com {username}.
    post_kind: model_judged
    post_value: mensagem enviada para {username}
    # Medido no app real: o Instagram NÃO mostra rótulo "Sent"/"Delivered" numa DM recém-enviada. Exigir "indicação de
    # envio" fazia todo envio bem-sucedido voltar como "não foi possível comprovar". A prova observável é a TRANSIÇÃO:
    # o texto sai do campo de escrita e vira mensagem no fio.
    post_description: A mensagem aparece na conversa com {username} como mensagem enviada — ela saiu do campo
      de escrita, que volta vazio — e não há marca de falha (como 'Not delivered' ou 'Tap to retry'). Ainda com
      'Sending…'/'Enviando…' na tela a mensagem está pendente, e pendente não conta como enviada.
    side_effect: true
    risk: high
    commit_selector: desc=Send
    commit_guard: ['{username}', '{content}']
    limit_bucket: dms
    default_policy: approval_required
    needs_draft: true
    failure_marks: [Not delivered, Tap to retry, Failed to send, Message not sent, Não entregue, Toque para
        tentar novamente]
    # Critério objetivo da DM (ADR-055), conferido pela árvore ANTES do modelo. Em 19/09 o verificador por modelo errou
    # nos dois sentidos: 5 DMs com a bolha enviada no print dadas por não enviadas (numa, "apenas parte do texto" com o
    # texto inteiro) e a DM da beatriz dada por ENVIADA com "Sending…" congelado. Pendente nunca é enviada: com uma
    # destas marcas na tela nem a prova local nem o modelo fecham a etapa (as duas grafias da reticência, porque a
    # comparação é por texto). Com o texto na bolha e o campo de escrita da conversa na tela sem ele, é enviada, sem
    # modelo. O id do campo foi lido das telas reais julgadas em 24–25/09 (o mesmo da prova de OPEN_THREAD).
    pending_marks: [Sending…, Sending..., Enviando…, Enviando...]
    local_proof: sent_text:id=row_thread_composer_edittext
    reconciliation: 'Observar a conversa: a mensagem aparece uma vez. Reenviar por timeout duplicaria.'

  - key: FOLLOW
    title: Seguir {username}
    interaction_type: followed
    bindings: [username]
    precondition: O perfil de {username} está aberto.
    goal: Seguir {username} a partir do perfil aberto.
    post_kind: model_judged
    post_value: '{username} seguido ou pedido enviado'
    post_description: O botão mostra 'Following' ou 'Requested' no perfil de {username}.
    side_effect: true
    risk: high
    commit_selector: text=Follow
    commit_guard: ['{username}']
    limit_bucket: follows
    default_policy: approval_required
    reconciliation: 'Ler o botão depois do toque: Following, Requested ou ainda Follow.'

  - key: UNFOLLOW
    title: Deixar de seguir {username}
    interaction_type: unfollowed
    bindings: [username]
    precondition: O perfil de {username} está aberto.
    goal: Deixar de seguir {username} a partir do perfil aberto.
    post_kind: model_judged
    post_value: '{username} deixou de ser seguido'
    post_description: O botão volta a mostrar 'Follow' no perfil de {username}.
    side_effect: true
    risk: high
    commit_selector: text=Following
    commit_guard: ['{username}']
    limit_bucket: follows
    default_policy: manual_only
    reconciliation: Ler o botão depois da confirmação; o app costuma pedir confirmação em diálogo.

  - key: ACCEPT_FOLLOW_REQUEST
    title: Aceitar o pedido de {username}
    interaction_type: follow_request_accepted
    bindings: [username]
    precondition: A lista de pedidos para seguir está aberta.
    goal: Aceitar o pedido de {username} na lista de pedidos.
    post_kind: model_judged
    post_value: pedido de {username} aceito
    post_description: A linha de {username} deixa de mostrar o botão de aceitar.
    side_effect: true
    risk: high
    commit_selector: text=Confirm
    commit_guard: ['{username}']
    band_guard: ['{username}']
    limit_bucket: follows
    default_policy: approval_required
    reconciliation: A linha do pedido some ou muda de estado; não tocar de novo.

  - key: DECLINE_FOLLOW_REQUEST
    title: Recusar o pedido de {username}
    interaction_type: follow_request_declined
    bindings: [username]
    precondition: A lista de pedidos para seguir está aberta.
    goal: Recusar o pedido de {username} na lista de pedidos.
    post_kind: model_judged
    post_value: pedido de {username} recusado
    post_description: A linha de {username} sai da lista de pedidos.
    side_effect: true
    risk: high
    commit_selector: text=Delete
    commit_guard: ['{username}']
    band_guard: ['{username}']
    limit_bucket: follows
    default_policy: approval_required
    reconciliation: A linha some da lista; recusar duas vezes não é possível, mas tocar de novo acerta outro
      pedido.
