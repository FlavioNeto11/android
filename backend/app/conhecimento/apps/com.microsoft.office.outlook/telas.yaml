# Conhecimento de TELAS do Outlook, como dado (ADR-052, item 23.8). Lido pelo classificador genérico
# (`app/automation/conhecimento_de_telas.py`) e, pelo `sessao.yaml` desta pasta, pelo motor genérico de sessão.
#
# O que é OBSERVADO e o que é SUPOSIÇÃO vem marcado em cada linha. Observado = árvore da plataforma (UiAutomator2) em
# 30/09/2026, Outlook 5.2635.3: no android-10, boas-vindas, "Add account", a espera do WebView de autenticação, "Verify
# your email" e "Enter your password"; no android-06 (login real do Beltrano, 22:18–22:24Z), tudo o que veio depois do
# "Next": o aviso da conta Microsoft, o diálogo de chave de acesso do sistema, "Authentication in progress", "Add
# another account", os três informativos do primeiro uso, a caixa e a gaveta com o e-mail. O "Stay signed in?" e as
# telas de desafio da Microsoft seguem suposição conservadora: se não casarem, a tela fica desconhecida e o motor para
# — nunca vira sucesso. Os botões do Outlook vêm em MAIÚSCULAS ("MAYBE LATER"): todo sinal casa sem diferenciar caixa.
#
# Os sinais de tela casam contra o texto da tela, uma linha por elemento ("texto descrição"). `(?m)` ancora cada sinal
# numa LINHA: o Outlook é um app de correio, e o detector de desafio roda no meio da execução sobre a caixa de entrada
# — um assunto de e-mail com a frase solta não pode parar a execução. Os de desafio e código usam frases de TÍTULO de
# página (linha inteira) e, no "Verify your email", duas linhas da mesma página que nunca aparecem juntas numa lista de
# mensagens. Cada classe acentuada traz a forma sem acento (o detector casa contra o texto normalizado).
app: com.microsoft.office.outlook
versao: 1
idioma_padrao: en

sinais:
  en:
    # --- entrada (observado 30/09 android-10) ---
    boas_vindas: '(?m)^\s*welcome to outlook\s*$'                    # TextView `title`
    adicionar_conta: '^\s*add account\s*$'                            # Button `btn_primary_button` das boas-vindas
    # Button `btn_primary_button` do "Add account" (texto repetido na descrição, observado 30/09 android-06). Só vale no
    # formulário do identificador, na tela `adicionar_conta`: o "Continue" do diálogo de chave de acesso (outro pacote)
    # nunca é o dele.
    continuar: '^\s*continue\s*$'
    # Entrar com OUTRA conta ou criar uma nunca é o botão do formulário; "Send a code" / "Already received a code?"
    # são o caminho do código, que é da pessoa.
    outra_forma: '(google|create new account|qr code|send (a )?code|already received a code)'
    # --- WebView da Microsoft (observado 30/09 android-10) ---
    usar_senha: '^\s*use your password\s*$'                           # Button do "Verify your email"
    entrar: '^\s*(next|sign in)\s*$'                                  # Button "Next" do "Enter your password"
    # "Verify your email" com o botão de enviar código: a Microsoft propõe código por padrão.
    verificar_email: '(?ms)^\s*verify your email\b.*^\s*(send|get) (a )?code\b'
    # --- desafios da Microsoft (SUPOSIÇÃO: textos públicos da Microsoft, não observados neste parque) ---
    codigo: '(?m)^\s*(enter code|approve sign[- ]?in request|verify your identity|check your authenticator app)\s*[.!]?\s*$'
    conta_travada: "(?m)^\\s*(help us protect your account|your account has been (temporarily )?(locked|blocked|suspended)|we'?ve detected something unusual about this sign[- ]?in)\\s*[.!]?\\s*$"
    # --- recusas da Microsoft (SUPOSIÇÃO) ---
    senha_incorreta: '(your account or password is incorrect|that password is incorrect|incorrect password)'
    conta_inexistente: "(that microsoft account doesn'?t exist|we couldn'?t find an account with that)"
    # --- "Stay signed in?" (SUPOSIÇÃO: não apareceu no login observado) ---
    manter_conectado: '(?m)^\s*stay signed in\?\s*$'
    nao: '^\s*no\s*$'                                                 # a recusa do "Stay signed in?"
    # --- depois da senha (observado 30/09 android-06, nesta ordem) ---
    # 1. WebView "Microsoft account notice": aviso informativo, não aceite de termos. O único botão é "OK" (o primeiro
    #    toque só rolou a página e deu foco ao botão; o segundo avançou).
    aviso_da_conta: '(?m)^\s*(microsoft account notice|a quick note about your microsoft account)\s*$'
    ok: '^\s*ok\s*$'
    # 2. Diálogo do SISTEMA (com.android.credentialmanager) oferecendo criar chave de acesso: recusa pelo Voltar, sem
    #    tocar no "Continue" dele.
    chave_de_acesso: "(safer with passkeys|with passkeys, you don'?t need)"
    # 3. TextView `message` "Authentication in progress", ~20 s.
    autenticando: '(?m)^\s*authentication in progress\s*$'
    # 4. "Add another account": `empty_state_title`; "MAYBE LATER" (`bottom_flow_navigation_start_button`). O "ADD" ao
    #    lado nunca é tocado.
    outra_conta: '(?m)^\s*would you like to add another account\?\s*$'
    talvez_depois: '^\s*maybe later\s*$'
    # 5. Informativo de privacidade (`illustration_detail_title`), "NEXT".
    privacidade: '(?m)^\s*your data, your way\s*$'
    proximo: '^\s*next\s*$'
    # 6. Dados OPCIONAIS de diagnóstico: "Decline" (`btn_secondary_button`) — o dado opcional não é enviado. "Accept"
    #    nunca.
    diagnostico: '(?m)^\s*getting better together\s*$'
    recusar: '^\s*decline\s*$'
    # 7. Informativo das experiências conectadas, "CONTINUE TO OUTLOOK".
    experiencias: '(?m)^\s*powering your experiences\s*$'
    continuar_no_outlook: '^\s*continue to outlook\s*$'
    # 31.339: o título da barra é o nome da pasta. A lista é a MESMA (`conversation_list`) na Inbox, na Junk, em Sent...: sem este
    # sinal a Junk contava como estado conhecido e a receita ancorada partia dela (prova real do P-043, 11/10). Só as pastas de
    # sistema nomeadas aqui são `pasta_de_email`; título que não casar (pasta própria, outro idioma) segue `caixa_de_entrada`,
    # que é o comportamento de antes: errar para este lado nunca faz o preparo apertar "voltar" na Inbox.
    pasta_de_email: '(?m)^\s*(junk( email)?|spam|sent( items)?|drafts|archive|deleted( items)?|trash|outbox|lixo eletr[oô]nico|itens enviados|enviados|rascunhos|arquivo( morto)?|itens exclu[ií]dos|exclu[ií]dos|lixeira|caixa de sa[ií]da)\s*$'
  # Toda a tabela `pt` é SUPOSIÇÃO: os aparelhos observados rodam em inglês. Os ids (estrutura) valem nos dois idiomas;
  # o que o texto pt não casar fica desconhecido e para o login para a pessoa.
  pt:
    boas_vindas: '(?m)^\s*(boas-vindas ao outlook|bem-vindo ao outlook)\s*$'
    adicionar_conta: '^\s*adicionar conta\s*$'
    continuar: '^\s*continuar\s*$'
    outra_forma: '(google|criar (uma )?nova conta|c[óo]digo qr|enviar (um )?c[óo]digo|j[áa] recebeu um c[óo]digo)'
    usar_senha: '^\s*usar (a )?sua senha\s*$'
    entrar: '^\s*(avan[çc]ar|pr[óo]ximo|entrar)\s*$'
    verificar_email: '(?ms)^\s*verifi(que|car) (o )?seu e-?mail\b.*^\s*(enviar|obter) (um |o )?c[óo]digo\b'
    codigo: '(?m)^\s*(insira o c[óo]digo|digite o c[óo]digo|aprovar (a )?solicita[çc][ãa]o de (entrada|login)|verifi(que|car) (a )?sua identidade|verifique seu aplicativo authenticator)\s*[.!]?\s*$'
    conta_travada: '(?m)^\s*(ajude-nos a proteger (a )?sua conta|sua conta foi (temporariamente )?(bloqueada|suspensa)|detectamos algo incomum (sobre|nesta) (esta )?entrada)\s*[.!]?\s*$'
    senha_incorreta: '(sua conta ou senha est[áa] incorreta|essa senha est[áa] incorreta|senha incorreta)'
    conta_inexistente: '(essa conta microsoft n[ãa]o existe|n[ãa]o encontramos uma conta com)'
    manter_conectado: '(?m)^\s*(continuar conectado|manter-se conectado)\?\s*$'
    nao: '^\s*n[ãa]o\s*$'
    aviso_da_conta: '(?m)^\s*(aviso da conta microsoft|uma nota r[áa]pida sobre (a )?sua conta microsoft)\s*$'
    ok: '^\s*ok\s*$'
    chave_de_acesso: '(mais seguran[çc]a com (as )?chaves de acesso|com (as )?chaves de acesso, voc[êe] n[ãa]o precisa)'
    autenticando: '(?m)^\s*autentica[çc][ãa]o em andamento\s*$'
    outra_conta: '(?m)^\s*(gostaria|deseja) (de )?adicionar outra conta\?\s*$'
    talvez_depois: '^\s*talvez (mais tarde|depois)\s*$'
    privacidade: '(?m)^\s*seus dados, do seu jeito\s*$'
    proximo: '^\s*(avan[çc]ar|pr[óo]ximo)\s*$'
    diagnostico: '(?m)^\s*melhorando juntos\s*$'
    recusar: '^\s*recusar\s*$'
    experiencias: '(?m)^\s*(potencializando|impulsionando) suas experi[êe]ncias\s*$'
    continuar_no_outlook: '^\s*continuar (no|para o) outlook\s*$'
    pasta_de_email: '(?m)^\s*(junk( email)?|spam|sent( items)?|drafts|archive|deleted( items)?|trash|outbox|lixo eletr[oô]nico|itens enviados|enviados|rascunhos|arquivo( morto)?|itens exclu[ií]dos|exclu[ií]dos|lixeira|caixa de sa[ií]da)\s*$'

# Quem está logado: o e-mail da conta, com UM valor na tela (observado 30/09 android-06). Na gaveta, o endereço é um
# TextView SEM id logo abaixo de "Outlook.com", dentro do ComposeView `drawer_folder_composable`: a extração vale só
# dentro dele. Fora ficam a coluna de contas à esquerda (`account_navigation_view`, que pode listar outras), o WebView
# de autenticação (`bannerText`: o endereço aparece antes de a conta existir no app) e a caixa (o endereço de um
# remetente viraria "conta errada").
extracoes:
  email_da_conta:
    dentro_de: [drawer_folder_composable]
    padrao: '^([A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,})$'

# Em ordem de precedência: a primeira regra que casar vence. Desafio e código não passam pelas regras — quem decide é
# o detector (`detectar_conta_travada`), com os sinais genéricos e estes; as regras deles estão aqui para dar NOME à
# tela. `verificar_email` vem antes de `codigo`: é a tela de código que oferece a senha (`sessao.yaml`).
telas:
  - {tela: conta_travada, tipo: desafio, sinal: conta_travada, razao: a Microsoft bloqueou ou pede proteção da conta}
  - {tela: verificar_email, tipo: dois_fatores, sinal: verificar_email,
     razao: a Microsoft propõe verificar o e-mail por código}
  - {tela: codigo, tipo: dois_fatores, sinal: codigo, razao: a Microsoft pede código ou aprovação}
  # Observado 30/09 android-10: o WebView "Enter your password" (`passwordEntry`, o único campo de senha).
  - {tela: senha, tipo: login, formulario_de_senha: true, razao: há um campo de senha na tela}
  # Observado 30/09 android-10: AddAccountActivity, AutoCompleteTextView `auto_complete_input_email`. Vem antes das
  # boas-vindas porque o `btn_primary_button` existe nas duas.
  - {tela: adicionar_conta, tipo: login, ids: [auto_complete_input_email], razao: tela de adicionar conta}
  # Observado 30/09 android-10: SplashActivity, "Welcome to Outlook" com "Add account" e "Create new account". O título é
  # um carrossel (`outlook_stories`): no android-03 a mesma tela dizia "Connected and protected" — por isso a tela é
  # reconhecida pelo carrossel, e não pelo título.
  - {tela: boas_vindas, tipo: login, ids: [outlook_stories], razao: boas-vindas do Outlook sem conta}
  # Observado 30/09 android-10: ~10 s de ProgressBar antes do WebView da Microsoft.
  - {tela: carregando_autenticacao, tipo: carregando, ids: [common_auth_webview_progressbar],
     razao: a página de autenticação da Microsoft está carregando}
  - {tela: carregando, tipo: carregando, sem_elementos: true, razao: tela ainda sem elementos}
  # SUPOSIÇÃO: não apareceu no login observado.
  - {tela: manter_conectado, tipo: intersticial, autenticada: true, sinal: manter_conectado,
     razao: a Microsoft pergunta se continua conectado}
  # Observado 30/09 android-06, na ordem em que vieram depois do "Next". As intermediárias são `intersticial` e
  # autenticadas (a senha foi aceita); quem as fecha, e com que botão, é o `sessao.yaml` (`dispensa.por_tela`).
  - {tela: aviso_da_conta, tipo: intersticial, autenticada: true, sinal: aviso_da_conta,
     razao: aviso informativo da conta Microsoft}
  - {tela: autenticando, tipo: carregando, sinal: autenticando, ids: [message],
     razao: o Outlook conclui a autenticação}
  - {tela: outra_conta, tipo: intersticial, autenticada: true, sinal: outra_conta, ids: [empty_state_title],
     razao: o Outlook oferece adicionar outra conta}
  - {tela: privacidade, tipo: intersticial, autenticada: true, sinal: privacidade, ids: [illustration_detail_title],
     razao: informativo de privacidade do Outlook}
  - {tela: diagnostico, tipo: intersticial, autenticada: true, sinal: diagnostico, ids: [illustration_detail_title],
     razao: o Outlook pede dados opcionais de diagnóstico}
  - {tela: experiencias, tipo: intersticial, autenticada: true, sinal: experiencias, ids: [illustration_detail_title],
     razao: informativo das experiências conectadas do Outlook}
  # A gaveta vem antes da caixa: aberta, ela fica por cima da lista, que continua na árvore.
  - {tela: conta_aberta, tipo: autenticada, autenticada: true, ids: [drawer_folder_composable],
     razao: a gaveta com a conta aberta}
  # 31.339: a mesma lista de mensagens, mas numa pasta de sistema que não é a Inbox (título pelo sinal `pasta_de_email`).
  # Não é estado conhecido: dela o preparo volta (uma vez, o "voltar" do Outlook leva à Inbox) antes de explorar.
  - {tela: pasta_de_email, tipo: autenticada, autenticada: true, sinal: pasta_de_email, ids: [conversation_list],
     razao: lista de uma pasta que não é a caixa de entrada}
  - {tela: caixa_de_entrada, tipo: autenticada, autenticada: true, ids: [conversation_list], razao: caixa de entrada}

# Onde a conta pode ser lida (a caixa, de onde a gaveta abre) e como chegar lá sem efeito externo: voltar do Android e,
# se preciso, reabrir o app uma vez.
estado_conhecido:
  telas: [caixa_de_entrada]
  voltar_max: 3
  reabrir: true

# Leitura visual (item 12.5, ADR-070). OBSERVADO (passo 0, 02/10/2026, android-01, Outlook 5.2635.3): a lista da caixa é um
# `ComposeView` (`conversation_list`, [0,160][720,1115]) e a linha clicável tem quatro filhos SEM texto nem descrição em
# toda a subárvore, mesmo com `snapshotMaxDepth` 200 e `allowInvisibleElements`. A árvore é cega ali; esta região diz que
# remetente e assunto de uma linha da caixa podem ser lidos da IMAGEM, conferidos às cegas por um segundo leitor. É uma
# afirmação sobre ONDE se pode ler, não que a linha nunca será sensível: a triagem do executor continua valendo.
leitura_visual:
  regioes:
    - tela: caixa_de_entrada
      dentro_de: [com.microsoft.office.outlook:id/conversation_list]
      saidas: [remetente, assunto]
      # 31.328: a linha da caixa é conteúdo de quem escreveu o e-mail. "Confirm you're human" na prévia de uma mensagem do
      # Instagram não é a tela de desafio do app (essa o detector da árvore pega, fora daqui) e parava a leitura em
      # `waiting_user` (P-043, 10/10). A triagem do recorte segue recusando código, senha e token.
      conteudo_de_terceiros: true
    # 31.339: a lista das pastas de sistema é o mesmo componente; a leitura de uma linha (Junk, Sent...) vale igual.
    - tela: pasta_de_email
      dentro_de: [com.microsoft.office.outlook:id/conversation_list]
      saidas: [remetente, assunto]
      conteudo_de_terceiros: true

# Dicas ao juiz (item 31.46). OBSERVADO (r-…-e7bc42, 01/10): a etapa livre `verify_sent` foi recusada porque "a lista de
# e-mails está vazia" na pasta Sent, e a linha da lista é um `ComposeView` sem texto nem descrição (ver acima). É um fato
# de desenho da árvore, dito ao verificador junto do pedido; não troca a pós-condição do passo e vale para o app inteiro
# porque a lista das outras pastas (Enviados, Rascunhos) é o mesmo componente (SUPOSIÇÃO: só a caixa foi inspecionada).
dicas_ao_juiz:
  - texto: >-
      Neste app as linhas da lista de e-mails (caixa de entrada e pastas como Enviados) são um ComposeView sem texto na
      hierarquia: a árvore não mostra remetente nem assunto, e isso sozinho não é motivo para recusar a pasta. Linha
      presente prova SÓ que HÁ mensagens na pasta; NÃO prova que uma mensagem específica foi enviada ou recebida. A
      pasta aberta se identifica pelo TÍTULO da barra (Inbox, Sent, Drafts…), não pela lista, que é igual em todas. Se a
      pós-condição pede remetente, assunto ou "o e-mail X foi enviado", sem leitura visual o veredito continua NÃO
      confirmado.
