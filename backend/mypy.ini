# Tipagem gradual (docs/design/evolucao-arquitetural.md, fase A; ADR-030).
#
# Duas velocidades, de propósito:
# - `app.contracts` e `app.modules` (código novo da arquitetura modular) nascem ESTRITOS e o CI reprova;
# - o legado roda com o padrão do mypy e o CI só MEDE (continue-on-error), até cada pacote ser ligado.
# A catraca de `Any` por pacote fica em tests/test_arquitetura.py, sem dependência, e roda também localmente.
#
# Local, sem tocar o venv de produção:
#   uvx --with pydantic==2.13.5 --from mypy==2.3.1 mypy --python-executable .venv/Scripts/python.exe -p app.modules
[mypy]
python_version = 3.13
files = app
plugins = pydantic.mypy
follow_imports = silent
warn_unused_ignores = True
warn_redundant_casts = True

# `strict = True` é opção global (numa seção por módulo é ignorada), por isso as bandeiras vão por extenso.
[mypy-app.contracts.*,app.modules.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_calls = True
disallow_untyped_decorators = True
disallow_any_generics = True
disallow_subclassing_any = True
disallow_any_explicit = True
warn_return_any = True
strict_equality = True
no_implicit_reexport = True

# Adaptadores falam com bibliotecas sem stubs completos: rigorosos, mas Any explícito permitido na borda.
[mypy-app.modules.*.adapters.*,app.modules.*.infrastructure.*]
disallow_any_explicit = False

[mypy-appium.*,selenium.*]
ignore_missing_imports = True
