# Configuração central da POC. Segredos NÃO ficam aqui: use o arquivo .env (veja .env.example).
# Caminhos relativos são resolvidos a partir da raiz do projeto.

server:
  host: 127.0.0.1            # somente loopback
  port: 8000
  # Listener DEDICADO ao canal do worker: serve só /api/worker/ws e nada de REST. Sempre em 127.0.0.1.
  # É o alvo do -R do túnel SSH (scripts/worker-tunnel.ps1 -MapaReverso 18000:8010). Antes o -R apontava para a
  # 8000, e como toda conexão vinda do túnel tem par 127.0.0.1 de verdade, ela era isenta de credencial: qualquer
  # processo local da máquina do worker alcançava a API inteira do central. 0 desliga (parque numa máquina só).
  worker_port: 8010
  allowed_origins:           # origens aceitas (CORS e WebSocket)
    - http://127.0.0.1:8000
    - http://localhost:8000
    - http://127.0.0.1:5173
    - http://localhost:5173

paths:
  data_dir: data
  avd_home: data/avd         # cada AVD (userdata, sessão dos apps) vive aqui; é o isolamento entre instâncias
  evidence_dir: data/evidence
  logs_dir: data/logs
  apk_dirs:                  # únicos diretórios de onde um APK pode ser instalado
    - qa-app/dist
    - apks

android:
  sdk_root: C:\Android\Sdk   # pode ser sobrescrito por ANDROID_SDK_ROOT no .env
  # Imagem padrão das instâncias. Ver docs/relatorio-validacao.md para o custo medido de cada imagem.
  # Apps sociais costumam ser arm64: só imagens google_apis API 30+ têm tradução ARM (medido: API 28/29 e aosp_atd NÃO têm).
  system_image: system-images;android-34;google_apis;x86_64
  # PERFIL LEVE (medido): `-lowram` faz o emulador RESPEITAR ram_mb (sem ela a imagem impõe 2560 MB) →
  # ≈2,4 GB reais por instância em vez de ≈3,7 GB, e o snapshot passa a carregar (pronto para automação em ≈16 s).
  # Para voltar ao perfil antigo: ram_mb: 2560, extra_emulator_args: [], est_instance_ram_mb: 3700.
  ram_mb: 1536
  cores: 2
  width: 720
  height: 1280
  density: 320
  data_partition: 4G
  gpu_mode: swiftshader_indirect   # sessão RDP/servidor: sem GPU do host
  boot_timeout_s: 480
  # Guarda de capacidade: um boot só é aceito se, descontado o que os boots em andamento ainda vão alocar,
  # couber esta instância (est_instance_ram_mb) e sobrar min_free_ram_mb_after_boot para o host.
  est_instance_ram_mb: 3000        # medido: 2,4 GB em repouso e ≈2,9 GB com app + automação em uso (Android 14 + -lowram + 1536 MB)
  min_free_ram_mb_after_boot: 1500
  extra_emulator_args: ["-lowram"]
  # Hibernação: ao ceder a vaga no rodízio o aparelho salva um snapshot (≈1 s, ≈1,5 GB em disco) e desliga;
  # acordar leva ≈16 s até ficar pronto para automação (boot a frio: 73–105 s). Snapshot é de uso único e nunca convive com reset.
  hibernation: true
  wake_timeout_s: 90

instances:
  # android-01…08 emuladores locais; android-11 é a loja; android-09, 10 e 12…15 são aparelhos do WORKER
  # (outra máquina, por túnel SSH — ver docs/parque-distribuido.md). As 6 vagas remotas não gastam RAM daqui.
  # Teto em vigor: `limits.max_active_devices` é travado em 10 no código (config.py, Field(le=10)); com 4 locais
  # online + 6 remotos batemos exatamente nele. Passar disso exige mexer naquele limite.
  count: 15
  id_prefix: android-
  base_console_port: 5554    # instância i usa 5554 + 2*(i-1) → serial emulator-<porta>
  base_system_port: 8200     # appium:systemPort exclusivo por instância
  base_mjpeg_port: 9200      # appium:mjpegServerPort exclusivo
  base_chromedriver_port: 9515
  default_app: qa-messenger
  accounts:                  # rótulo de configuração do perfil de conta de cada instância
    android-01: qa-user-01
    android-02: qa-user-02
    android-03: qa-user-03
    android-04: qa-user-04
    android-05: qa-user-05
    android-06: qa-user-06
    android-07: qa-user-07
    android-08: qa-user-08
    android-09: qa-user-09
    android-10: qa-user-10
    android-12: qa-user-12
    android-13: qa-user-13
    android-14: qa-user-14
    android-15: qa-user-15
  # Por instância. Validado na carga: chave escrita errada é ERRO, não é ignorada.
  overrides:
    android-11:                # a loja: ver `store` abaixo
      system_image: "system-images;android-34;google_apis_playstore;x86_64"
      window: true             # a conta Google é digitada na JANELA do emulador, nunca pelo painel
      hibernation: false       # imagem de loja é build `user` (sem adb root): sem snapshot, boot a frio
      ram_mb: 2560             # Play Store + serviços Google não cabem no perfil enxuto do parque
      extra_emulator_args: []
      est_instance_ram_mb: 4100   # medido: 4,0 GB de working set com janela e serviços Google
  # Aparelho ADB EXTERNO no lugar do emulador da instância (celular físico por USB, `host:porta` por rede, contêiner):
  # não ocupa RAM do host nem vaga do rodízio; o painel nunca o liga, desliga, reseta ou hiberna — só usa.
  # É o caminho para SMS real e números de WhatsApp (emulador não tem SIM). Ex.: android-10: "R58M12ABCDE"
  external:
    # Etapa 0 do parque distribuído (docs/parque-distribuido.md): emulador que roda no NOTEBOOK worker
    # (192.168.1.19) e chega aqui por túnel SSH — `ssh -L 15555:127.0.0.1:5555`. O emulador escuta só em
    # loopback do outro lado (medido), então sem o túnel não há como alcançá-lo nem na mesma rede.
    # Túnel mantido por `scripts/worker-tunnel.ps1 -Instalar` (tarefa agendada, sobe no boot e reconecta):
    #   pwsh -File scripts\worker-tunnel.ps1 -Instalar -Mapa "15555:5555,15557:5557,15559:5559,15561:5561,15563:5563,15565:5565"
    # Do outro lado, um emulador por tarefa agendada (scripts/worker-emulator.ps1) — worker-01 … worker-06.
    android-09: "127.0.0.1:15555"
    android-10: "127.0.0.1:15557"
    android-12: "127.0.0.1:15559"
    android-13: "127.0.0.1:15561"
    android-14: "127.0.0.1:15563"
    android-15: "127.0.0.1:15565"

  # Aparelho-loja: emulador com imagem PLAY STORE, logado na SUA conta Google, que serve de fonte oficial do
  # aplicativo. O projeto o liga e desliga, mas NUNCA lhe despacha tarefa. O override dele está em `overrides` acima.
  # Imagem:  pwsh -File scripts\install-prereqs.ps1 -ImageTags google_apis,google_apis_playstore -SkipAppium
  store: android-11

appium:
  host: 127.0.0.1
  port: 4723
  dir: tools/appium          # instalação local com versões fixadas
  autostart: true
  new_command_timeout_s: 0   # sessões permanecem abertas
  server_launch_timeout_ms: 180000
  adb_exec_timeout_ms: 60000

# Valores iniciais dos limites; depois de iniciados, são editáveis pelo painel (persistidos no SQLite).
limits:
  max_active_devices: 10
  max_ai_concurrency: 4
  boot_parallelism: 2
  max_steps_per_objective: 12
  max_actions_per_step: 12
  max_attempts_per_step: 3
  step_timeout_s: 180
  objective_timeout_s: 900
  driver_call_timeout_s: 45
  retry_backoff_s: 5
  no_progress_limit: 4
  ai_max_calls_per_objective: 60
  ai_max_tokens_per_run: 3000000
  capture_grid_interval_s: 5
  capture_focus_interval_s: 1
  frame_max_age_ms: 6000
  log_retention_days: 14
  evidence_retention_days: 14
  # Rodízio — N contas sobre K vagas de RAM: o scheduler liga o aparelho quando há tarefa para ele e, sem vaga,
  # desliga (hiberna) um aparelho ocioso. Nunca desliga aparelho em uso, em foco no painel, com o usuário no
  # controle ou com item bloqueado/incerto de execução aberta.
  auto_start_devices: true
  max_online_devices: 4           # vagas: ≈2,6 GB cada; ajuste à RAM livre do host (a guarda de RAM continua valendo)
  min_online_dwell_s: 30
  idle_stop_s: 0                  # >0 também hiberna por ociosidade, mesmo sem disputa de vaga

ai:
  # O provedor real é escolhido no .env (AI_PROVIDER). Quando for externo, screenshots e textos
  # das telas SAEM desta máquina para o provedor. Telas com campo de senha nunca são enviadas.
  # --- alavancas de custo (cada uma pode voltar ao valor antigo indicado entre parênteses) ---
  screenshot_max_side: 1280       # candidato 768: menos tokens por imagem (limites e x,y já acompanham a escala); só adotar após a bateria
  max_hierarchy_elements: 90      # (140) linhas da hierarquia no prompt, por relevância; a árvore local é completa
  image_policy: auto              # (always) auto = decide pela hierarquia; imagem só quando precisa ou o modelo pede
  rich_tree_min_elements: 8
  strong_model_for_side_effect: true   # etapa com efeito externo decide no modelo de escalonamento
  verify_max_model_calls: 2       # (5) verificação por visão só rejulga quando a tela muda
  recipes: replay                 # (off) aprende a etapa uma vez com a IA e repete por seletores; shadow = só compara
  flows: true                     # (false) comando repetido reaproveita o plano, sem chamar o planejador
  pathfinder_wait_s: 240          # (0) em execução com vários aparelhos, o 1º aprende e os demais esperam por ele
  prices:                         # US$ por milhão de tokens [entrada, cache lido, cache gravado, saída]
    claude-opus-5: [5.0, 0.5, 6.25, 25.0]
    claude-sonnet-5: [2.0, 0.2, 2.5, 10.0]
    claude-haiku-4-5: [1.0, 0.1, 1.25, 5.0]
    claude-opus-4-8: [5.0, 0.5, 6.25, 25.0]   # destino documentado do fallback de recusa; sem isto a linha vinha "sem preço"
    # Modelo LOCAL de graça declara-se assim (e só assim): [0, 0, 0, 0]. Modelo AUSENTE desta tabela é contado
    # pelo preço mais caro dela, nunca como zero — senão um destino não cadastrado sairia de graça no teto.

  # --- capacidade DECLARADA por modelo (item 7.1) -----------------------------
  # Antes isto era aprendido por erro 400 e esquecido a cada reinício: todo arranque pagava uma requisição
  # rejeitada por modelo antes da primeira decisão. Modelo ausente daqui é tratado de forma conservadora
  # (sem strict, sem thinking, sem effort, JSON por json_object) — que é o certo para um modelo local pequeno.
  # `min_cache_tokens` (achado #100): prefixo cacheável mínimo de CADA modelo, não monótono entre gerações
  # (platform.claude.com/docs, "prompt caching"). Medido ao vivo: Sonnet 5 cacheia (mínimo 1024, prefixo do ator
  # ≈ 4,3 mil tokens); Haiku 4.5 NÃO (mínimo 4096, prefixo do verificador ≈ 1 mil tokens) — o `cache_control` que
  # o provedor põe no verificador fica inerte nesse modelo, silenciosamente, sem isto declarado.
  models:
    claude-opus-5:    {vision: true, tools: true, strict_tools: false, structured_output: json_schema, thinking: true, effort: true, min_cache_tokens: 512}
    claude-sonnet-5:  {vision: true, tools: true, strict_tools: false, structured_output: json_schema, thinking: true, effort: true, min_cache_tokens: 1024}
    claude-opus-4-8:  {vision: true, tools: true, strict_tools: false, structured_output: json_schema, thinking: true, effort: true, min_cache_tokens: 1024}
    # strict_tools: false nos três acima é DECISÃO registrada, não omissão: com o conjunto de ferramentas de hoje
    # a API responde "Schema is too complex" (17 vezes em 3 dias de log real). A revalidação por Pydantic vale igual.
    claude-haiku-4-5: {vision: true, tools: true, strict_tools: false, structured_output: json_schema, thinking: false, effort: false, min_cache_tokens: 4096}

  # --- provedores e funções (item 7.1) ----------------------------------------
  # `providers` vazio e `roles` vazio = o de sempre: um provedor só, vindo do .env (AI_PROVIDER), com os modelos
  # por função de AI_MODEL_*. Nada muda enquanto estes dois blocos não existirem.
  #
  # Para ligar um endpoint próprio compatível com OpenAI (vLLM, por exemplo):
  #
  # providers:
  #   local:
  #     kind: openai
  #     base_url: http://127.0.0.1:8001/v1     # vLLM em WSL2/Docker; o Windows não roda vLLM nativo
  #     api_key_env: VLLM_API_KEY              # NOME da variável de ambiente, nunca a chave
  #     sends_data_externally: false           # é isto que a aba IA mostra por função
  #   anthropic:
  #     kind: anthropic
  #     fallback_model: claude-sonnet-5        # modelo a usar quando ELE for destino de um fallback_provider
  # models:
  #   qwen2.5-vl-7b-awq: {vision: true, tools: true, strict_tools: false, structured_output: json_object,
  #                       thinking: false, effort: false, max_output: 4096}
  # roles:
  #   decide:  {provider: local, model: qwen2.5-vl-7b-awq, fallback_provider: anthropic, timeout_s: 90}
  #   verify:  {provider: local, model: qwen2.5-vl-7b-awq, timeout_s: 60}
  #   plan:    {provider: anthropic}
  #   social:  {provider: anthropic, refusal_fallback: false}   # sem fallback pago na escrita da persona
  #
  # SEM `fallback_provider` escrito, a falha do endpoint local NÃO cai no provedor pago: o erro sobe. É isto que
  # cumpre "sem fallback pago silencioso". Quando cai, a queda vira linha da execução e linha própria em ai_calls.
  # Prazos por função sem nada declarado: plan 120 s · decide 45 s · verify 30 s · escalation 60 s · social 60 s
  # (o medido em 908 chamadas reais foi, no máximo, 29,5 / 12,2 / 7,6 / — / 13,4 s).

releases:                         # entrega e conferência de versão no parque
  verify_max_age_h: 24            # validade do "está instalado aqui"; passado isso, relê do aparelho. 0 desliga
  # Prazos do instalador, em segundos. Estão aqui porque o custo REAL deles muda com a máquina: no worker
  # remoto, sob disputa de CPU, `adb shell` já estourou 30 s durante uma entrega — e o conjunto do Instagram
  # (238 MB de base + split, por install-multiple numa única conexão SSH) é o caso mais pesado que existe.
  # Meça com scripts/prova-instagram-remoto.ps1 e ajuste AQUI; nada disso é constante de código.
  profile_timeout_s: 30           # leitura do perfil do aparelho (getprop, densidade)
  inspect_timeout_s: 40           # leitura do estado do app (pm path / dumpsys)
  install_timeout_s: 900          # install / install-multiple do conjunto inteiro
  launch_deadline_s: 90           # prova de abertura: o app tem de aparecer e ficar de pé

apps:
  - id: qa-messenger
    name: QA Messenger
    package: com.pocqa.messenger
    activity: .MainActivity
    apk_path: qa-app/dist/qa-messenger.apk
    builtin: true
    nav_hints: >-
      App de QA com contas fictícias. A tela inicial lista conversas e mostra "Conta: <conta>" no topo.
      Tocar em um contato abre a conversa; o campo "Mensagem" e o botão "Enviar" ficam na base.
      Cada mensagem mostra um status: "Enviando…", "Enviada ✓", "Entregue ✓✓", "Lida ✓✓" ou "Falha no envio ✕".
      O botão "Perfil" abre um formulário (Nome, E-mail, Cidade, Receber notificações, Salvar).
      Se aparecer o aviso "Novidades da versão", toque em "Agora não".
    known_selectors:
      account_label: id=com.pocqa.messenger:id/account_label
      conversation_list: id=com.pocqa.messenger:id/conversation_list
      message_input: id=com.pocqa.messenger:id/message_input
      send_button: id=com.pocqa.messenger:id/send_button
