# Configuração do AGENTE, que roda na máquina do worker — não no servidor central.
#
# Copie para `worker.yaml` na máquina do worker (por padrão em C:\farm\worker.yaml) e ajuste. A credencial NÃO
# vem aqui: o agente a grava sozinho em `worker-credential.json` depois de trocar o token de inscrição, para que
# o arquivo que alguém edita à mão nunca contenha segredo.
#
# Primeira partida:
#   1. no painel, Infraestrutura → "Inscrever servidor" gera um token de uso único (validade de 1 h);
#   2. nesta máquina:  python -m app.worker --config worker.yaml --enroll <token>
#   3. a partir daí:   python -m app.worker --config worker.yaml
#
# Rode como SERVIÇO (tarefa agendada no Windows, unidade systemd no Linux). Processo iniciado dentro de uma
# sessão SSH pertence ao job dela e o Windows o mata no logout — medido em 19/09, com o emulador morrendo em
# segundos já com o WHPX operacional.

# Endereço do servidor CENTRAL. O worker liga para lá; o central nunca liga para cá.
#
# `https://` obrigatório para qualquer endereço que não seja 127.0.0.1, e o agente RECUSA subir se for `http://`:
# esta conexão carrega a credencial permanente deste worker a cada reconexão, mais screenshots e evidências. Numa
# rede Wi-Fi com chave compartilhada, "em claro" quer dizer "legível por quem tem a chave".
#
# Com túnel SSH (o padrão), o endereço é o do lado de cá do túnel — `http://127.0.0.1:18000` — e ali o tráfego já
# vai cifrado pelo próprio túnel.
server: https://central.parque.local:8000

# Autoridade que assinou o certificado do central, quando ele é uma CA sua (parque doméstico). Sem isto, um
# certificado privado é recusado pela verificação padrão — corretamente. Não existe opção de ignorar a
# verificação: ignorá-la seria aceitar justamente o certificado que um ataque apresentaria.
# ca_file: C:/farm/parque-ca.pem

# Identidade estável desta máquina. Sobrevive a reinstalação do agente — é por ela que o central reconhece
# quem voltou.
worker_id: worker-lan-01
name: Notebook da sala

# Caminhos DESTA máquina. Os dois têm padrão por sistema e podem ser omitidos: no Windows `C:\Android\Sdk` e
# `C:\farm`; fora dele, `~/Android/Sdk` e `~/farm`. Num worker Linux instalado por `scripts/worker-install.sh`,
# a unidade systemd roda como a conta de serviço `farm` e o `work_dir` costuma ser `/var/lib/farm` — escreva-o
# aqui quando for esse o caso.
sdk_root: C:\Android\Sdk
work_dir: C:\farm

# `central` = o Appium deste servidor dirige os aparelhos pelo túnel (provado em campo: 6 de 6, 142 s).
# `local`   = há um Appium nesta máquina; menor latência e ADB+Appium na rede privada dela.
appium: central
# appium_url: http://127.0.0.1:4723      # só quando `appium: local`

# Quantos aparelhos esta máquina aceita manter ligados ao mesmo tempo.
max_slots: 6

# Um boot por vez. Subir quatro emuladores juntos travou os quatro em ANR do SystemUI; um a um subiram limpos em
# 104–192 s (medido em 19/09).
boot_parallelism: 1

# Guarda de capacidade DESTA máquina: o central exclui aparelho externo de `slots_used()` de propósito, então
# quem impede a máquina de afundar é ela mesma. Cada boot RESERVA o custo do aparelho no HOST antes de subir o
# emulador (e o libera ao fim do boot); o boot só entra se, descontadas as reservas dos que ainda estão subindo,
# sobrar `min_free_ram_mb`. Num contêiner ou unidade systemd com limite de memória, a conta usa a folga do
# cgroup, não a RAM do host.
min_free_ram_mb: 4096
# O custo por aparelho vem do perfil medido da IMAGEM (backend/app/devices/perfis.py): google_apis ≈2,7 GB no
# host, Play Store ≈5,2 GB; com `ram_mb` explícito, `ram_mb` + 1100 MB do processo do emulador. Este número é
# só um PISO para essa conta — nunca a baixa. Era a conta inteira (1800), abaixo de todo custo medido.
# ram_per_device_mb: 3000

# Perfil de hardware dos AVDs que este worker cria. Duas grandezas que não se misturam: a RAM do CONVIDADO
# (`ram_mb`, o que o Android enxerga) e o custo no HOST (convidado + processo do emulador + app rodando).
android:
  system_image: system-images;android-34;google_apis;x86_64
  # Omitido = perfil da IMAGEM, medido: google_apis → convidado de 2048 MB com `-lowram` (≈2,7 GB no host).
  # NÃO use 1536 nesta imagem: entra em thrash pós-boot com os apps Google (android-12 em 23/09, load 22; o
  # android-01 e o android-04 saturaram de novo em 26/09 ao abrir o Instagram e ao receber um app — B21).
  # Declarar `ram_mb` é decidir por conta própria: aí vale só o que estiver em `extra_emulator_args`, e sem
  # `-lowram` a imagem Android 14 impõe 2560 MB e ignora o número.
  # ram_mb: 2048
  cores: 2
  width: 720
  height: 1280
  density: 320
  gpu_mode: swiftshader_indirect
  # Sem `-lowram` aqui de propósito: o perfil da imagem já o põe onde ela precisa (google_apis, AOSP). Declarado
  # neste bloco, ele valeria também para a VM da loja (ela não tem como sobrescrever flags), e o perfil da
  # imagem com Play Store roda sem ele.
  # extra_emulator_args: []
  # Esta máquina salva snapshot (hibernar/acordar)? É ELA quem responde: o agente declara isto ao central no
  # `Hello`, e o painel só oferece "Hibernar" para os aparelhos dela quando a resposta é `true`. Com `false`
  # (o padrão) o emulador sobe com `-no-snapshot` e "Acordar" é recusado em vez de virar um boot a frio
  # disfarçado. Cada snapshot ocupa ~1,5 GB em disco por aparelho.
  hibernation: false
  # DNS entregue aos emuladores desta máquina (`-dns-server`). Vazio = autodetecção do emulador, que usa os
  # primeiros DNS do host e NÃO faz o fallback que o Windows faz: com um DNS morto na frente, a rede móvel do
  # convidado (10.0.2.3) fica sem resolver nome. Confira com `Resolve-DnsName <host> -Server <ip>` antes.
  # dns_servers: ["192.168.1.1", "8.8.8.8"]

# Os aparelhos desta máquina e a instância do parque que cada um serve. `console_port` é a porta do console do
# emulador; a porta de ADB é sempre ela + 1, e é essa que o túnel encaminha.
devices:
  - { instance_id: android-09, avd_name: worker-01, console_port: 5554 }
  - { instance_id: android-10, avd_name: worker-02, console_port: 5556 }
  - { instance_id: android-12, avd_name: worker-03, console_port: 5558 }
  - { instance_id: android-13, avd_name: worker-04, console_port: 5560 }
  - { instance_id: android-14, avd_name: worker-05, console_port: 5562 }
  - { instance_id: android-15, avd_name: worker-06, console_port: 5564 }
  # Aparelho físico ou contêiner que este agente NÃO cria nem liga, só opera por ADB:
  # - { instance_id: android-16, avd_name: "", console_port: 5566, managed: false }
  #
  # A VM da LOJA (Play Store) num worker. `system_image`, `ram_mb` e `window` valem só para ESTE aparelho e
  # vencem o bloco `android:` acima — sem eles, o agente aplicava a mesma configuração a todos os seus
  # aparelhos e a loja não podia sair da máquina central. A imagem precisa ser `google_apis_playstore`, e a
  # janela existe porque a conta Google é digitada NA JANELA do emulador: o painel recusa texto na loja de
  # propósito (cairia em `adb shell input text` com o segredo na linha de comando desta máquina). Com a loja
  # aqui, essa janela está na área de trabalho DESTA máquina — o acesso a ela é seu, fora da plataforma.
  # Lembre: a conta Google vale só nesta VM; o que ela instalar é copiado por ADB para os outros aparelhos.
  # - { instance_id: android-11, avd_name: loja, console_port: 5566,
  #     system_image: "system-images;android-34;google_apis_playstore;x86_64", ram_mb: 4096, window: true }
