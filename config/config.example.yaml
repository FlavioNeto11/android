# PONTO DE PARTIDA da configuração (achado #177). Copie este arquivo para `config/config.yaml` — o
# `scripts/start.ps1` faz isso sozinho na primeira vez, como já fazia com o `.env` — e ajuste o que for desta
# máquina. `config/config.yaml` NÃO é versionado: ele é o retrato do SEU parque, e cada ajuste local seu
# deixaria de ser um diff no repositório.
#
# O que este exemplo é, de propósito: **4 emuladores locais, nada de remoto, nada de loja**. Uma instalação
# nova sobe assim sem nenhum cartão fantasma e com `/api/health` limpo (menos `ai_not_configured`, até você
# pôr a chave no `.env`). Cada bloco opcional está comentado abaixo, com o que ele exige para funcionar.
#
# Segredos NÃO ficam aqui: use o `.env` (veja `.env.example`). Caminhos relativos saem da raiz do projeto.

server:
  host: 127.0.0.1            # somente loopback
  port: 8000
  # Listener DEDICADO ao canal do worker (só /api/worker/ws, nada de REST), alvo do `-R` do túnel SSH.
  # 0 = desligado, que é o certo com o parque numa máquina só. Ligue-o (ex.: 8010) ao inscrever um worker.
  worker_port: 0
  # Sair do loopback (host: 0.0.0.0) exige TRÊS coisas juntas, e o backend recusa subir sem qualquer uma:
  # API_TOKEN no .env, `public_hosts` aqui e TLS (tls_cert + tls_key, OU tls_behind_proxy com um
  # Caddy/nginx/IIS terminando o TLS na frente). Sem isso, na porta de rede iriam em claro o token, a
  # credencial do worker, o cookie de sessão do painel e todo screenshot. Ver docs/worker.md.
  # public_hosts: [parque.exemplo.local]
  # tls_behind_proxy: true
  # Portal público pelo túnel da Cloudflare (ADR-073, painel em https://<host>/central): `server.host` segue
  # 127.0.0.1 e são TRÊS linhas aqui (mais API_TOKEN no .env; sem ele ninguém entra pelo endereço público):
  #   public_hosts: [dev.nvit.com.br]       # o `Host` é o que separa o público do local
  #   tls_behind_proxy: true                # a Cloudflare termina o TLS; o cookie de sessão ganha Secure
  #   allowed_origins: + https://dev.nvit.com.br   (sem ela o POST do login leva 403 forbidden_origin)
  # Origens aceitas (CORS, conferência de CSRF e WebSocket): o que o navegador mostra na barra de endereços.
  allowed_origins:
    - http://127.0.0.1:8000
    - http://localhost:8000
    - http://127.0.0.1:5173
    - http://localhost:5173
    # - https://dev.nvit.com.br
  # CSP do index.html do painel (29.91): aplicar | so_relatar (Report-Only, violações no console) | desligada.
  # Vale na subida; se uma tela quebrar no central, "so_relatar" e reiniciar a farm-central desfazem sem deploy.
  csp_do_painel: aplicar

paths:
  data_dir: data
  avd_home: data/avd         # cada AVD (userdata, sessão dos apps) vive aqui; é o isolamento entre instâncias
  evidence_dir: data/evidence
  logs_dir: data/logs
  apk_dirs:                  # únicos diretórios de onde um APK pode ser instalado
    - qa-app/dist
    - apks

android:
  sdk_root: C:\Android\Sdk   # pode ser sobrescrito por ANDROID_SDK_ROOT no .env
  # Imagem padrão. É a que `scripts/install-prereqs.ps1` instala sem argumento nenhum.
  # Apps sociais costumam ser arm64: só imagens google_apis API 30+ têm tradução ARM (medido).
  system_image: system-images;android-34;google_apis;x86_64
  # RAM do CONVIDADO (`hw.ramSize`, o que o Android enxerga). Omitida = perfil medido da IMAGEM
  # (backend/app/devices/perfis.py): google_apis → 2048 MB com `-lowram`, ≈2,7 GB no host; Play Store → 4096 MB,
  # ≈5,2 GB. NÃO use 1536 com google_apis: entra em thrash pós-boot com os apps Google (android-12 em 23/09,
  # load 22; android-01 e android-04 de novo em 26/09 ao abrir o Instagram e ao receber um app — B21).
  # Declarar um número é decisão sua e vale como está (com as `extra_emulator_args` daqui, sem as do perfil);
  # sem `-lowram`, a imagem Android 14 impõe 2560 MB e ignora o número.
  # ram_mb: 2048
  cores: 2
  width: 720
  height: 1280
  density: 320
  data_partition: 4G
  # Renderizador do emulador (`-gpu`). O emulador 37.1.11 atende de fato dois valores (medido em 30/09/2026):
  #   swiftshader_indirect (ou swiftshader)  renderização por software; funciona em sessão RDP e em servidor sem GPU
  #   host                                   GPU desta máquina (~200 MB de VRAM por emulador); funciona pelo serviço
  # Argumento aceito não é renderizador usado: `angle_indirect` é recusado ("switching to 'auto'") e `swangle` acaba
  # em SwiftShader. O que ele SELECIONOU sai no log (`emuglConfig_init: … gles_mode_selected`), e o painel mostra:
  # pedido diferente do selecionado vira aviso no aparelho. Há app que derruba o emulador no SwiftShader (o Outlook,
  # `renderizador_recusado` no app.yaml dele): ele só é instalado e aberto em aparelho com `host`.
  # Por aparelho: `instances.overrides.<id>.gpu_mode` (exemplo abaixo). Mudar exige reiniciar o backend e o
  # aparelho, e o boot seguinte é a frio (o snapshot da hibernação é do hardware de antes).
  gpu_mode: swiftshader_indirect
  # Relatório de falha pendente do emulador (29.55): com o padrão do emulador ("ask"), um dump deixado por um emulador
  # que caiu faz toda subida parar no diálogo de consentimento. `never` não pergunta nem envia; "" volta ao
  # padrão do emulador. Antes de cada subida o dump vai para data/quarentena-crash/ (mover, nunca apagar).
  crash_report_mode: never
  boot_timeout_s: 480
  # Guarda de capacidade: um boot só é aceito se, descontado o que os boots em andamento ainda vão alocar,
  # couber esta instância (custo no HOST) e sobrar min_free_ram_mb_after_boot para o host. O custo no host vem
  # do perfil medido da imagem; `est_instance_ram_mb` só se você MEDIU outro número nesta máquina (ele vale para
  # toda instância sem override, qualquer que seja a imagem).
  # est_instance_ram_mb: 3000
  min_free_ram_mb_after_boot: 1500
  # Admissão por CPU (29.33): boot novo numa máquina com a CPU ACIMA deste percentual espera — no host, recusa com espera
  # crescente (como a RAM, motivo "CPU do host no limite"); num worker, o rodízio segura pela CPU da última batida. Subir
  # outro emulador com a máquina saturada alonga todos os boots em voo. 100 desliga. CPU desconhecida nunca recusa.
  # O prazo do preparo pós-boot também cresce com a CPU (60 s até 50 %, 180 s a 100 %): não tem chave, é a regra.
  max_cpu_percent_before_boot: 85
  # Redundante com o perfil (que já põe `-lowram` em google_apis e AOSP), mas necessário se você declarar
  # `ram_mb` acima: com número explícito, só valem as flags daqui.
  extra_emulator_args: ["-lowram"]
  # Janela (29.48, 03/10/2026): com `true`, o emulador sobe como `qemu-system-x86_64`, não como o `-headless`. O backend
  # lançado como serviço (tarefa agendada, sessão 0, sem área de trabalho) faz o `-headless` girar uma thread a ~100 %
  # de um núcleo por aparelho, mesmo ocioso (K-078); com janela, isso some. Na sessão 0 a janela não aparece para
  # ninguém. Rodando numa sessão interativa (`start.ps1 -Dev`), as janelas aparecem na área de trabalho. `window` não
  # entra na assinatura do snapshot: trocar não invalida a hibernação. `false` = o comportamento antigo.
  window: true
  # Hibernação por snapshot: ceder a vaga salva o estado (≈1 s) e acordar leva ≈16 s até a automação ficar
  # pronta, contra 73–105 s de boot a frio. O padrão do CÓDIGO é `false` (quem não declara não hiberna); aqui é
  # `true` por escolha medida. Cada snapshot ocupa ~1,5 GB de disco por instância.
  hibernation: true
  # DNS entregue aos emuladores desta máquina (`-dns-server`). Vazio = autodetecção do emulador, que usa os
  # primeiros DNS do host e NÃO faz o fallback que o Windows faz: com um DNS morto na frente, a rede móvel do
  # convidado (10.0.2.3) fica sem resolver nome. Confira com `Resolve-DnsName <host> -Server <ip>` antes.
  # dns_servers: ["192.168.1.1", "8.8.8.8"]
  wake_timeout_s: 90
  # Apps de fundo DESATIVADOS no preparo dos aparelhos da automação (`pm disable-user --user 0`), para caber nos 2 GB
  # do convidado. Medido em 29/09: app Google 101 MB, Android System Intelligence 37 MB e Mensagens 22 MB no
  # android-06; no android-04, load 14,7 e 82 MB livres, com YouTube, YouTube Music, Gmail e Bem-estar digital
  # subindo sozinhos. Esta é a lista conservadora (o padrão do código). Pacote que a imagem não tem é ignorado.
  # Reversível: tire um pacote e o preparo seguinte o reativa (`pm enable`) — só o que ele mesmo desativou; `[]`
  # devolve tudo. NUNCA entram (o backend não sobe): Play Store, GMS, GSF, WebView, teclado, launcher, SystemUI,
  # Chrome, io.appium.* e o app alvo — o declarado em backend/app/conhecimento/apps (o Instagram) e o de
  # `apps`/`contas.sessao`; o do catálogo do banco sai sozinho da lista.
  # Vale para os emuladores daqui e os dos workers (o central os prepara pelo túnel); a loja e o celular físico ficam
  # fora. Por aparelho: `instances.overrides.<id>.desativar_apps`.
  desativar_apps:
    - com.google.android.googlequicksearchbox   # app Google
    - com.google.android.as                     # Android System Intelligence
    - com.google.android.apps.messaging         # Mensagens
    - com.google.android.youtube
    - com.google.android.apps.youtube.music
    - com.google.android.gm                     # Gmail
    - com.google.android.apps.wellbeing         # Bem-estar digital
    - com.google.android.apps.photos
    - com.google.android.apps.maps
    - com.google.android.calendar
    - com.google.android.apps.docs              # Drive
    - com.google.android.videos                 # Google TV
    - com.google.android.apps.tachyon           # Meet

instances:
  # CPU desta máquina (%) a partir da qual o reparo automático de aparelho espera em vez de reiniciar (ADR-055):
  # com a máquina saturada, reiniciar um convidado só piora. 101 desliga.
  remediation_host_cpu_max: 90
  # Quantos emuladores LOCAIS esta máquina gerencia: android-01 … android-04. Suba este número conforme a RAM
  # livre — a guarda acima recusa o boot que não couber, com o motivo no cartão.
  count: 4
  id_prefix: android-
  base_console_port: 5554    # instância i usa 5554 + 2*(i-1) → serial emulator-<porta>
  base_system_port: 8200     # appium:systemPort exclusivo por instância
  base_mjpeg_port: 9200      # appium:mjpegServerPort exclusivo
  base_chromedriver_port: 9515
  default_app: qa-messenger
  accounts:                  # rótulo de configuração do perfil de conta de cada instância
    android-01: qa-user-01
    android-02: qa-user-02
    android-03: qa-user-03
    android-04: qa-user-04

  # --- BLOCOS OPCIONAIS: ligue um de cada vez, e confira `/api/health` depois de cada um ------------------
  #
  # a) Configuração POR INSTÂNCIA. Chave escrita errada é ERRO na carga, não é ignorada em silêncio.
  # overrides:
  #   android-04:
  #     ram_mb: 2560
  #     hibernation: false
  #   android-03:
  #     gpu_mode: host           # só este aparelho na GPU do host (o que recebe o Outlook); os outros seguem o padrão
  #
  # b) Aparelho ADB EXTERNO no lugar do emulador da instância (celular por USB, `host:porta` por rede,
  #    emulador de OUTRA máquina por túnel SSH). Não gasta RAM deste host nem vaga do rodízio; o painel nunca
  #    o liga, desliga, reseta ou hiberna — só usa. É o caminho para SMS real (emulador não tem SIM).
  #    Cada id citado aqui precisa existir (id <= count), e o endereço precisa estar REALMENTE alcançável:
  #    endereço morto vira "aparelho externo … não está conectado ao ADB" e o monitor tenta reconectar sem fim.
  #    Ver docs/parque-distribuido.md.
  # external:
  #   android-04: "127.0.0.1:15555"
  #
  # c) Aparelho-LOJA: emulador com imagem PLAY STORE, logado na SUA conta Google, que serve de fonte oficial
  #    do aplicativo (o sistema não baixa APK de lugar nenhum). O projeto o liga e desliga, mas NUNCA lhe
  #    despacha tarefa. Exige a imagem, que o instalador padrão NÃO baixa:
  #      pwsh -File scripts\install-prereqs.ps1 -ImageTags google_apis,google_apis_playstore -SkipAppium
  #    Sem a imagem instalada, `/api/health` nasce `degraded` com `system_image_missing`.
  # store: android-04
  # overrides:
  #   android-04:
  #     system_image: "system-images;android-34;google_apis_playstore;x86_64"
  #     window: true             # a conta Google é digitada na JANELA do emulador, nunca pelo painel
  #     hibernation: false       # imagem de loja é build `user` (sem adb root): sem snapshot
  #     extra_emulator_args: []  # sem o `-lowram` global: o perfil da imagem com Play Store roda sem ele
  #     # `ram_mb` omitido = perfil da imagem com Play Store (convidado de 4096 MB, ≈5,2 GB no host)

appium:
  host: 127.0.0.1
  port: 4723
  dir: tools/appium          # instalação local com versões fixadas
  autostart: true
  new_command_timeout_s: 0   # sessões permanecem abertas
  server_launch_timeout_ms: 180000
  adb_exec_timeout_ms: 60000

# Valores iniciais dos limites; depois de iniciados, são editáveis pelo painel (persistidos no banco).
limits:
  max_active_devices: 10
  max_ai_concurrency: 4
  boot_parallelism: 2
  max_steps_per_objective: 12
  max_actions_per_step: 12
  exploracao_ligada: true         # 31.273 (ADR-084): pedido fora do catálogo do app explora (leitura e navegação) em vez de recusar
  exploracao_max_acoes: 25        # ações do executor na etapa de exploração
  exploracao_max_chamadas_ia: 30  # chamadas de IA nas etapas de exploração da execução
  exploracao_max_usd: 0.60        # US$ por exploração (0 = sem teto em dinheiro); estourar para a etapa e diz o que viu
  exploracao_max_por_dia: 5       # explorações por dia por app (0 = sem teto)
  exploracao_efeito_ligada: false # 31.297 (ADR-091): o pedido de EFEITO também explora, pela política do perfil (aprovação por padrão)
  max_attempts_per_step: 3
  step_timeout_s: 180
  objective_timeout_s: 900
  driver_call_timeout_s: 45
  retry_backoff_s: 5
  no_progress_limit: 4
  ai_max_calls_per_objective: 60
  # 28.61: id do grupo de política cujas personas não passam pela aprovação de política (vazio = desligado).
  grupo_sem_aprovacao: ""
  # 31.253 / ADR-082: na operação com acao_final executar, o alvo cuja persona está nesse grupo nasce com o teto agir (sem
  # aprovação, sem Telegram, sem liberar). false volta ao teto preparar para todos (28.23).
  operacao_grupo_liberado_executa: true
  # 30.60 (N4): publicar no feed passa por uma pessoa mesmo com perfil ou grupo autônomo. true só se o dono decidir.
  publicar_sem_aprovacao: false
  # Item 17.12: num for_each, cada item além do primeiro soma ai_max_calls_per_item ao teto acima, até ai_max_calls_absolute
  # (60 + 12 × 7 = 144 para 8 itens). 0 em per_item desliga a proporção. O rejulgamento conta; os tetos em US$ seguem.
  ai_max_calls_per_item: 12
  ai_max_calls_absolute: 300
  ai_max_tokens_per_run: 3000000
  capture_grid_interval_s: 5
  capture_focus_interval_s: 1
  capture_yield_to_tree_s: 2         # 31.34: a grade cede a vez à leitura da árvore (0 desliga)
  frame_max_age_ms: 6000
  log_retention_days: 14
  evidence_retention_days: 14
  # Rodízio — N contas sobre K vagas de RAM: o scheduler liga o aparelho quando há tarefa para ele e, sem
  # vaga, hiberna um aparelho ocioso. Nunca desliga aparelho em uso, em foco no painel, com você no controle
  # ou com item bloqueado/incerto de execução aberta.
  auto_start_devices: true
  max_online_devices: 2           # vagas simultâneas: ≈2,6 GB cada. Suba conforme a RAM livre desta máquina
  min_online_dwell_s: 30
  idle_stop_s: 0                  # >0 também hiberna por ociosidade, mesmo sem disputa de vaga

# Vencimento do que espera uma pessoa que não veio (29.50 e 31.43): só muda estado; nada responde, digita nem toca aparelho.
execucao:
  vencimento_ligado: true         # false: nem a pergunta (needs_input) nem o bloqueio (waiting_user) vencem sozinhos
  pergunta_vence_h: 24            # horas sem resposta (1 a 8760); no bloqueio, conta do mais tardio entre a espera e o fim da execução

ai:
  # O provedor real é escolhido no .env (AI_PROVIDER). Quando for externo, screenshots e textos das telas SAEM
  # desta máquina para o provedor. Telas com campo de senha nunca são enviadas.
  # --- alavancas de custo (o valor antigo de cada uma está entre parênteses) ---
  screenshot_max_side: 768        # (1280) item 7.6: imagem menor para o ator — tokens de imagem ∝ área
  max_hierarchy_elements: 60      # (140/90) item 7.6: teto mais baixo agora que o alvo da etapa é protegido por boost
  actor_history_lines: 6          # item 7.6: histórico do ator comprimido (REJEITADA/FALHOU/(executor) + últimas N)
  image_policy: auto              # (always) imagem só quando precisa ou quando o modelo pede
  rich_tree_min_elements: 8
  limpeza_opcional: true        # 31.36: etapa que só limpa a tela é pulada se não se comprova (false = a de sempre)
  limpeza_apos_sobreposicao: true   # 31.40: recusa do juiz por sobreposição insere a limpeza opcional (uma vez)
  consentimento_aceito_em: []   # 31.72: hosts onde o ator pode aceitar cookies/consentimento; vazia = nenhum (decisão do dono)
  relacao_do_valor: true        # 31.41: só grava o valor lido com relação ao pedido (seletor, rótulo, forma ou o juiz)
  max_decisoes_leitura: 12      # 31.38: teto de decisões por tentativa em etapa de leitura (p95 medido 8 + folga; 0 desliga)
  podar_ui_do_navegador: true    # 31.35: a barra do Chrome não vai à árvore do prompt do ator (a url_bar fica, 31.52)
  diagnostico_arvore_aparelhos: []   # 31.52: aparelhos DE TESTE que gravam a árvore antes da poda (vazio = desligado). Só aparelho SEM vínculo ativo de persona: o vinculado é recusado na hora de gravar
  tapar_barra_de_endereco: true    # 31.54: retângulo opaco sobre a barra do Chrome na imagem do ator e do juiz. Ligado pelo veredito do A/B ao vivo do 31.56 (05/10, n = 3 por braço: sucesso igual, +14,3 % de decisões, dentro do limite de 20 %)
  imagem_enquanto_falta_saida: false   # 31.71: a imagem vai em toda decisão enquanto faltar saída declarada (motivo leitura_pendente), com lembrete só com os nomes; liga após o A/B
  acoes_por_decisao: 1          # 31.35: até 3 ações por decisão em etapa sem efeito (1 = desligado; liga após A/B)
  espera_apos_open_url: false   # 31.35: depois do open_url o executor espera a tela parar, sem decisão da IA
  strong_model_for_side_effect: by_risk   # true = todo efeito externo decide no modelo caro (39 % das decisões iam ao
                                          # Opus, até curtir com seletor de commit); by_risk = só risco alto do
                                          # catálogo, risco médio sem seletor de commit, ou app sem catálogo (menos o app
                                          # de prova, builtin e category 'qa', que fica no modelo barato); false = nunca
  espera_do_plano_irmao_s: 60       # (60) 31.237: o plano de um alvo de operação espera o 1º plano da mesma operação
                                    # para ler o cache do prompt; vencido o teto, segue; 0 desliga
  strong_model_only_on_commit: true   # 31.223: quando a etapa com efeito sobe (acima), o modelo de ação navega e só a
                                      # decisão que dispararia o efeito é refeita no forte; false = a etapa inteira
  imagem_quando_alvo_fora_da_arvore: true  # (true) 31.232: o commit refeito no forte e o rejulgamento do efeito levam a
                                      # imagem quando o alvo não está na árvore (toque por coordenada); false = como antes
  cascade_blocked_to_tier1: true  # (true) 17.10: step_blocked do modelo de ação sobe UMA vez ao de escalonamento antes de pedir uma
                                  # pessoa (não vale para challenge, auth_required e wrong_account); false = como antes
  rejulgamento_dispensado_por_app: true  # (true) 31.238: com a prova local do app no efeito e o app com >= mínimo
                                        # rejulgamentos sim_com_efeito na janela sem discordância, o rejulgamento sai
  rejulgamento_dispensa_minimo: 30      # (30)
  rejulgamento_dispensa_janela_dias: 7  # (7)
  rejudge_yes_on_side_effect: true  # (true) 17.10: o "sim" do verificador barato em etapa com efeito externo (ou que confirma o
                                    # nível de entrega) é conferido UMA vez pelo modelo de escalonamento; só age se os modelos diferem
  sent_text_dispensa_primeiro_juiz: true  # (true) 31.26 A: nível `sent` com a prova local `sent_text` (SEND_MESSAGE do
                                    # Instagram) dispensa o 1º julgamento; o rejulgamento acima continua e decide
  marcador_de_entrega_dispensa_primeiro_juiz: true  # (true) 31.57: o `delivery_marks` do catálogo, logo abaixo da mensagem
                                    # desta execução, dispensa o 1º julgamento; o rejulgamento continua e decide
  verify_max_model_calls: 2       # (5) verificação por visão só rejulga quando a tela muda
  # cache_ttl_do_plano: 1h       # (1h) 31.30: cache do prefixo do plano da execução; 5m = o pedido de antes
  esquema_do_plano: longo         # (longo) LT-4b: curto = a etapa livre do plano sem description/precondition/max_attempts
                                  # (o backend preenche) e com título e objetivo curtos; ~−23 % de saída do planejador
  recipes: replay                 # (off) aprende a etapa uma vez e repete por seletores; shadow = só compara
  recipes_heranca: true           # RA-20: sem receita na chave, herda da mesma etapa noutra versão/variante, como
                                  # candidata (só com recipes_promote_after > 0)
  descobertas_sem_uso_dias: 90    # 31.273: a etapa que a IA descobriu e a receita comprovou sai da oferta ao planejador
                                  # depois de N dias sem uso (a receita fica); 0 = sem piso
  candidata_da_ativa_que_divergiu: true  # (true) 31.233: a ativa que diverge e cai em quarentena com a IA completando
                                         # a etapa: o caminho que rodou vira candidata; false = como antes
  recipes_promote_after: 1        # receita aprendida nasce candidata (a IA decide, ela só é comparada) e vira ativa
                                  # depois de N execuções seguidas em que a IA fez o caminho dela (etapa SEM efeito
                                  # externo); 0 = nasce ativa
  recipes_promote_after_com_efeito: 2  # 31.287: o mesmo para a etapa COM efeito externo (commit); mesmo provada, para em
                                       # `validated` e espera o dono (D1)
  flows: true                     # (false) comando repetido reaproveita o plano, sem chamar o planejador
  pathfinder_wait_s: 240          # (0) com vários aparelhos, o 1º aprende e os demais esperam por ele
  # Porta `DecisaoFechada` (Fase 31, ADR-069): decisão por conjunto fechado no Jev (TypeSafe System One). DESLIGADA: as classes
  # que podem sair e o interruptor do envio são constantes de código (`planning/decisao_fechada/privacidade.py`; o envio está
  # aberto desde o 31.17) e este bloco só RESTRINGE. Sai algo só com `enabled: true`, um consumidor em `shadow`, `decisor: jev`
  # e a chave configurada (`GET /api/ai` diz `sending`). `shadow` roda fora do caminho crítico e nada usa a resposta; `on` só
  # por consumidor, com GO pré-registrado. A sombra do 31.10 (31.17) liga o curador em C0–C1; a intenção (C3) fica `off` até
  # o GO do portão do 31.9 e o sim do dono.
  decisao_fechada:
    enabled: false                # (false) vence tudo, inclusive um consumidor em `on`
    consumidores: {curador: shadow, intencao: "off"}  # curador | intencao | desempate | apps: "off" | shadow | "on" (ausente =
                                  # off); sem aspas, o YAML lê off/on como booleano e a configuração não carrega
    retencao_dias: 180            # (180) linhas da sombra (`decisao_fechada_sombra`); o agregado diário fica
    decisor: nulo                 # (nulo, nunca toca rede) jev = o decisor real (31.14): gasto conferido antes do POST,
                                  # chamada em ai_calls; com `enabled` e um consumidor em `shadow`, é envio de verdade
    classes_permitidas: [C0, C1]  # (sem estreitar: C0..C3) estreita o teto de código; nunca libera classe que o código fechou
  # Leitura visual de uma saída de etapa (item 12.5, ADR-070). DESLIGADA. Só vale na tela cega que o app declara
  # (`leitura_visual.regioes` no `telas.yaml` dele) e só com o papel `ai.roles.leitura` escrito (exemplo mais abaixo). Ligar manda
  # o RECORTE de uma linha de tela ao provedor do leitor, que pode ser outro que o do ator.
  leitura_visual:
    enabled: false                # (false) um valor lido da imagem só conta como saída com a conferência às cegas do leitor
  # Pesquisa externa da OPERAÇÃO (prova30 A2, 31.158). DESLIGADA. Ligar faz o modelo do planejador usar a ferramenta de busca
  # do próprio provedor (Anthropic, `web_search`) UMA vez por operação com assunto e lacuna; o resultado vai para a memória da
  # operação (fonte, fato, confiança, frescor). Chamada paga: tokens + US$ 0,01 por busca, com teto por operação.
  pesquisa:
    enabled: false                # (false)
    max_buscas: 3                 # (3) buscas por pesquisa
    teto_usd_por_operacao: 0.25   # (0.25) tokens + buscas, somados por operação
    frescor_h: 24                 # (24) quanto o fato pesquisado vale
    reaproveitar_min_fatos: 2     # (2) 31.231: fatos confirmados e frescos do Livro, do mesmo assunto, que dispensam a
                                  # pesquisa paga (todas as fontes indicadas cobertas); 0 desliga
  # Página de faturamento de cada conta de IA (ADR-051), a que o painel linka em "Abrir console". Sem o parâmetro
  # `billing`, o AI Studio abre a PRIMEIRA conta de faturamento, que pode não ser a pré-paga.
  # balance_consoles:
  #   gemini: https://aistudio.google.com/billing?billing=<ID-da-conta-de-faturamento>
  # Imagens da persona (migração 048): porta própria, FORA dos cinco papéis acima — o saldo da Anthropic não compra
  # imagem. `simulated` (padrão) pinta um degradê determinístico com Pillow, sem chave e sem nada sair da máquina;
  # `openai` usa gpt-image-2 por /v1/images/generations e /edits com a chave OPENAI_API_KEY do .env (outra conta;
  # a verificação da organização pode ser exigida). O gpt-image-1-mini sai da API em 01/12/2026 (Fase 17).
  # O custo REAL vem do `usage` da resposta × price_per_mtok; price_per_image é só a estimativa que confere o teto
  # do dia antes de gerar (conservadora até a medição real) e o custo quando a resposta não traz `usage`.
  image:
    provider: simulated           # simulated | openai
    model: gpt-image-2
    quality: medium               # low | medium | high
    per_persona: 1                # imagens geradas ao criar uma persona (0 desliga)
    on_create: true
    price_per_image: {low: 0.02, medium: 0.06, high: 0.2}           # US$ por imagem: ESTIMATIVA até medir
    price_per_mtok: {text_in: 5.0, image_in: 8.0, output: 30.0}     # US$/M tokens (developers.openai.com, 28/09/2026)
  # Orçamento por etapa, medido no histórico da ação (item 18.3, ADR-052): passar do p90 vira aviso; passar de
  # max(p90 × p90_factor, p90 + slack) chamadas para a etapa. Ação com menos de min_samples etapas concluídas na
  # janela não tem orçamento próprio (vale ai_max_calls_per_objective, proporcional aos itens do for_each: 17.12).
  step_budget: {enabled: true, p90_factor: 2.0, slack: 4, min_samples: 5, window_days: 30}
  prices:                         # US$ por milhão de tokens [entrada, cache lido, cache gravado, saída]
    claude-opus-5-5: [4.0, 0.2, 5.0, 20.0]   # cache lido a 0,05× (os demais são 0,1×) — platform.claude.com, 24/09/2026
    claude-opus-5: [5.0, 0.5, 6.25, 25.0]
    claude-sonnet-5: [2.0, 0.2, 2.5, 10.0]
    claude-sonnet-5-5: [2.0, 0.2, 2.5, 10.0]  # o mesmo do Sonnet 5 — platform.claude.com, 03/10/2026
    claude-haiku-4-5: [1.0, 0.1, 1.25, 5.0]
    claude-opus-4-8: [5.0, 0.5, 6.25, 25.0]
    jev-1.13.0: [0.042, 0, 0, 0]    # Jev (TypeSafe System One, ADR-069): US$ 0,042/M de entrada, saída grátis, sem cache
    # Fase 17: candidatos de outros provedores (preço de lista em 28/09/2026; ver docs/pesquisa-provedores-ia-*.md).
    gpt-6-luna: [0.10, 0.01, 0.10, 0.50]            # developers.openai.com/api/docs/pricing (Standard)
    gemini-3.1-flash-lite: [0.25, 0.025, 0.25, 1.50]  # ai.google.dev/gemini-api/docs/pricing
    deepseek-flash: [0.30, 0.006, 0.30, 1.20]       # preço de PICO (fora do pico é a metade); api-docs.deepseek.com
    # Modelo LOCAL de graça declara-se assim (e só assim): [0, 0, 0, 0]. Modelo AUSENTE desta tabela é contado
    # pelo preço mais caro dela, nunca como zero.

  # Capacidade DECLARADA por modelo: modelo ausente daqui é tratado de forma conservadora (sem strict, sem
  # thinking, sem effort, JSON por json_object) — que é o certo para um modelo local pequeno.
  # `min_cache_tokens` é o prefixo cacheável mínimo de CADA modelo (informativo; o ponto de cache é pedido sempre e
  # a API ignora o que fica abaixo do mínimo). Não é monótono entre gerações.
  models:
    claude-opus-5-5:  {vision: true, tools: true, strict_tools: false, structured_output: json_schema, thinking: true, effort: true, min_cache_tokens: 512}
    claude-opus-5:    {vision: true, tools: true, strict_tools: false, structured_output: json_schema, thinking: true, effort: true, min_cache_tokens: 512}
    claude-sonnet-5:  {vision: true, tools: true, strict_tools: false, structured_output: json_schema, thinking: true, effort: true, min_cache_tokens: 1024}
    claude-sonnet-5-5: {vision: true, tools: true, strict_tools: false, structured_output: json_schema, thinking: true, effort: true, min_cache_tokens: 512}
    claude-opus-4-8:  {vision: true, tools: true, strict_tools: false, structured_output: json_schema, thinking: true, effort: true, min_cache_tokens: 1024}
    claude-haiku-4-5: {vision: true, tools: true, strict_tools: false, structured_output: json_schema, thinking: false, effort: false, min_cache_tokens: 4096}
    # Fase 17. `json_object` de propósito: o esquema vai no texto e o Pydantic garante (K-042); o strict da OpenAI e o
    # json_schema da camada compatível do Gemini não foram provados com os esquemas deste projeto.
    # O gpt-6-luna só chama ferramenta no Chat Completions com reasoning_effort=none (doc do modelo, 28/09/2026).
    gpt-6-luna: {vision: true, tools: true, strict_tools: false, structured_output: json_object, thinking: false, effort: false, max_tokens_field: max_completion_tokens, extra_body: {reasoning_effort: none}}
    # No Gemini 3 o raciocínio não desliga pela camada compatível; minimal é o menor nível.
    gemini-3.1-flash-lite: {vision: true, tools: true, strict_tools: false, structured_output: json_object, thinking: false, effort: false, extra_body: {reasoning_effort: minimal}}
    deepseek-flash: {vision: true, tools: true, strict_tools: false, structured_output: json_object, thinking: false, effort: false, extra_body: {thinking: {type: disabled}}}

  # `providers` e `roles` vazios = um provedor só, o do .env (AI_PROVIDER), com os modelos por função de
  # AI_MODEL_*. Nada muda enquanto estes dois blocos não existirem. Para ligar um endpoint próprio compatível
  # com OpenAI, o Ollama NATIVO no Windows (item 7.8 — confira o ambiente com scripts\ollama-local.ps1 antes de
  # colar isto; ele só confere e imprime este bloco, não instala nem baixa nada):
  #
  # providers:
  #   local:
  #     kind: openai
  #     base_url: http://127.0.0.1:11434/v1    # Ollama nativo (roda no Windows; não precisa de WSL nem Docker)
  #     api_key_env: OLLAMA_API_KEY            # opcional — o Ollama padrão não exige chave nenhuma
  #     sends_data_externally: false           # é isto que a aba IA mostra por função
  #     extra_body: {options: {num_ctx: 16384}}  # o TAMANHO DE CONTEXTO fica no SERVIDOR (OLLAMA_CONTEXT_LENGTH
  #                                               # ou o Modelfile) — sem um dos dois lá, o padrão dele trunca o
  #                                               # prompt em silêncio; isto aqui só repassa a opção por chamada
  #   anthropic:
  #     kind: anthropic
  #     fallback_model: claude-sonnet-5
  # models:
  #   qwen3-vl:4b: {vision: true, tools: true, strict_tools: false, structured_output: json_object,
  #                 thinking: false, effort: false, max_output: 4096}
  # prices:
  #   qwen3-vl:4b: [0, 0, 0, 0]   # preço DECLARADO de zero; sem esta linha ele contaria pela tarifa mais cara
  # roles:
  #   decide:  {provider: local, model: qwen3-vl:4b, fallback_provider: anthropic, timeout_s: 45}
  #   verify:  {provider: anthropic}
  #   plan:    {provider: anthropic}
  #   escalation: {provider: anthropic}
  #   social:  {provider: anthropic, refusal_fallback: false}   # sem fallback pago na escrita da persona
  #
  # SEM `fallback_provider` escrito, a falha do endpoint local NÃO cai no provedor pago: o erro sobe. Prazos
  # por função sem nada declarado: plan 120 s · decide 45 s · verify 30 s · escalation 60 s · social 60 s · persona 60 s.
  #
  # Fase 17 — ator e verificador baratos em nuvem (candidatos; só adote depois da bateria, docs/plano-provedores-ia-*):
  #
  # providers:
  #   openai:
  #     kind: openai
  #     base_url: https://api.openai.com/v1
  #     api_key_env: OPENAI_API_KEY             # a MESMA chave da imagem; lida do .env por EnvSettings
  #   gemini:
  #     kind: openai                            # camada compatível do Gemini API (faturamento ligado: o plano
  #     base_url: https://generativelanguage.googleapis.com/v1beta/openai   # gratuito usa o conteúdo p/ treino)
  #     api_key_env: GEMINI_API_KEY
  #   anthropic:
  #     kind: anthropic
  #     fallback_model: claude-sonnet-5
  # roles:
  #   decide:  {provider: openai, model: gpt-6-luna, fallback_provider: anthropic}
  #   verify:  {provider: openai, model: gpt-6-luna, fallback_provider: anthropic}
  #   escalation: {provider: anthropic, model: claude-sonnet-5}
  #   plan:    {provider: anthropic}
  #   social:  {provider: anthropic, refusal_fallback: false}
  #
  # Perfil de IA por execução e canário (item 17.7, docs/ia.md §10c): A/B sem reiniciar o central. Cada função do
  # perfil vale por cima de `roles`, campo a campo; o que ele não escreve continua o padrão. Uma execução escolhe com
  # `POST /api/runs {"ai_profile": "luna-ator"}` (ou `scripts/eval_run.py --profile luna-ator`); sem escolha, o
  # canário sorteia a fatia `fraction` das execuções para `canary.profile`. Perfil inválido recusa a partida.
  # profiles:
  #   luna-ator:
  #     note: candidato a ator barato (bateria 17.10)
  #     roles:
  #       decide: {provider: openai, model: gpt-6-luna, fallback_provider: anthropic}
  #   planejador-sonnet:            # 17.13: o planejador no Sonnet 5.5 (o esforço e o esquema seguem os globais:
  #     note: planejador no Sonnet 5.5   # AI_EFFORT_PLANNER e ai.esquema_do_plano); aceite p/ trocar o padrão no
  #     roles:                      # ADR-005: sucesso >= Opus e p50 <= 11 s na rodada QA pareada
  #       plan: {model: claude-sonnet-5-5}
  #   img-768:
  #     note: dieta do contexto 2 (RA-17)
  #     screenshot_max_side: 768        # (o global) item 17.14: lado da imagem SÓ nas execuções deste perfil
  #     rich_tree_min_elements: 12      # (o global) item 17.14: árvore rica só com 12 elementos informativos
  #     roles:
  #       decide: {cache_da_etapa: true}  # (false) passo e lições antes da imagem, com o 2º ponto de cache
  #   ator-sem-thinking:
  #     roles:
  #       decide: {thinking: false, effort: low}   # (vazio) item 17.14: sem thinking; esforço desta função, não do .env
  # canary: {profile: luna-ator, fraction: 0.1}   # (sem canário) 10 % das execuções sem perfil vão para o candidato
  # `effort`, `thinking` e `cache_da_etapa` também valem em `roles` (sem perfil) e só mudam a requisição na Anthropic:
  # no provedor OpenAI não há thinking, esforço nem ponto de cache (docs/ia.md §10c, 17.14). A aba IA mostra, por
  # função, se o thinking vai (`thinking` no GET /api/ai).
  #
  # Item 31.6 — fatias do teto de gasto DO DIA para usos fora de execução (docs/ia.md §6). São PARTES do teto do dia
  # (`ai_max_usd_per_day`, em Configuração › Limites), nunca somas por fora: uma fatia estourada barra só a origem dela
  # (`AIError.motivo` = fatia_curador | fatia_jev) e as outras seguem. 0 desliga a fatia. Os valores abaixo são os padrões.
  # limits:
  #   curador_max_usd_per_day:        # (vazio) curador do Livro: sem valor = curador_fracao_do_dia × teto do dia; sem teto do dia, sem fatia
  #   curador_fracao_do_dia: 0.10     # (0.10) o α do dono (30.11)
  #   jev_max_usd_per_day: 0.50       # (0.50) decisão por conjunto fechado (D-J3, ADR-069)
  #
  # Item 17.8 — Flex para trabalho OFFLINE (a OpenAI cobra ~metade, mas responde 429 "Resource Unavailable" quando
  # não há capacidade ociosa e pode levar minutos). A entrada de provedor é um endpoint como outro qualquer, com o
  # campo no corpo; quem aponta para ela é um papel com prazo longo e `max_retries` (que repete 429 e 5xx, com
  # `Retry-After` ou 5 s dobrando até 60 s; falta de crédito nunca repete). NÃO aponte decide/verify/plan/escalation
  # da EXECUÇÃO nem o `social` (escreve comentário e resposta durante a execução): o flex é lento e instável por
  # desenho. Hoje o uso previsto é o rejulgamento offline — `scripts/eval_rejudge.py --sobrepor <arquivo>` com
  # este bloco num arquivo à parte (só `providers`/`models`/`prices`/`roles` entram), SEM tocar este config.yaml:
  #
  # providers:
  #   openai-flex:
  #     kind: openai
  #     base_url: https://api.openai.com/v1
  #     api_key_env: OPENAI_API_KEY
  #     extra_body: {service_tier: flex}
  # roles:
  #   verify:  {provider: openai-flex, model: gpt-6-luna, timeout_s: 900, max_retries: 5}   # modelo declarado em ai.models
  #
  # `timeout_s` não tem teto de validação e é o prazo TOTAL do papel, esperas das repetições inclusas.
  #
  # Persona no flex (item 17.8): a geração e o enriquecimento de persona são a função `persona`, separada do `social`
  # da execução. SEM a linha abaixo ela herda o `social` por inteiro (provedor, modelo, prazo, vagas, fallback) e nada
  # muda. Com ela, só a persona vai ao flex; o `social` (comentário, DM) continua no provedor dele. O bloco do `social`
  # NÃO vaza para a persona com bloco próprio: escreva aqui o `model` (declarado em ai.models) e o que mais precisar.
  # roles:
  #   persona: {provider: openai-flex, model: gpt-6-luna, timeout_s: 900, max_retries: 5}
  #
  # Leitor da leitura visual (item 12.5, ADR-070): papel OPCIONAL `leitura`, SEM herança (escreva `provider` e `model`; não
  # aceita `fallback_provider` nem perfil). O backend recusa subir se o modelo for igual ao do `decide` ou ao do
  # `escalation`, ou se for declarado sem visão em ai.models. De preferência de OUTRA família que o ator (reduz o erro
  # correlacionado); o provedor passa a receber o recorte de uma linha de tela. Exemplo com a OpenAI (declare o modelo em
  # `ai.models` e o provedor em `ai.providers`, como acima):
  # roles:
  #   leitura: {provider: openai, model: gpt-6-luna, timeout_s: 30}
  # Alternativa na Anthropic (mesmo destino das capturas que o ator já envia; é da mesma família do ator, então o erro
  # pode andar junto): {provider: anthropic, model: claude-haiku-4-5}. Gemini: provedor `kind: openai` apontando para a
  # camada compatível, como em `providers.gemini` acima.

releases:                         # entrega e conferência de versão no parque
  verify_max_age_h: 24            # validade do "está instalado aqui"; passado isso, relê do aparelho. 0 desliga
  # Prazos do instalador, em segundos: o custo real muda com a máquina (num worker sob disputa de CPU, um
  # `adb shell` já estourou 30 s). Meça e ajuste AQUI; nada disso é constante de código.
  profile_timeout_s: 30
  inspect_timeout_s: 40
  install_timeout_s: 900
  launch_deadline_s: 90

contas:                           # contas gerenciadas de qualquer app com login declarado (ADR-052)
  session_max_age_s: 43200        # validade do "Conectado"; passado isso, a sessão é relida do aparelho. 0 desliga
  verificacao_periodica_h: 0      # 31.302: a cada N h relê (sem IA, sem digitar) a conta âncora "pronta" de cada persona num aparelho ligado e livre; 0 desliga
  verificacao_periodica_cpu_max_percent: 50   # com a CPU do host acima disto (funil/suíte) a volta não toca em aparelho
  verificacao_periodica_tique_s: 300          # de quanto em quanto tempo o laço olha; no máximo UMA conta por volta
  criacao_pela_api_do_igfarm: false           # 31.335: (false) a API do igfarm não é mais a fonte da conta; o cadastro é no app. true reabre GET /api/instagram/personas-pendentes. Registro, código, ciclo e proxy não dependem dele
  # Ajustes do login por PACOTE, por cima do `sessao.yaml` do app (app/conhecimento/apps/<pacote>/). Só o que
  # for escrito vale; o resto vem do dado do app. (Era o bloco `instagram:`, que não é mais aceito.)
  # sessao:
  #   com.instagram.android: {settle_s: 5, submit_wait_s: 60}

skills:                           # habilidades versionadas (docs/design/evolucao-arquitetural.md, decisão P1)
  enabled: false                  # (false) habilidade PUBLICADA casa o comando antes do fluxo legado (ai.flows)
  ensino_v2_na_tela: false        # (false) a tela do ensino v2 (revisão só para leitura e "Corrigir etapa"); o caminho de ensino é o Modo treinamento (ADR-077). Reversível: nada se apaga

context_retrieval:                # retrieval de contexto de código: léxico + BM25 locais e provedor semântico plugável (ADR-063)
  enabled: false                  # (false) desligado = nada muda; ligar também exige escolher `mode`
  mode: disabled                  # disabled | local_only (léxico+BM25) | shadow (mede o semântico, entrega o local) | hybrid
  top_k: 5                        # arquivos no contexto entregue (top-3/top-5)
  # lexical_preserve: 1           # arquivos lexicais mantidos no topo pela regra híbrida v1 (o que o piloto validou)
  # lexical: {use_ripgrep: true, ripgrep_path: null}   # rg é opcional: caminho > RIPGREP_PATH > PATH; sem rg, o motor é o Python (mesmo resultado)
  # sensitive_paths: []           # globs que NUNCA entram em índice, mapa ou chunk, além dos fixos (.env, data/, secrets/ ...)
  # cache: {enabled: true, directory: context_retrieval}   # em `paths.data_dir`; fora do Git
  semantic:
    provider: none                # none | fake | jev. A chave do jev é TYPESAFE_API_KEY (ambiente ou .env), nunca aqui
    repository_class: private     # a provedor remoto: private e synthetic são NEGADOS (constantes de código); só public + allow_public + prova de visibilidade pública passa
    # allow_public: false         # necessário, mas não suficiente: o remoto do git é conferido no GitHub (anônimo) e tem de ser público
    # timeout_ms: 5000
    # max_calls: 2                # por pedido (etapa A mapa + etapa B trechos)
    # max_cost_usd: 0.05
    # max_input_tokens: 32000     # por pedido (A ~15,7 mil + B ~6 a 7 mil medidos no poetry; mapa de 48 KB + B também cabem)
    # max_candidate_files: 5      # arquivos que a etapa A escolhe
    # max_chunks: 16              # trechos que a etapa B recebe (janelas do início dos candidatos; ver ADR-063)

avisos:                           # aviso fora do painel (item 28.11): espelho da caixa de Pendências no Telegram, só saída
  enabled: false                  # (false) desligado = nada é enfileirado nem enviado. Ligar exige TELEGRAM_BOT_TOKEN e TELEGRAM_CHAT_ID no .env
  canal: telegram                 # o único canal; o token e o chat_id NUNCA moram aqui (nomes fixos no .env; docs/operacao.md)
  # url_painel: http://192.168.1.10:8000/central   # base pública do painel (inclui /central) p/ o link <base>/#/pendencias; sem ela a mensagem leva só o texto
  # intervalo_s: 15               # de quanto em quanto tempo o laço olha a fila
  # lote: 5                       # avisos por volta
  # timeout_s: 10                 # por chamada ao Telegram
  # max_tentativas: 5             # esgotadas, a linha vira `falhou`
  # backoff_s: 30                 # base do backoff exponencial (o Retry-After do 429 manda se for maior)
  # validade_h: 24                # pendente mais velho que isto vira `descartado` (notícia velha não sai)
  # incerto_apos_s: 600           # `enviando` parado há isto (queda no meio do envio) vira `incerto`, sem reenvio
  # retencao_dias: 30             # purga das linhas finais
  # agrupar_s: 60                 # rajada (28.19): 1º aviso do tipo sai na hora; os seguintes da janela saem juntos (0 desliga)
  # agrupar_a_partir_de: 3        # com tantos ou mais na janela, UMA mensagem com a contagem; com menos, um a um
  # aprendizado_faixas: [C]       # faixas do learning.needs_person que avisam (28.14); a B (lote) fica só na caixa
  # decisoes_automaticas:          # o que a plataforma decide sozinha (28.25)
  #   janela_min: 60              # no máximo UMA mensagem de resumo por janela, e só se houve decisão nova
  #   desfazer_dias: 7            # prazo para o dono desfazer uma decisão automática
  #   intervalo_s: 30             # volta do adaptador (eventos e trilha do aprendizado) e do resumo
  # restore_ensaio:               # (28.60) aviso de rotina do ensaio de restauração (scripts/restore-ensaio.ps1); só vale com avisos.enabled
  #   enabled: true               # (true) false = não lê o veredito
  #   intervalo_min: 15           # de quanto em quanto tempo relê o veredito
  #   ultimo_json: data/restore-ensaio/ultimo.json   # relativo à raiz do projeto; ausente = nada a avisar
  #   idade_max_h: 192            # veredito mais velho que isto = a tarefa semanal parou (7 dias + 1 de folga; 48 alarmaria toda terça)
  # disco:                        # (28.58) aviso de rotina de disco baixo no central; NUNCA apaga nada; só vale com avisos.enabled
  #   enabled: true               # (true) false = não lê o disco
  #   piso_gb: 100                # livre abaixo disto avisa, e de novo a cada degrau abaixo (100, 80, 60...); voltar ao piso rearma
  #   degrau_gb: 20               # distância entre os avisos
  #   critico_gb: 60              # abaixo disto o aviso diz que backup e criação de aparelho podem falhar
  #   intervalo_min: 15           # de quanto em quanto tempo lê o livre (o mesmo leitor da saúde)
  # entrada:                       # a conversa de volta (28.15, ADR-071): o chat do .env aprova, veta, responde e pede
  #   enabled: false              # (false) desligada; só liga com avisos.enabled. Ligar troca o consumidor do bot (docs/operacao.md)
  #   limite_por_min: 10          # mensagens do chat por minuto; o excesso vira `limitada`
  #   max_chars: 1000             # maior que isto é recusada sem guardar
  #   long_poll_s: 50             # quanto o getUpdates segura a conexão esperando
  #   espera_conflito_s: 60       # 409 (outro consumidor do bot): espera e avisa na saúde, não disputa
  #   ttl_previa_s: 900           # o botão Executar de uma prévia mais velha que isto não cria a execução
  #   idade_max_s: 900            # mensagem escrita há mais que isto (Central fora do ar) não é tratada; o dono é avisado
  #   retencao_dias: 30           # (28.16) depois disso o texto da conversa é zerado e a linha apagada (mínimo 2)
  #   convidados:                 # quem fala com o bot e não é o dono (28.18, emenda ao ADR-071); só vale com a entrada ligada
  #     enabled: false            # (false) desligado = gravado sem texto e sem resposta, como no 28.15
  #     max_nome: 60              # o nome informado é cortado aqui (uma linha, sem e-mail, @conta nem IP)
  #     avisos_por_hora: 6        # mensagens de UM convidado autorizado que viram aviso ao dono por hora
  #     novos_por_hora: 20        # chats novos atendidos por hora; o excesso fica sem resposta
  #   anexos:                     # (28.24) foto, PDF e texto que o DONO manda; guardados em data/anexos pelo sha256 (nunca pelo nome dele)
  #     enabled: true             # (true) false = recusa todo anexo, com o motivo dito ao dono
  #     max_bytes: 10485760       # (10 MB) acima disso é recusado sem baixar tudo; o Bot API baixa até 20 MB
  #     tipos: [image/jpeg, image/png, image/webp, application/pdf, text/plain]   # o mime é conferido pelo conteúdo
  #     leitura:                  # (28.24 F3) a IA descreve a imagem que o DONO mandou, a pedido (/ler em reply, ou POST /api/canais/anexos/{id}/ler)
  #       enabled: true           # (true) false = a leitura responde 'desligada', sem chamar o provedor
  #       teto_usd: 0.05          # (0.05) por imagem, ESTIMADO antes da chamada: acima disso nada é enviado ao provedor
  #       modelo: ""              # vazio = o mais barato de ai.prices com vision:true em ai.models (hoje claude-haiku-4-5)
  #       max_tokens: 400         # teto da resposta do modelo

trello:                           # Trello do dono (item 32.2, ADR-072): espelho do plano e canal de comandos. Ligar exige TRELLO_API_KEY e TRELLO_TOKEN no .env
  enabled: false                  # (false) desligado = nenhuma chamada ao Trello. Os segredos NUNCA moram aqui (docs/operacao.md)
  # quadros: []                   # ids dos quadros que a Central espelha e lê
  # listas:                       # ids das listas, por papel
  #   central_automatico: ""      # onde a Central cria os cartões
  #   aprovado: ""                # mover o cartão para cá vale "sim" do dono
  #   vetado: ""                  # mover o cartão para cá vale "não" do dono
  #   marcos: ""                  # onde nasce um cartão por deploy (commit e migração mudaram)
  #   custos: ""                  # onde vive o cartão de custo de IA do dia, atualizado no máximo de hora em hora
  #   perguntas: ""               # 28.51: as perguntas ao dono; o comentário dele aqui é a resposta (sem confirmação
  #   perguntas_respondidas: ""   #   no Telegram): vai à orquestradora com o número da pergunta
  # membro_dono: ""               # o idMember do dono: só ele comanda (o autor é lido pela API, nunca do texto)
  # espelho_s: 60                 # de quanto em quanto tempo o reconciliador do espelho roda
  # reconciliar_s: 60             # leitura das actions do quadro (a rede de segurança do webhook; 300 com ele ligado)
  # comando_livre: false          # (false) só espelha; true aceita comando por comentário e por cartão movido
  # idade_max_s: 900              # action mais velha que isto (Central fora do ar) não é tratada
  # retencao_dias: 30             # (28.16) depois disso o texto é zerado, a linha apagada e o cartão arquivado esquecido (mínimo 2)
  # membros_autorizados: []       # quem o dono autorizou a PEDIR além dele; vazia = o pedido de convidado vira aviso ao dono
  # apps_do_dono: []              # 28.54: apps que o dono reconheceu como ele (o Trello no celular dele); vazia de fábrica, um id só com o sim dele
  # responder_convidados: false   # responde a pergunta de convidado no cartão, só com o que o quadro já mostra
  # webhook:                      # caminho principal da entrada (§8 do desenho); exige TRELLO_API_SECRET no .env e o portal público
  #   enabled: false              # (false) separado de trello.enabled; só faz a ROTA responder, NUNCA cadastra nada no Trello
  #   cadastro_automatico: false  # (false) recadastro de hora em hora no líder; só se liga depois da prova real. O 1º cadastro é
  #                               # manual: scripts/trello-webhook.py --ensaio e depois --aplicar, com o "vai" da orquestradora
  #   callback_url: ""            # a URL pública inteira (sem parâmetro e sem segredo); entra no HMAC tal como escrita
  #   max_bytes: 262144           # corpo acima disso: 413

provisioning:                     # aparelho novo pela plataforma, neste servidor (POST /api/instances)
  min_free_disk_gb: 10            # disco livre mínimo do hospedeiro (última batida) para aceitar criar mais um AVD

rede:                             # rede por aparelho (ADR-056): aplicação no aparelho e servidor do central (25.4)
  cliente_pacote: io.nekohasekai.sfa   # cliente VPN no aparelho (sing-box), instalado pela versão promovida na loja
  deriva_s: 900                   # releitura periódica da rede aplicada (settings, tun0); 0 desliga
  validade_verificacao_s: 21600   # trafego_verificado vence depois disto (política exigida: a tarefa espera medir de novo)
  cliente_atividade: io.nekohasekai.sfa/.compose.MainActivity   # Start da interface do cliente: religa o túnel sem reiniciar (W8: só ele recalcula o serviceMode); vazio desliga
  cliente_tile: io.nekohasekai.sfa/.bg.TileService   # LEGADO: tile do cliente, só diagnóstico (inicia o ProxyService se o serviceMode não é VPN); a convergência não o usa
  espera_tun_s: 180               # espera pelo tun0 contada do boot (medido em 30/09: sobe entre 92 e 176 s, nunca depois de 180)
  reinicios_max: 2                # reinícios por revisão antes de desistir (o Start da interface é tentado antes de cada um)
  dns: 1.1.1.1                    # DNS do cliente pelo túnel
  servidor:                       # sing-box do central em modo usuário: sobe só com aparelho atribuído a perfil `servidor: central`
    binario: data/rede/sing-box-1.14.2-windows-amd64/sing-box.exe   # fora do Git; a config vai em arquivo com ACL do usuário
    porta_wireguard: 51820        # UDP, em todas as interfaces (o endpoint do sing-box não tem campo de escuta)
    sub_rede: 10.66.0.0/24        # servidor no .1; um endereço por aparelho a partir do .2
    porta_proxy: 18080            # proxy autenticado, só em 127.0.0.1, alcançado pelo túnel no endereço do servidor
    mtu: 1408
    log_max_mb: 20                # log de conexões (evidência); renomeado no início seguinte ao teto
    endpoint_lan: ""              # IP do central NA LAN para aparelhos de outra máquina (notebook do worker); vazio = remoto recusado.
                                  # O UDP da porta_wireguard precisa passar no Firewall do Windows daqui: a plataforma só LÊ e
                                  # mostra o comando do dono em GET /api/network/server → remote_access (item 25.7)
  sonda:                          # sonda de saída de dentro do aparelho, como uid 2000 (25.5)
    hosts_ipv4: [api.ipify.org, ipv4.icanhazip.com]   # eco de IP por HTTP/1.0 na 80; só registro A
    hosts_ipv6: [api6.ipify.org, ipv6.icanhazip.com]  # idem, só AAAA (com strict_route o IPv6 fica preso no túnel)
    udp_dns: 8.8.4.4              # UDP de DNS de ida e volta (o cliente sequestra e resolve pelo túnel)
    udp_ntp: time.google.com      # UDP que não é DNS (NTP); udp_ok só com os dois
    reverificar_s: 600            # aparelho `parcial` é medido de novo depois disto (varredura ou porta da tarefa)
    prazo_leitura_s: 90           # prazo de cada leitura da rede pelo adb (a fila dá +10 s); era 45 fixo (29.75)
    abrir_apps: false             # true = a sonda abre o app exigido sem tráfego na janela TAMBÉM sem tarefa esperando
                                  # (com tarefa segurada pela porta, abre sempre: é o que a tarefa faria; é usar a conta)
    espera_app_s: 15              # quanto o app aberto pela sonda fica na frente antes de voltar ao início
    medir_central: true           # mede a saída do PRÓPRIO central (mesmos ecos) para acusar aparelho que sai pela casa (29.20)
    central_ttl_s: 600            # idade em que a saída do central é medida de novo; com mais de 3x isso, "não medida"
    central_prazo_s: 6            # prazo por host e família na medida do central
    medir_sem_rede: true          # aparelho sem rede pedida: mede só os IPs de saída (v4/v6) a cada reverificar_s; sem medida, "sai pela casa (presumido)"

aprendizado:                      # aprendizado contínuo (ADR-054): livro, D1, falha classificada; NENHUMA IA no pipeline
  enabled: true                   # digest a cada execução e curadoria periódica; false = só a leitura do livro
  curadoria_s: 900                # passo da curadoria (régua diária dos últimos dias e passos dos pacotes seguintes)
  # Modos: "off" não grava · "shadow" grava e mede sem consumir · "on" publica sozinho o que NÃO tem efeito externo
  # nem texto de pessoa (D1). As aspas importam: sem elas o YAML lê off/on como booleano.
  licoes:
    modo: "shadow"
    ator: {tokens: 120, max: 3}
    planejador: {tokens: 150, max: 3}
    minimo_por_braco: 8           # unidades por braço para o veredito de efeito (o painel mostra "faltam N")
    maximo_por_braco: 20
    holdout_publicada: 0.1
    # Modo por app (§8.10): `por_app: {<pacote>: off|shadow|on}` sobrescreve o `modo` global SÓ daquele pacote; vazio
    # (padrão) = o global vale para todo app. Exemplo (comentado, não liga nada):
    # por_app: {"com.exemplo.app": "shadow"}
  telas: {modo: "observe", observacoes: 3, execucoes: 2}    # "observe": grava e valida, a sessão não consome
  # telas.por_app: {<pacote>: off|observe|on}, mesma regra (vazio = global). Exemplo comentado, não liga nada:
  # telas: {modo: "observe", observacoes: 3, execucoes: 2, por_app: {"com.exemplo.app": "observe"}}
  # Fluxo aprendido de execução (D1): nasce candidato; a sombra no digest publica o sem efeito depois de
  # `concordancias` execuções concordantes além da que o gerou, e o com efeito para em validated (o dono aprova).
  # com_prova: false = o modo anterior (nasce ativo, sem D1): só para a suíte que prova o reaproveitamento.
  fluxo: {concordancias: 1, com_prova: true}
  # RA-19 B: o que uma execução simulada ensina nunca nasce ativo, e a concordância dela não promove receita (só
  # evidência real publica). true = o modo anterior: só para a suíte, que é toda simulada.
  simulada_publica: false
  voz: {modo: "off"}              # a voz é sempre publicada pelo dono
  preferencias: {modo: "off"}
  backlog: {minimo_ocorrencias: 3, pessoa_usd: 0.25, aparelho_usd_min: 0, prova_minimo: 10, prova_fator: 0.5}
  # Saúde do item do Livro (30.4): rótulo derivado por regra, só leitura (nada é gravado, nada se move).
  saude:
    sem_uso_dias: 14              # nunca usado há isto = sem_evidencia; sem uso há mais que isto = parado; é a janela de "usado recentemente"
    amostra_minima: 5             # usos para a eficácia valer (abaixo: pouca_amostra)
    taxa_minima: 0.8              # eficácia acumulada replay_ok/(ok+fail); abaixo disto, com amostra, = degradando
    falhas_seguidas: 2            # consecutive_fail a partir do qual o item degrada
    contestacao_dias: 7           # janela da evidência contra/conflito (contestação recente = degradando)
  # Curador por IA (30.11, §8.6-8.8): pede PARECER sobre itens do Livro; a IA nunca decide (o aceite é da pessoa).
  # "off" (padrão) não roda · "shadow" revisa e grava o parecer · "on" faz o mesmo nesta fatia. Orçamento proporcional
  # ao gasto da operação: B = min(alfa·gasto da janela, k·itens·custo médio); custo máximo = m_cmax × mediana.
  curador:
    modo: "off"
    intervalo_s: 3600             # de quanto em quanto tempo o laço olha os gatilhos (sob a trava de líder)
    cooldown_h: 24                # o mesmo item não é revisado de novo antes disto
    alfa: 0.10
    k: 1.5
    janela_dias: 7
    m_cmax: 4
  validacao:                      # 30.31: a IA valida o que o curador manda "pedir evidência" (execução de validação)
    modo: "off"                   # DESLIGADO de fábrica; "on" roda execução REAL (o custo é o da operação)
    intervalo_s: 600              # o despachante olha a fila (uma execução por volta, no máximo)
    beta: 0.05                    # fração do gasto de IA da operação na janela que a validação pode usar
    maximo_por_hora: 4
    janela_dias: 7
    extra_usd: 0                  # verba única somada ao beta até extra_ate (ISO, ex.: 2026-10-10T00:00:00.000Z)
    extra_ate: ""
    custo_estimado_usd: 0.07
    teto_por_pedido_usd: 0.10     # 30.37: teto de gasto de IA de UM pedido (a execução de prova); acima, o roteador barra
  # Autopublicação do fluxo de classe B (30.34): parecer "aprovar" com confiança alta + ≥ 2 execuções reais em ≥ 2
  # aparelhos. "off" (padrão) não roda · "shadow" só marca o que publicaria (o livro da sombra) · "on" (30.34-B)
  # publica pela emenda à D1, mas só com o balanço da sombra liberado (≥ 30 casos fechados com ≥ 90 % sem regressão);
  # sem ele, "on" é igual a "shadow". Ligar "on" é decisão da orquestradora, com o relatório da sombra.
  autopublicacao:
    modo: "off"
    intervalo_s: 3600             # de quanto em quanto tempo o laço avalia os fluxos (sob a trava de líder)
  # Aprovação automática por política (30.55, pedido do dono em 04/10): a plataforma decide a receita ou o fluxo de
  # "Para aprovar" (publica) e de "Revisar" (confirma que fica) quando: classe A ou B, todo app de categoria qa, ≥ 1 a
  # favor real e 0 contra na versão atual, sem falha de reprodução, saúde sem rebaixar e nenhum parecer de rebaixar ou
  # descartar. Conta real, classe C e app sem categoria ficam com o dono. Grava decided_by=plataforma com o motivo
  # "auto:<regra> v1 — <fatos>"; desfazer é a ação de sempre. "off" (padrão) · "shadow" só marca o que decidiria · "on".
  # Sempre entre aspas (on/off sem aspas é booleano no YAML) e, para valer, reinicie o central (o config é lido na subida).
  aprovacao_automatica:
    modo: "off"
    intervalo_s: 900
  ia_resumos_por_dia: 0           # lição escrita por IA: desligada (gasta saldo e abre injeção); só 0 é aceito
  takeover_gravar: false          # gravar as entradas manuais da tomada de controle fora do treino
  retencao: {sinais_dias: 180, feedback_dias: 365, exposicoes_dias: 120, evidencias_por_item: 200, diario_dias: 400,
             candidata_sem_evidencia_dias: 90}

pedidos:                          # pedidos persistentes (28.4): o objetivo que dura e volta (docs/design/pedidos-laco.md)
  enabled: false                  # DESLIGADO de fábrica: cada ocorrência chama o planejador PAGO; o orçamento
                                  # (28.6) limita o gasto por pedido, mas ligar é decisão do dono, por instalação
  tick_s: 15                      # o laço acorda a cada tanto (e quando uma execução do pedido assenta)
  horizonte_s: 3600               # quanto à frente a recorrência vira ocorrência `prevista`
  prazo_inicio_s: 3600            # execução despachada que não começa neste prazo é cancelada (a ocorrência fica `perdida`)
  janela_padrao_s: 1800           # recuperação de `horario` sem efeito, de `agora` e de recorrência de um dia ou mais
  lote_max: 500                   # linhas materializadas por gatilho e execuções criadas por volta
  posse_s: 120                    # validade da reserva de uma ocorrência por um laço (a chave é quem garante a unicidade)
  saldo_minimo_usd: 0             # saldo estimado mínimo (US$) das contas de IA em uso para despachar; abaixo, a ocorrência é ADIADA
                                  # (fica devida, sem falha); 0 desliga o mínimo (o bloqueio do dono na conta adia mesmo assim)
  resumo_ia: false                # resumo do relatório por IA (28.7): só o ponto de extensão; o relatório determinístico sai sempre
  resumo_ia_teto_usd: 0.05        # teto por relatório que o resumidor deve respeitar (o 28.6 conta no orçamento do pedido)
  max_tentativas: 2               # execuções por ocorrência (2 = a primeira e uma repetição); só repete se a falha NÃO teve efeito possível (28.5)
  falhas_para_pausar: 3           # ocorrências seguidas que terminam `falhou` pausam o pedido, com aviso (28.5)
  retentativa_base_s: 60          # atraso da nova tentativa: base * 2**(n-1) ...
  retentativa_teto_s: 900         # ... no máximo isto (o laço pode levar até tick_s a mais)
  piso_observar_s: 900           # menor intervalo entre ocorrências de pedido `observar` ou `preparar` (28.9): 15 min
  piso_agir_s: 3600               # idem para `agir` (efeito externo): 1 h
  operadores_do_dono: []          # nomes de sessão do painel que são o DONO (28.31 F2a): só o pedido deles mostra o título
                                  # no Telegram; qualquer outro nome grava `convidado` (o login aceita qualquer nome). Vazia: ninguém
  colaboracao:                    # colaboração entre pedidos (28.10, F1 e F2): pai, filhos, dependências e papéis
    enabled: false                #   DESLIGADA de fábrica: a API recusa `pai_id`, `papel` e `dependencias` (422 `colaboracao_desligada`).
                                  #   Ligada, valida e grava; F2: o laço só despacha o filho com a dependência comprovada e
                                  #   desconta do saldo do pai a reserva dos filhos vivos
    max_profundidade: 2           #   níveis contando o pai: 2 = pai → filhos (2 a 4)
    max_filhos: 5                 #   filhos diretos de um mesmo pai (1 a 20)
    espera_dependencia_s: 3600    #   F2: quanto a ocorrência do filho espera o `de` ser comprovado antes de virar `pulada` (60 a 604800)

comando_remoto:                   # comando remoto nos notebooks da rede (29.154, ADR-079)
  ativo: false                    # DESLIGADO de fábrica. Vale só junto do interruptor por worker (painel) e do
                                  #   `comando_remoto: true` do agente; ligar é decisão do dono. Muda só na subida
  fila_max: 4                     # comandos esperando por worker, além do que está rodando (0 a 20)
  por_minuto_por_operador: 30     # 1 a 600
  retencao_dias: 30               # a saída guardada some depois disso (1 a 365)
  max_por_worker: 200             # registros guardados por worker (10 a 5000)
portal:                           # site institucional na raiz do nome público e formulário de contato (29.77, ADR-075)
  site_ligado: false              # DESLIGADO de fábrica: `/` segue no 307 para `/central/`. Ligado, `/` serve a pasta `site/`
  contato_ligado: false           # DESLIGADO de fábrica: `POST /api/portal/contato` responde 404. Ligado, o contato vai ao
                                  #   Telegram do dono pela fila de avisos (tipo `portal.contato`), guardado por 180 dias
  contatos: []                    # telefones mostrados na página: [{nome: "...", telefone: "+55 .."}]. Nunca no Git: só no
                                  #   config.yaml de cada instalação. Sem contatos, o bloco some e fica só o formulário
  limites:
    por_cliente_hora: 3           # contatos por cliente (IP da borda; IPv6 por /64) por hora (1 a 100)
    por_cliente_dia: 10           # ... e por dia, contado no banco (1 a 1000)
    telegram_hora: 20             # mensagens ao Telegram por hora, todos somados; acima, o contato fica retido e sai depois
    guardados_dia: 500            # linhas guardadas por dia; acima, o contato é descartado e só contado (10 a 10000)
    corpo_max_bytes: 8192         # teto do corpo do POST, lido em fluxo (2048 a 65536)
    token_min_s: 3                # o formulário enviado antes disso é tratado como robô (1 a 60)
    token_max_s: 7200             # depois disso a página ficou aberta demais e o visitante recarrega (600 a 86400)
    buscas_por_operador_hora: 30  # buscas por telefone na exclusão a pedido do titular (29.83), por operador (1 a 1000)
    buscas_total_hora: 60         # as mesmas buscas somando todos os operadores (1 a 10000)
  # Vigia da borda (29.97): de hora em hora, só no líder, o central pede o site e o painel pelo 1º nome de
  # server.public_hosts, como um visitante (só GET, sem credencial, até 5 pedidos), e confere que a API recusa sem
  # credencial (29.101), script injetado pela Cloudflare, no-transform, a CSP, cookie e a versão do CSS e do JS.
  # Defeito vai à saúde e ao dono pela Canais. A conferência da API vem com portal.vigia.ligado e roda mesmo com
  # site_ligado: false; com o vigia desligado, ou sem server.public_hosts, nada roda, nem a API.
  vigia:
    ligado: true
    intervalo_s: 3600             # 600 a 86400
    prazo_s: 10                   # prazo de cada pedido (1 a 60)
    voltas_sem_conferir: 3        # voltas seguidas sem conseguir conferir até virar problema e aviso (1 a 48)

apps:
  # Navegador que já vem na imagem google_apis (ADR-025): sites entram pela ferramenta `open_url`, com endereço
  # escrito no comando. Sem esta linha o planejador não tem app para "abra o Chrome e entre no site…".
  - id: chrome
    name: Chrome
    package: com.android.chrome
    nav_hints: >-
      Navegador. O endereço é aberto direto (open_url), sem digitar na barra. No primeiro uso o Chrome mostra boas-
      vindas ("Aceitar e continuar", "Usar sem uma conta", "Não, obrigado"): dispense e siga. Formulário de login de
      site fica numa WebView: campos e botões aparecem na hierarquia; se não aparecerem, peça a imagem.
  - id: qa-messenger
    name: QA Messenger
    package: com.pocqa.messenger
    activity: .MainActivity
    apk_path: qa-app/dist/qa-messenger.apk
    builtin: true
    nav_hints: >-
      App de QA com contas fictícias. A tela inicial lista conversas e mostra "Conta: <conta>" no topo.
      Tocar em um contato abre a conversa; o campo "Mensagem" e o botão "Enviar" ficam na base.
      Cada mensagem mostra um status: "Enviando…", "Enviada ✓", "Entregue ✓✓", "Lida ✓✓" ou "Falha no envio ✕".
      O botão "Perfil" abre um formulário (Nome, E-mail, Cidade, Receber notificações, Salvar).
      Se aparecer o aviso "Novidades da versão", toque em "Agora não".
    known_selectors:
      account_label: id=com.pocqa.messenger:id/account_label
      conversation_list: id=com.pocqa.messenger:id/conversation_list
      message_input: id=com.pocqa.messenger:id/message_input
      send_button: id=com.pocqa.messenger:id/send_button

# Telas que NÃO podem virar evidência em disco nem imagem no corpo da requisição ao provedor de IA. O critério
# embutido já cobre, sozinho: campo de senha, tela de desafio/2FA e TODA tela do aparelho-loja. Esta lista é
# para o que só quem cadastrou o app sabe.
#
#   package:      opcional; sem ele a regra vale para qualquer app
#   resource_ids: casa por SUFIXO do resource-id (`:id/cpf` casa com `com.exemplo:id/cpf`)
#   texts:        casa por texto contido, sem acento e sem caixa
#   why:          aparece na mensagem da etapa e na evidência
sensitive_screens: []
#   - package: com.exemplo.banco
#     resource_ids: [":id/cpf", ":id/saldo"]
#     texts: ["dados do titular"]
#     why: dados pessoais do titular da conta
