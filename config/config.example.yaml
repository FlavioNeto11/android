# PONTO DE PARTIDA da configuração (achado #177). Copie este arquivo para `config/config.yaml` — o
# `scripts/start.ps1` faz isso sozinho na primeira vez, como já fazia com o `.env` — e ajuste o que for desta
# máquina. `config/config.yaml` NÃO é versionado: ele é o retrato do SEU parque, e cada ajuste local seu
# deixaria de ser um diff no repositório.
#
# O que este exemplo é, de propósito: **4 emuladores locais, nada de remoto, nada de loja**. Uma instalação
# nova sobe assim sem nenhum cartão fantasma e com `/api/health` limpo (menos `ai_not_configured`, até você
# pôr a chave no `.env`). Cada bloco opcional está comentado abaixo, com o que ele exige para funcionar.
#
# Segredos NÃO ficam aqui: use o `.env` (veja `.env.example`). Caminhos relativos saem da raiz do projeto.

server:
  host: 127.0.0.1            # somente loopback
  port: 8000
  # Listener DEDICADO ao canal do worker (só /api/worker/ws, nada de REST), alvo do `-R` do túnel SSH.
  # 0 = desligado, que é o certo com o parque numa máquina só. Ligue-o (ex.: 8010) ao inscrever um worker.
  worker_port: 0
  # Sair do loopback (host: 0.0.0.0) exige TRÊS coisas juntas, e o backend recusa subir sem qualquer uma:
  # API_TOKEN no .env, `public_hosts` aqui e TLS (tls_cert + tls_key, OU tls_behind_proxy com um
  # Caddy/nginx/IIS terminando o TLS na frente). Sem isso, na porta de rede iriam em claro o token, a
  # credencial do worker, o cookie de sessão do painel e todo screenshot. Ver docs/worker.md.
  # public_hosts: [parque.exemplo.local]
  # tls_behind_proxy: true
  # Origens aceitas (CORS, conferência de CSRF e WebSocket): o que o navegador mostra na barra de endereços.
  allowed_origins:
    - http://127.0.0.1:8000
    - http://localhost:8000
    - http://127.0.0.1:5173
    - http://localhost:5173

paths:
  data_dir: data
  avd_home: data/avd         # cada AVD (userdata, sessão dos apps) vive aqui; é o isolamento entre instâncias
  evidence_dir: data/evidence
  logs_dir: data/logs
  apk_dirs:                  # únicos diretórios de onde um APK pode ser instalado
    - qa-app/dist
    - apks

android:
  sdk_root: C:\Android\Sdk   # pode ser sobrescrito por ANDROID_SDK_ROOT no .env
  # Imagem padrão. É a que `scripts/install-prereqs.ps1` instala sem argumento nenhum.
  # Apps sociais costumam ser arm64: só imagens google_apis API 30+ têm tradução ARM (medido).
  system_image: system-images;android-34;google_apis;x86_64
  # RAM do CONVIDADO (`hw.ramSize`, o que o Android enxerga). Omitida = perfil medido da IMAGEM
  # (backend/app/devices/perfis.py): google_apis → 2048 MB com `-lowram`, ≈2,7 GB no host; Play Store → 4096 MB,
  # ≈5,2 GB. NÃO use 1536 com google_apis: entra em thrash pós-boot com os apps Google (android-12 em 23/09,
  # load 22; android-01 e android-04 de novo em 26/09 ao abrir o Instagram e ao receber um app — B21).
  # Declarar um número é decisão sua e vale como está (com as `extra_emulator_args` daqui, sem as do perfil);
  # sem `-lowram`, a imagem Android 14 impõe 2560 MB e ignora o número.
  # ram_mb: 2048
  cores: 2
  width: 720
  height: 1280
  density: 320
  data_partition: 4G
  # Renderizador do emulador (`-gpu`). O emulador 37.1.11 atende de fato dois valores (medido em 30/09/2026):
  #   swiftshader_indirect (ou swiftshader)  renderização por software; funciona em sessão RDP e em servidor sem GPU
  #   host                                   GPU desta máquina (~200 MB de VRAM por emulador); funciona pelo serviço
  # Argumento aceito não é renderizador usado: `angle_indirect` é recusado ("switching to 'auto'") e `swangle` acaba
  # em SwiftShader. O que ele SELECIONOU sai no log (`emuglConfig_init: … gles_mode_selected`), e o painel mostra:
  # pedido diferente do selecionado vira aviso no aparelho. Há app que derruba o emulador no SwiftShader (o Outlook,
  # `renderizador_recusado` no app.yaml dele): ele só é instalado e aberto em aparelho com `host`.
  # Por aparelho: `instances.overrides.<id>.gpu_mode` (exemplo abaixo). Mudar exige reiniciar o backend e o
  # aparelho, e o boot seguinte é a frio (o snapshot da hibernação é do hardware de antes).
  gpu_mode: swiftshader_indirect
  boot_timeout_s: 480
  # Guarda de capacidade: um boot só é aceito se, descontado o que os boots em andamento ainda vão alocar,
  # couber esta instância (custo no HOST) e sobrar min_free_ram_mb_after_boot para o host. O custo no host vem
  # do perfil medido da imagem; `est_instance_ram_mb` só se você MEDIU outro número nesta máquina (ele vale para
  # toda instância sem override, qualquer que seja a imagem).
  # est_instance_ram_mb: 3000
  min_free_ram_mb_after_boot: 1500
  # Redundante com o perfil (que já põe `-lowram` em google_apis e AOSP), mas necessário se você declarar
  # `ram_mb` acima: com número explícito, só valem as flags daqui.
  extra_emulator_args: ["-lowram"]
  # Hibernação por snapshot: ceder a vaga salva o estado (≈1 s) e acordar leva ≈16 s até a automação ficar
  # pronta, contra 73–105 s de boot a frio. O padrão do CÓDIGO é `false` (quem não declara não hiberna); aqui é
  # `true` por escolha medida. Cada snapshot ocupa ~1,5 GB de disco por instância.
  hibernation: true
  # DNS entregue aos emuladores desta máquina (`-dns-server`). Vazio = autodetecção do emulador, que usa os
  # primeiros DNS do host e NÃO faz o fallback que o Windows faz: com um DNS morto na frente, a rede móvel do
  # convidado (10.0.2.3) fica sem resolver nome. Confira com `Resolve-DnsName <host> -Server <ip>` antes.
  # dns_servers: ["192.168.1.1", "8.8.8.8"]
  wake_timeout_s: 90
  # Apps de fundo DESATIVADOS no preparo dos aparelhos da automação (`pm disable-user --user 0`), para caber nos 2 GB
  # do convidado. Medido em 29/09: app Google 101 MB, Android System Intelligence 37 MB e Mensagens 22 MB no
  # android-06; no android-04, load 14,7 e 82 MB livres, com YouTube, YouTube Music, Gmail e Bem-estar digital
  # subindo sozinhos. Esta é a lista conservadora (o padrão do código). Pacote que a imagem não tem é ignorado.
  # Reversível: tire um pacote e o preparo seguinte o reativa (`pm enable`) — só o que ele mesmo desativou; `[]`
  # devolve tudo. NUNCA entram (o backend não sobe): Play Store, GMS, GSF, WebView, teclado, launcher, SystemUI,
  # Chrome, io.appium.* e o app alvo — o declarado em backend/app/conhecimento/apps (o Instagram) e o de
  # `apps`/`contas.sessao`; o do catálogo do banco sai sozinho da lista.
  # Vale para os emuladores daqui e os dos workers (o central os prepara pelo túnel); a loja e o celular físico ficam
  # fora. Por aparelho: `instances.overrides.<id>.desativar_apps`.
  desativar_apps:
    - com.google.android.googlequicksearchbox   # app Google
    - com.google.android.as                     # Android System Intelligence
    - com.google.android.apps.messaging         # Mensagens
    - com.google.android.youtube
    - com.google.android.apps.youtube.music
    - com.google.android.gm                     # Gmail
    - com.google.android.apps.wellbeing         # Bem-estar digital
    - com.google.android.apps.photos
    - com.google.android.apps.maps
    - com.google.android.calendar
    - com.google.android.apps.docs              # Drive
    - com.google.android.videos                 # Google TV
    - com.google.android.apps.tachyon           # Meet

instances:
  # CPU desta máquina (%) a partir da qual o reparo automático de aparelho espera em vez de reiniciar (ADR-055):
  # com a máquina saturada, reiniciar um convidado só piora. 101 desliga.
  remediation_host_cpu_max: 90
  # Quantos emuladores LOCAIS esta máquina gerencia: android-01 … android-04. Suba este número conforme a RAM
  # livre — a guarda acima recusa o boot que não couber, com o motivo no cartão.
  count: 4
  id_prefix: android-
  base_console_port: 5554    # instância i usa 5554 + 2*(i-1) → serial emulator-<porta>
  base_system_port: 8200     # appium:systemPort exclusivo por instância
  base_mjpeg_port: 9200      # appium:mjpegServerPort exclusivo
  base_chromedriver_port: 9515
  default_app: qa-messenger
  accounts:                  # rótulo de configuração do perfil de conta de cada instância
    android-01: qa-user-01
    android-02: qa-user-02
    android-03: qa-user-03
    android-04: qa-user-04

  # --- BLOCOS OPCIONAIS: ligue um de cada vez, e confira `/api/health` depois de cada um ------------------
  #
  # a) Configuração POR INSTÂNCIA. Chave escrita errada é ERRO na carga, não é ignorada em silêncio.
  # overrides:
  #   android-04:
  #     ram_mb: 2560
  #     hibernation: false
  #   android-03:
  #     gpu_mode: host           # só este aparelho na GPU do host (o que recebe o Outlook); os outros seguem o padrão
  #
  # b) Aparelho ADB EXTERNO no lugar do emulador da instância (celular por USB, `host:porta` por rede,
  #    emulador de OUTRA máquina por túnel SSH). Não gasta RAM deste host nem vaga do rodízio; o painel nunca
  #    o liga, desliga, reseta ou hiberna — só usa. É o caminho para SMS real (emulador não tem SIM).
  #    Cada id citado aqui precisa existir (id <= count), e o endereço precisa estar REALMENTE alcançável:
  #    endereço morto vira "aparelho externo … não está conectado ao ADB" e o monitor tenta reconectar sem fim.
  #    Ver docs/parque-distribuido.md.
  # external:
  #   android-04: "127.0.0.1:15555"
  #
  # c) Aparelho-LOJA: emulador com imagem PLAY STORE, logado na SUA conta Google, que serve de fonte oficial
  #    do aplicativo (o sistema não baixa APK de lugar nenhum). O projeto o liga e desliga, mas NUNCA lhe
  #    despacha tarefa. Exige a imagem, que o instalador padrão NÃO baixa:
  #      pwsh -File scripts\install-prereqs.ps1 -ImageTags google_apis,google_apis_playstore -SkipAppium
  #    Sem a imagem instalada, `/api/health` nasce `degraded` com `system_image_missing`.
  # store: android-04
  # overrides:
  #   android-04:
  #     system_image: "system-images;android-34;google_apis_playstore;x86_64"
  #     window: true             # a conta Google é digitada na JANELA do emulador, nunca pelo painel
  #     hibernation: false       # imagem de loja é build `user` (sem adb root): sem snapshot
  #     extra_emulator_args: []  # sem o `-lowram` global: o perfil da imagem com Play Store roda sem ele
  #     # `ram_mb` omitido = perfil da imagem com Play Store (convidado de 4096 MB, ≈5,2 GB no host)

appium:
  host: 127.0.0.1
  port: 4723
  dir: tools/appium          # instalação local com versões fixadas
  autostart: true
  new_command_timeout_s: 0   # sessões permanecem abertas
  server_launch_timeout_ms: 180000
  adb_exec_timeout_ms: 60000

# Valores iniciais dos limites; depois de iniciados, são editáveis pelo painel (persistidos no banco).
limits:
  max_active_devices: 10
  max_ai_concurrency: 4
  boot_parallelism: 2
  max_steps_per_objective: 12
  max_actions_per_step: 12
  max_attempts_per_step: 3
  step_timeout_s: 180
  objective_timeout_s: 900
  driver_call_timeout_s: 45
  retry_backoff_s: 5
  no_progress_limit: 4
  ai_max_calls_per_objective: 60
  ai_max_tokens_per_run: 3000000
  capture_grid_interval_s: 5
  capture_focus_interval_s: 1
  frame_max_age_ms: 6000
  log_retention_days: 14
  evidence_retention_days: 14
  # Rodízio — N contas sobre K vagas de RAM: o scheduler liga o aparelho quando há tarefa para ele e, sem
  # vaga, hiberna um aparelho ocioso. Nunca desliga aparelho em uso, em foco no painel, com você no controle
  # ou com item bloqueado/incerto de execução aberta.
  auto_start_devices: true
  max_online_devices: 2           # vagas simultâneas: ≈2,6 GB cada. Suba conforme a RAM livre desta máquina
  min_online_dwell_s: 30
  idle_stop_s: 0                  # >0 também hiberna por ociosidade, mesmo sem disputa de vaga

ai:
  # O provedor real é escolhido no .env (AI_PROVIDER). Quando for externo, screenshots e textos das telas SAEM
  # desta máquina para o provedor. Telas com campo de senha nunca são enviadas.
  # --- alavancas de custo (o valor antigo de cada uma está entre parênteses) ---
  screenshot_max_side: 768        # (1280) item 7.6: imagem menor para o ator — tokens de imagem ∝ área
  max_hierarchy_elements: 60      # (140/90) item 7.6: teto mais baixo agora que o alvo da etapa é protegido por boost
  actor_history_lines: 6          # item 7.6: histórico do ator comprimido (REJEITADA/FALHOU/(executor) + últimas N)
  image_policy: auto              # (always) imagem só quando precisa ou quando o modelo pede
  rich_tree_min_elements: 8
  strong_model_for_side_effect: by_risk   # true = todo efeito externo decide no modelo caro (39 % das decisões iam ao
                                          # Opus, até curtir com seletor de commit); by_risk = só risco alto do
                                          # catálogo, risco médio sem seletor de commit, ou app sem catálogo; false = nunca
  verify_max_model_calls: 2       # (5) verificação por visão só rejulga quando a tela muda
  recipes: replay                 # (off) aprende a etapa uma vez e repete por seletores; shadow = só compara
  recipes_promote_after: 2        # receita aprendida nasce candidata (a IA decide, ela só é comparada) e vira ativa
                                  # depois de N execuções seguidas em que a IA fez o caminho dela; 0 = nasce ativa
  flows: true                     # (false) comando repetido reaproveita o plano, sem chamar o planejador
  pathfinder_wait_s: 240          # (0) com vários aparelhos, o 1º aprende e os demais esperam por ele
  # Página de faturamento de cada conta de IA (ADR-051), a que o painel linka em "Abrir console". Sem o parâmetro
  # `billing`, o AI Studio abre a PRIMEIRA conta de faturamento, que pode não ser a pré-paga.
  # balance_consoles:
  #   gemini: https://aistudio.google.com/billing?billing=<ID-da-conta-de-faturamento>
  # Imagens da persona (migração 048): porta própria, FORA dos cinco papéis acima — o saldo da Anthropic não compra
  # imagem. `simulated` (padrão) pinta um degradê determinístico com Pillow, sem chave e sem nada sair da máquina;
  # `openai` usa gpt-image-2 por /v1/images/generations e /edits com a chave OPENAI_API_KEY do .env (outra conta;
  # a verificação da organização pode ser exigida). O gpt-image-1-mini sai da API em 01/12/2026 (Fase 17).
  # O custo REAL vem do `usage` da resposta × price_per_mtok; price_per_image é só a estimativa que confere o teto
  # do dia antes de gerar (conservadora até a medição real) e o custo quando a resposta não traz `usage`.
  image:
    provider: simulated           # simulated | openai
    model: gpt-image-2
    quality: medium               # low | medium | high
    per_persona: 1                # imagens geradas ao criar uma persona (0 desliga)
    on_create: true
    price_per_image: {low: 0.02, medium: 0.06, high: 0.2}           # US$ por imagem: ESTIMATIVA até medir
    price_per_mtok: {text_in: 5.0, image_in: 8.0, output: 30.0}     # US$/M tokens (developers.openai.com, 28/09/2026)
  # Orçamento por etapa, medido no histórico da ação (item 18.3, ADR-052): passar do p90 vira aviso; passar de
  # max(p90 × p90_factor, p90 + slack) chamadas para a etapa. Ação com menos de min_samples etapas concluídas na
  # janela não tem orçamento próprio (vale ai_max_calls_per_objective).
  step_budget: {enabled: true, p90_factor: 2.0, slack: 4, min_samples: 5, window_days: 30}
  prices:                         # US$ por milhão de tokens [entrada, cache lido, cache gravado, saída]
    claude-opus-5-5: [4.0, 0.2, 5.0, 20.0]   # cache lido a 0,05× (os demais são 0,1×) — platform.claude.com, 24/09/2026
    claude-opus-5: [5.0, 0.5, 6.25, 25.0]
    claude-sonnet-5: [2.0, 0.2, 2.5, 10.0]
    claude-haiku-4-5: [1.0, 0.1, 1.25, 5.0]
    claude-opus-4-8: [5.0, 0.5, 6.25, 25.0]
    # Fase 17: candidatos de outros provedores (preço de lista em 28/09/2026; ver docs/pesquisa-provedores-ia-*.md).
    gpt-6-luna: [0.10, 0.01, 0.10, 0.50]            # developers.openai.com/api/docs/pricing (Standard)
    gemini-3.1-flash-lite: [0.25, 0.025, 0.25, 1.50]  # ai.google.dev/gemini-api/docs/pricing
    deepseek-flash: [0.30, 0.006, 0.30, 1.20]       # preço de PICO (fora do pico é a metade); api-docs.deepseek.com
    # Modelo LOCAL de graça declara-se assim (e só assim): [0, 0, 0, 0]. Modelo AUSENTE desta tabela é contado
    # pelo preço mais caro dela, nunca como zero.

  # Capacidade DECLARADA por modelo: modelo ausente daqui é tratado de forma conservadora (sem strict, sem
  # thinking, sem effort, JSON por json_object) — que é o certo para um modelo local pequeno.
  # `min_cache_tokens` é o prefixo cacheável mínimo de CADA modelo (informativo; o ponto de cache é pedido sempre e
  # a API ignora o que fica abaixo do mínimo). Não é monótono entre gerações.
  models:
    claude-opus-5-5:  {vision: true, tools: true, strict_tools: false, structured_output: json_schema, thinking: true, effort: true, min_cache_tokens: 512}
    claude-opus-5:    {vision: true, tools: true, strict_tools: false, structured_output: json_schema, thinking: true, effort: true, min_cache_tokens: 512}
    claude-sonnet-5:  {vision: true, tools: true, strict_tools: false, structured_output: json_schema, thinking: true, effort: true, min_cache_tokens: 1024}
    claude-opus-4-8:  {vision: true, tools: true, strict_tools: false, structured_output: json_schema, thinking: true, effort: true, min_cache_tokens: 1024}
    claude-haiku-4-5: {vision: true, tools: true, strict_tools: false, structured_output: json_schema, thinking: false, effort: false, min_cache_tokens: 4096}
    # Fase 17. `json_object` de propósito: o esquema vai no texto e o Pydantic garante (K-042); o strict da OpenAI e o
    # json_schema da camada compatível do Gemini não foram provados com os esquemas deste projeto.
    # O gpt-6-luna só chama ferramenta no Chat Completions com reasoning_effort=none (doc do modelo, 28/09/2026).
    gpt-6-luna: {vision: true, tools: true, strict_tools: false, structured_output: json_object, thinking: false, effort: false, max_tokens_field: max_completion_tokens, extra_body: {reasoning_effort: none}}
    # No Gemini 3 o raciocínio não desliga pela camada compatível; minimal é o menor nível.
    gemini-3.1-flash-lite: {vision: true, tools: true, strict_tools: false, structured_output: json_object, thinking: false, effort: false, extra_body: {reasoning_effort: minimal}}
    deepseek-flash: {vision: true, tools: true, strict_tools: false, structured_output: json_object, thinking: false, effort: false, extra_body: {thinking: {type: disabled}}}

  # `providers` e `roles` vazios = um provedor só, o do .env (AI_PROVIDER), com os modelos por função de
  # AI_MODEL_*. Nada muda enquanto estes dois blocos não existirem. Para ligar um endpoint próprio compatível
  # com OpenAI, o Ollama NATIVO no Windows (item 7.8 — confira o ambiente com scripts\ollama-local.ps1 antes de
  # colar isto; ele só confere e imprime este bloco, não instala nem baixa nada):
  #
  # providers:
  #   local:
  #     kind: openai
  #     base_url: http://127.0.0.1:11434/v1    # Ollama nativo (roda no Windows; não precisa de WSL nem Docker)
  #     api_key_env: OLLAMA_API_KEY            # opcional — o Ollama padrão não exige chave nenhuma
  #     sends_data_externally: false           # é isto que a aba IA mostra por função
  #     extra_body: {options: {num_ctx: 16384}}  # o TAMANHO DE CONTEXTO fica no SERVIDOR (OLLAMA_CONTEXT_LENGTH
  #                                               # ou o Modelfile) — sem um dos dois lá, o padrão dele trunca o
  #                                               # prompt em silêncio; isto aqui só repassa a opção por chamada
  #   anthropic:
  #     kind: anthropic
  #     fallback_model: claude-sonnet-5
  # models:
  #   qwen3-vl:4b: {vision: true, tools: true, strict_tools: false, structured_output: json_object,
  #                 thinking: false, effort: false, max_output: 4096}
  # prices:
  #   qwen3-vl:4b: [0, 0, 0, 0]   # preço DECLARADO de zero; sem esta linha ele contaria pela tarifa mais cara
  # roles:
  #   decide:  {provider: local, model: qwen3-vl:4b, fallback_provider: anthropic, timeout_s: 45}
  #   verify:  {provider: anthropic}
  #   plan:    {provider: anthropic}
  #   escalation: {provider: anthropic}
  #   social:  {provider: anthropic, refusal_fallback: false}   # sem fallback pago na escrita da persona
  #
  # SEM `fallback_provider` escrito, a falha do endpoint local NÃO cai no provedor pago: o erro sobe. Prazos
  # por função sem nada declarado: plan 120 s · decide 45 s · verify 30 s · escalation 60 s · social 60 s.
  #
  # Fase 17 — ator e verificador baratos em nuvem (candidatos; só adote depois da bateria, docs/plano-provedores-ia-*):
  #
  # providers:
  #   openai:
  #     kind: openai
  #     base_url: https://api.openai.com/v1
  #     api_key_env: OPENAI_API_KEY             # a MESMA chave da imagem; lida do .env por EnvSettings
  #   gemini:
  #     kind: openai                            # camada compatível do Gemini API (faturamento ligado: o plano
  #     base_url: https://generativelanguage.googleapis.com/v1beta/openai   # gratuito usa o conteúdo p/ treino)
  #     api_key_env: GEMINI_API_KEY
  #   anthropic:
  #     kind: anthropic
  #     fallback_model: claude-sonnet-5
  # roles:
  #   decide:  {provider: openai, model: gpt-6-luna, fallback_provider: anthropic}
  #   verify:  {provider: openai, model: gpt-6-luna, fallback_provider: anthropic}
  #   escalation: {provider: anthropic, model: claude-sonnet-5}
  #   plan:    {provider: anthropic}
  #   social:  {provider: anthropic, refusal_fallback: false}

releases:                         # entrega e conferência de versão no parque
  verify_max_age_h: 24            # validade do "está instalado aqui"; passado isso, relê do aparelho. 0 desliga
  # Prazos do instalador, em segundos: o custo real muda com a máquina (num worker sob disputa de CPU, um
  # `adb shell` já estourou 30 s). Meça e ajuste AQUI; nada disso é constante de código.
  profile_timeout_s: 30
  inspect_timeout_s: 40
  install_timeout_s: 900
  launch_deadline_s: 90

contas:                           # contas gerenciadas de qualquer app com login declarado (ADR-052)
  session_max_age_s: 43200        # validade do "Conectado"; passado isso, a sessão é relida do aparelho. 0 desliga
  # Ajustes do login por PACOTE, por cima do `sessao.yaml` do app (app/conhecimento/apps/<pacote>/). Só o que
  # for escrito vale; o resto vem do dado do app. (Era o bloco `instagram:`, que não é mais aceito.)
  # sessao:
  #   com.instagram.android: {settle_s: 5, submit_wait_s: 60}

skills:                           # habilidades versionadas (docs/design/evolucao-arquitetural.md, decisão P1)
  enabled: false                  # (false) habilidade PUBLICADA casa o comando antes do fluxo legado (ai.flows)

context_retrieval:                # retrieval de contexto de código: léxico + BM25 locais e provedor semântico plugável (ADR-063)
  enabled: false                  # (false) desligado = nada muda; ligar também exige escolher `mode`
  mode: disabled                  # disabled | local_only (léxico+BM25) | shadow (mede o semântico, entrega o local) | hybrid
  top_k: 5                        # arquivos no contexto entregue (top-3/top-5)
  # lexical_preserve: 1           # arquivos lexicais mantidos no topo pela regra híbrida v1 (o que o piloto validou)
  # sensitive_paths: []           # globs que NUNCA entram em índice, mapa ou chunk, além dos fixos (.env, data/, secrets/ ...)
  # cache: {enabled: true, directory: context_retrieval}   # em `paths.data_dir`; fora do Git
  semantic:
    provider: none                # none | fake | jev. A chave do jev é TYPESAFE_API_KEY (ambiente ou .env), nunca aqui
    repository_class: private     # private é NEGADO a provedor remoto (PRIVATE_CODE_SEND_APPROVED = False, constante de código)
    # allow_public: false         # repositório público só segue a provedor remoto com isto ligado
    # timeout_ms: 5000
    # max_calls: 2                # por pedido (etapa A mapa + etapa B trechos)
    # max_cost_usd: 0.05

provisioning:                     # aparelho novo pela plataforma, neste servidor (POST /api/instances)
  min_free_disk_gb: 10            # disco livre mínimo do hospedeiro (última batida) para aceitar criar mais um AVD

rede:                             # rede por aparelho (ADR-056): aplicação no aparelho e servidor do central (25.4)
  cliente_pacote: io.nekohasekai.sfa   # cliente VPN no aparelho (sing-box), instalado pela versão promovida na loja
  deriva_s: 900                   # releitura periódica da rede aplicada (settings, tun0); 0 desliga
  validade_verificacao_s: 21600   # trafego_verificado vence depois disto (política exigida: a tarefa espera medir de novo)
  cliente_tile: io.nekohasekai.sfa/.bg.TileService   # tile do cliente: religa o túnel sem reiniciar (29.3); vazio desliga
  espera_tun_s: 180               # espera pelo tun0 contada do boot (medido em 30/09: sobe entre 92 e 176 s, nunca depois de 180)
  reinicios_max: 2                # reinícios por revisão antes de desistir (o tile é tentado antes de cada um)
  dns: 1.1.1.1                    # DNS do cliente pelo túnel
  servidor:                       # sing-box do central em modo usuário: sobe só com aparelho atribuído a perfil `servidor: central`
    binario: data/rede/sing-box-1.14.2-windows-amd64/sing-box.exe   # fora do Git; a config vai em arquivo com ACL do usuário
    porta_wireguard: 51820        # UDP, em todas as interfaces (o endpoint do sing-box não tem campo de escuta)
    sub_rede: 10.66.0.0/24        # servidor no .1; um endereço por aparelho a partir do .2
    porta_proxy: 18080            # proxy autenticado, só em 127.0.0.1, alcançado pelo túnel no endereço do servidor
    mtu: 1408
    log_max_mb: 20                # log de conexões (evidência); renomeado no início seguinte ao teto
    endpoint_lan: ""              # IP do central NA LAN para aparelhos de outra máquina (notebook do worker); vazio = remoto recusado.
                                  # O UDP da porta_wireguard precisa passar no Firewall do Windows daqui: a plataforma só LÊ e
                                  # mostra o comando do dono em GET /api/network/server → remote_access (item 25.7)
  sonda:                          # sonda de saída de dentro do aparelho, como uid 2000 (25.5)
    hosts_ipv4: [api.ipify.org, ipv4.icanhazip.com]   # eco de IP por HTTP/1.0 na 80; só registro A
    hosts_ipv6: [api6.ipify.org, ipv6.icanhazip.com]  # idem, só AAAA (com strict_route o IPv6 fica preso no túnel)
    udp_dns: 8.8.4.4              # UDP de DNS de ida e volta (o cliente sequestra e resolve pelo túnel)
    udp_ntp: time.google.com      # UDP que não é DNS (NTP); udp_ok só com os dois
    reverificar_s: 600            # aparelho `parcial` é medido de novo depois disto (varredura ou porta da tarefa)
    abrir_apps: false             # true = a sonda abre o app exigido sem tráfego na janela TAMBÉM sem tarefa esperando
                                  # (com tarefa segurada pela porta, abre sempre: é o que a tarefa faria; é usar a conta)
    espera_app_s: 15              # quanto o app aberto pela sonda fica na frente antes de voltar ao início

aprendizado:                      # aprendizado contínuo (ADR-054): livro, D1, falha classificada; NENHUMA IA no pipeline
  enabled: true                   # digest a cada execução e curadoria periódica; false = só a leitura do livro
  curadoria_s: 900                # passo da curadoria (régua diária dos últimos dias e passos dos pacotes seguintes)
  # Modos: "off" não grava · "shadow" grava e mede sem consumir · "on" publica sozinho o que NÃO tem efeito externo
  # nem texto de pessoa (D1). As aspas importam: sem elas o YAML lê off/on como booleano.
  licoes:
    modo: "shadow"
    ator: {tokens: 120, max: 3}
    planejador: {tokens: 150, max: 3}
    minimo_por_braco: 8           # unidades por braço para o veredito de efeito (o painel mostra "faltam N")
    maximo_por_braco: 20
    holdout_publicada: 0.1
  telas: {modo: "observe", observacoes: 3, execucoes: 2}    # "observe": grava e valida, a sessão não consome
  # Fluxo aprendido de execução (D1): nasce candidato; a sombra no digest publica o sem efeito depois de
  # `concordancias` execuções concordantes além da que o gerou, e o com efeito para em validated (o dono aprova).
  # com_prova: false = o modo anterior (nasce ativo, sem D1): só para a suíte que prova o reaproveitamento.
  fluxo: {concordancias: 1, com_prova: true}
  voz: {modo: "off"}              # a voz é sempre publicada pelo dono
  preferencias: {modo: "off"}
  backlog: {minimo_ocorrencias: 3, pessoa_usd: 0.25, aparelho_usd_min: 0, prova_minimo: 10, prova_fator: 0.5}
  ia_resumos_por_dia: 0           # lição escrita por IA: desligada (gasta saldo e abre injeção); só 0 é aceito
  takeover_gravar: false          # gravar as entradas manuais da tomada de controle fora do treino
  retencao: {sinais_dias: 180, feedback_dias: 365, exposicoes_dias: 120, evidencias_por_item: 200, diario_dias: 400,
             candidata_sem_evidencia_dias: 90}

apps:
  # Navegador que já vem na imagem google_apis (ADR-025): sites entram pela ferramenta `open_url`, com endereço
  # escrito no comando. Sem esta linha o planejador não tem app para "abra o Chrome e entre no site…".
  - id: chrome
    name: Chrome
    package: com.android.chrome
    nav_hints: >-
      Navegador. O endereço é aberto direto (open_url), sem digitar na barra. No primeiro uso o Chrome mostra boas-
      vindas ("Aceitar e continuar", "Usar sem uma conta", "Não, obrigado"): dispense e siga. Formulário de login de
      site fica numa WebView: campos e botões aparecem na hierarquia; se não aparecerem, peça a imagem.
  - id: qa-messenger
    name: QA Messenger
    package: com.pocqa.messenger
    activity: .MainActivity
    apk_path: qa-app/dist/qa-messenger.apk
    builtin: true
    nav_hints: >-
      App de QA com contas fictícias. A tela inicial lista conversas e mostra "Conta: <conta>" no topo.
      Tocar em um contato abre a conversa; o campo "Mensagem" e o botão "Enviar" ficam na base.
      Cada mensagem mostra um status: "Enviando…", "Enviada ✓", "Entregue ✓✓", "Lida ✓✓" ou "Falha no envio ✕".
      O botão "Perfil" abre um formulário (Nome, E-mail, Cidade, Receber notificações, Salvar).
      Se aparecer o aviso "Novidades da versão", toque em "Agora não".
    known_selectors:
      account_label: id=com.pocqa.messenger:id/account_label
      conversation_list: id=com.pocqa.messenger:id/conversation_list
      message_input: id=com.pocqa.messenger:id/message_input
      send_button: id=com.pocqa.messenger:id/send_button

# Telas que NÃO podem virar evidência em disco nem imagem no corpo da requisição ao provedor de IA. O critério
# embutido já cobre, sozinho: campo de senha, tela de desafio/2FA e TODA tela do aparelho-loja. Esta lista é
# para o que só quem cadastrou o app sabe.
#
#   package:      opcional; sem ele a regra vale para qualquer app
#   resource_ids: casa por SUFIXO do resource-id (`:id/cpf` casa com `com.exemplo:id/cpf`)
#   texts:        casa por texto contido, sem acento e sem caixa
#   why:          aparece na mensagem da etapa e na evidência
sensitive_screens: []
#   - package: com.exemplo.banco
#     resource_ids: [":id/cpf", ":id/saldo"]
#     texts: ["dados do titular"]
#     why: dados pessoais do titular da conta
