name: Limpeza das branches de revisão

# 29.155 (C18): as frentes abrem PRs só de revisão a partir de branches `revisao/*`; depois do corte elas apontam para commits que
# já estão na main. Este workflow apaga, uma vez por dia, só as que JÁ ESTÃO na main, já tiveram PR, não têm PR aberto e têm a ponta
# de mais de 6 horas (no máximo 20 por execução). Nada fora de `revisao/` é tocado, nem a main. O código e as condições estão em
# `scripts/limpar_branches_revisao.py` (teste: `scripts/tests/test_limpar_branches_revisao.py`).
#
# Onde roda: SEMPRE em runner hospedado (`ubuntu-latest`). NUNCA copie `fromJSON(vars.CI_RUNS_ON ...)`: o runner `central` é a máquina
# do dono. O disparo manual (`gh workflow run limpa-branches-revisao.yml`, só depois de o arquivo estar na `main`) é ENSAIO por
# padrão: só apaga com `aplicar=true`. O agendado só apaga se a variável do repositório `LIMPEZA_APLICAR` valer `true`; sem ela é
# ensaio (liga-se depois de um disparo manual com `aplicar=true` conferido).
# Permissão: `contents: write` só para apagar as refs desses prefixos; sem segredo novo (token do próprio workflow).

on:
  workflow_dispatch:
    inputs:
      aplicar:
        description: 'Apagar de verdade (true) ou só mostrar o que apagaria (false)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
  schedule:
    - cron: "11 8 * * *"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: limpa-branches-revisao
  cancel-in-progress: false

jobs:
  limpar:
    name: limpar · revisao/* já na main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: apaga as já mescladas (ensaio no disparo manual sem aplicar=true)
        env:
          GH_TOKEN: ${{ github.token }}
          APLICAR: ${{ github.event_name == 'schedule' && vars.LIMPEZA_APLICAR || inputs.aplicar }}
        run: |
          if [ "$APLICAR" = "true" ]; then
            python3 scripts/limpar_branches_revisao.py --repo "$GITHUB_REPOSITORY" --aplicar
          else
            python3 scripts/limpar_branches_revisao.py --repo "$GITHUB_REPOSITORY"
          fi
