name: Secret scan

# 29.158 (Frente DevOps, candidato 1): varre o HISTÓRICO INTEIRO do repositório com o gitleaks. Não bloqueia push nem PR
# (não há gatilho de push): é uma rede, como o cron do CI. Disparo manual (`gh workflow run secret-scan.yml`, só vale depois
# que este arquivo está na `main`) e uma vez por semana.
#
# Onde roda: SEMPRE em runner hospedado (`ubuntu-latest`). NUNCA copie `fromJSON(vars.CI_RUNS_ON ...)`: o runner `central`
# é a máquina do dono e este job não precisa dele.
#
# A imagem do gitleaks é fixada por DIGEST (v8.30.1, ghcr.io/gitleaks/gitleaks), não por tag: tag se move.
# Saída redigida: o gitleaks roda com `--redact`, o relatório fica no disco do runner (some com ele, não vira artefato) e
# o log do gitleaks é descartado. O que sai no log e na issue é só `scripts/secret_scan_resumo.py`: regra, caminho, linha e
# hash curto do commit, nunca o valor, o contexto, o autor ou o e-mail (teste: `scripts/tests/test_secret_scan_resumo.py`).
# Se o relatório vier sem redação (ou sem a chave `Secret`), o resumo não imprime nada e o job falha. "0 achados" só vale com
# o histórico completo: antes do gitleaks o job confere que o checkout não é raso e imprime a contagem de commits.
# O digest é o do índice multi-arquitetura da tag v8.30.1, lido do registro ghcr.io em 06/10/2026.
#
# Achado: UMA issue com o rótulo `achado` ("Secret scan AAAA-MM-DD: N achado(s)"), ou comentário na aberta. Achado de
# verdade quer dizer segredo vazado: trocar, não só apagar do histórico. Falso positivo vai em `.gitleaks.toml`.

on:
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * 1"

permissions:
  contents: read
  issues: write

concurrency:
  group: secret-scan
  cancel-in-progress: false

jobs:
  varredura:
    name: gitleaks · histórico inteiro
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0               # o histórico inteiro, não só o último commit
          persist-credentials: false

      - name: o checkout trouxe o histórico inteiro?
        # "0 achados" só vale se algo foi varrido: checkout raso ou vazio daria zero e pareceria limpo.
        run: |
          test "$(git rev-parse --is-shallow-repository)" = "false" || { echo "checkout raso: a varredura não cobre o histórico"; exit 1; }
          n=$(git rev-list --all --count)
          echo "commits no histórico a varrer: $n"
          test "$n" -ge 2 || { echo "histórico curto demais para ser o do repositório"; exit 1; }

      - name: gitleaks (imagem por digest, saída redigida)
        env:
          IMAGEM: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        run: |
          mkdir -p "$RUNNER_TEMP/gl"
          # --user: o mesmo dono dos arquivos do checkout (senão o git recusa o repositório por "dubious ownership").
          # --exit-code 0: achado não derruba o job (quem decide é o resumo); erro de configuração derruba.
          # stdout e stderr descartados: o relatório redigido é lido só pelo resumo.
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo:ro" -v "$RUNNER_TEMP/gl:/out" "$IMAGEM" git /repo \
            --config /repo/.gitleaks.toml --redact=100 --no-banner --exit-code 0 \
            --report-format json --report-path /out/relatorio.json >/dev/null 2>&1 \
            || { echo "gitleaks terminou com erro (configuração ou execução); saída não exibida por segurança"; exit 1; }
          test -f "$RUNNER_TEMP/gl/relatorio.json" || { echo "o gitleaks não gerou o relatório"; exit 1; }

      - name: resumo redigido e issue do achado
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/secret_scan_resumo.py --relatorio "$RUNNER_TEMP/gl/relatorio.json" --repo "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID"

      - name: apaga o relatório
        if: always()
        run: rm -rf "$RUNNER_TEMP/gl"
