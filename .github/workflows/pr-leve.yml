name: CI leve do PR

# 29.175: um check HOSPEDADO e leve a cada PR, para o PR ter um verde ou um vermelho sem esperar a suíte do funil. Cobre só o que é
# barato e não depende da máquina do dono: docs-check, os testes de `scripts/tests`, typecheck + vitest + build do frontend.
# NÃO roda a suíte do backend (SQLite nem PostgreSQL): essa continua sendo do funil dos cortes e do cron das 05:17Z do ci.yml.
#
# Onde roda: SEMPRE em runner hospedado (`ubuntu-latest`). NUNCA copie `fromJSON(vars.CI_RUNS_ON ...)`: o runner `central` é a
# máquina do dono (suítes e medidas de latência) e este workflow nunca o toca nem o carrega. O ci.yml continua SEM `pull_request`
# (29.102); este arquivo é outro workflow, com outro nome de check.
#
# Atenção ao `[skip ci]`: o GitHub não dispara workflows de `pull_request` se a ponta do PR tem `[skip ci]` no assunto. Desde 29.176 a
# marca é SÓ dos commits que vão para a `main` (o `ci.yml` nunca roda por push de branch, travado por `test_ci_gatilhos.py`), então o
# último commit de uma branch de PR NÃO leva `[skip ci]` e o check leve roda. O disparo manual é um run avulso, não um check do PR.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  actions: read   # só para o resumo do job ler os tempos das etapas do próprio run

concurrency:
  # Um push novo no mesmo PR cancela o check anterior: só o último importa e cada minuto hospedado conta.
  group: pr-leve-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22.12.0"

jobs:
  docs-e-scripts:
    name: docs-check + scripts/tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/python-isolado
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache-dependency-path: backend/requirements.txt
      - name: instalar dependências
        run: pip install -r backend/requirements.txt pytest
      - name: docs-check
        run: python scripts/docs-check.py
      - name: pytest scripts/tests
        shell: bash   # bash explícito liga o pipefail: o `tee` não esconde a falha do pytest
        run: python -m pytest -q scripts/tests 2>&1 | tee "$RUNNER_TEMP/pytest.out"
      - name: Resumo do job
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/pr_leve_resumo.py --nome "docs-check + scripts/tests" --repo "$GITHUB_REPOSITORY" --run "$GITHUB_RUN_ID" --tentativa "$GITHUB_RUN_ATTEMPT" --runner "$RUNNER_NAME" --pytest "$RUNNER_TEMP/pytest.out" | tee -a "$GITHUB_STEP_SUMMARY"

  frontend:
    name: frontend · typecheck + vitest + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: vitest
        shell: bash   # bash explícito liga o pipefail: o `tee` não esconde a falha do vitest
        run: npm test -- --maxWorkers=2 2>&1 | tee "$RUNNER_TEMP/vitest.out"
      - name: build
        run: npm run build
      - name: Resumo do job
        if: ${{ !cancelled() }}
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/pr_leve_resumo.py --nome "frontend · typecheck + vitest + build" --repo "$GITHUB_REPOSITORY" --run "$GITHUB_RUN_ID" --tentativa "$GITHUB_RUN_ATTEMPT" --runner "$RUNNER_NAME" --vitest "$RUNNER_TEMP/vitest.out" | tee -a "$GITHUB_STEP_SUMMARY"
