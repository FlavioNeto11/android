name: Custo · medida semanal

# 29.188 — toda segunda, 06:00Z, lê o custo da semana do GitHub e publica: o relatório de `scripts/github_custo.py --resumos`
# (minutos hospedados faturáveis estimados, créditos estimados do Copilot, resumos por job do 29.184) vai como artifact do run e
# como comentário numa issue ÚNICA com o rótulo `custo` (aberta na primeira vez). Nunca atribui ninguém nem usa rótulo de agente.
#
# Onde roda: SEMPRE em runner hospedado (`ubuntu-latest`); só fala com a API do GitHub. NUNCA use o `CI_RUNS_ON` do ci.yml aqui: o
# runner próprio é a máquina do dono. Sem segredo novo: usa o token do próprio workflow (`actions: read`, `issues: write`).
# O que o token não alcança (billing da conta) o relatório diz como "NÃO lido"; os créditos reais continuam sendo lidos pelo dono
# ou pela frente na página de uso da conta.
# O código é `scripts/github_custo.py` e `scripts/custo_semanal_issue.py` (testes: `scripts/tests/test_custo_semanal_issue.py`).

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: custo-semanal
  cancel-in-progress: false

jobs:
  medir:
    name: medir · custo da semana
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: relatório da semana
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/github_custo.py --repo "$GITHUB_REPOSITORY" --dias 7 --resumos > relatorio-custo.md
      # Confere o formato ANTES de o texto ir para o summary e para o artifact (retido 90 dias): se tiver dado que não pode sair, o job cai aqui.
      - name: confere o relatório
        run: python scripts/custo_semanal_issue.py --repo "$GITHUB_REPOSITORY" --arquivo relatorio-custo.md --ensaio
      - name: relatório no job summary
        run: cat relatorio-custo.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relatorio-custo
          path: relatorio-custo.md
          retention-days: 90
      - name: publica na issue de custo
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/custo_semanal_issue.py --repo "$GITHUB_REPOSITORY" --arquivo relatorio-custo.md
