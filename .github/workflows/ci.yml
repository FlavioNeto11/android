name: CI

# Achado #161 — não havia CI: pytest (SQLite), tsc, vitest e a corrida em PostgreSQL dependiam de alguém
# lembrar de rodar. Seis jobs (mais o `backend-tipos`, mypy gradual, desde 27/09), cada um cobrindo uma
# promessa feita em outro lugar do projeto:
#   1) backend em SQLite — o padrão de todo mundo, a cada push;
#   2) backend em PostgreSQL — paridade de dialeto (docs/banco.md), agendada: cara demais para todo push;
#   3) frontend — tsc --noEmit + vitest, a cada push;
#   4) dependências — pip-audit (backend + agente) e npm audit (frontend, Appium), a cada push e na corrida diária;
#   5) smoke do agente do worker — instala só com worker-requirements.txt e importa app.worker.agent, provando
#      que as "seis dependências" (docs/worker.md) continuam sendo as seis, sem o resto do backend de carona.
#
#   6) documentação — scripts/docs-check.py (links, mapa do plano-100, IDs, migrações) e os testes do
#      livro-razão e do próprio checador; Python puro, sem dependências.
#
# Lacunas conhecidas: de `scripts/tests` só rodam os testes puros do job 6 (o `npm run build` entrou no job 3 em
# 27/09, B7) — os
# demais chamam pwsh com caminhos do Windows (ver docs/operacao.md §5).
#
# Nenhum destes jobs precisa de Android SDK, emulador ou adb: a suíte fala com aparelhos FALSOS (ver
# tests/fake_device.py e tests/fake_instagram.py) e o único teste que chama um binário externo de verdade
# (tests/test_backup.py, via pwsh) se pula sozinho fora do venv Windows do projeto — confira o skipif ali.

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"      # corrida diária em PostgreSQL — paridade de dialeto sem custar em todo push

# Onde roda (28/09): com o limite de gasto do Actions atingido e o dono sem pagar mais, os jobs passaram a poder
# rodar num runner PRÓPRIO na máquina central (tarefa `farm-ci-runner`, docs/operacao.md §CI), que não consome os
# minutos da conta. Quem escolhe é a variável do repositório `CI_RUNS_ON` (JSON, ex.: ["self-hosted","central"]);
# sem ela, tudo volta ao runner da GitHub. O job de PostgreSQL fica SEMPRE na GitHub: usa contêiner de serviço,
# que só existe em runner Linux com Docker. `shell: pwsh` nos dois sistemas (existe no ubuntu da GitHub e na
# máquina central): no Windows o runner resolve `bash` para o `system32\bash.exe` do WSL mesmo com o bash do Git
# no PATH (medido em 28/09), e o WSL não é lugar de CI. Cada job de Python tem venv próprio
# (.github/actions/python-isolado), porque no runner próprio o Python do toolcache é compartilhado.

concurrency:
  # Um push novo no mesmo ref cancela o CI anterior (o runner próprio é um só: a fila crescia a cada push das
  # sessões). O evento entra na chave para a corrida agendada não ser cancelada por um push.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22.12.0"

jobs:
  backend-sqlite:
    name: backend · pytest (SQLite)
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-isolado
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  backend-postgres:
    name: backend · pytest (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: farm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:teste@localhost:5432/farm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
        # conftest.pytest_sessionfinish apaga, no fim, os schemas que esta corrida criou (achado #163) — o
        # serviço 'postgres' nasce vazio a cada job de qualquer forma, mas o hábito é o que vale.

  frontend:
    name: frontend · typecheck + vitest
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # B7: o `dist` que o backend serve sai deste build; um erro que só o Vite pega (import dinâmico, asset)
      # passava pelo typecheck e pelo vitest e só aparecia no deploy.
      - run: npm run build

  dependencias:
    # Achado #131 — nada avisava quando surgisse CVE em fastapi/starlette/cryptography, e o Appium local já
    # carregava 7 vulnerabilidades moderadas (morgan <1.12.0, log forging, via @appium/base-driver) sem que
    # ninguém soubesse. Roda a cada push E na corrida diária: CVE nova aparece num repositório parado.
    #
    # `--audit-level=high` no npm de propósito: reprovar em MODERADA travaria todo push por causa do morgan do
    # Appium, que é dependência transitiva sem correção publicada e está preso a 127.0.0.1. O relatório completo
    # (`|| true` na listagem) fica no log do job, então a moderada continua VISÍVEL sem virar portão.
    name: dependências · pip-audit + npm audit
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-isolado
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pip install pip-audit
      - name: pip-audit (backend e agente do worker)
        run: pip-audit --strict -r backend/requirements.txt -r backend/worker-requirements.txt -r backend/requirements-dev.txt
      - name: npm audit (frontend)
        working-directory: frontend
        run: |
          npm audit --omit=dev
          npm audit --omit=dev --audit-level=high
      - name: npm audit (Appium)
        working-directory: tools/appium
        run: |
          npm audit
          npm audit --audit-level=high

  backend-tipos:
    # Tipagem gradual (ADR-030, fase A da evolução arquitetural). O código novo da arquitetura modular
    # (`app.contracts`, `app.modules`) nasce estrito e REPROVA; o legado só é MEDIDO (124 erros em fc5f1eb, com o
    # padrão do mypy) até cada pacote ser ligado. O mypy vem de requirements-dev.txt e nunca do requirements.txt:
    # deploy.ps1 instala este último no venv de produção.
    name: backend · mypy (gradual)
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-isolado
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - uses: actions/cache@v4
        with:
          path: backend/.mypy_cache
          key: mypy-${{ hashFiles('backend/requirements*.txt') }}-${{ github.sha }}
          restore-keys: mypy-${{ hashFiles('backend/requirements*.txt') }}-
      # 1) código novo: bloqueante. Com follow_imports=silent, o legado importado não reporta erro aqui.
      - run: python -m mypy -p app.contracts -p app.modules -p app.shared
      # 2) legado: só mede (a contagem fica no log), não reprova.
      - run: python -m mypy
        continue-on-error: true

  worker-agent-smoke:
    name: worker · instala só o agente e importa
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-isolado
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache-dependency-path: backend/worker-requirements.txt
      - run: pip install -r worker-requirements.txt
      - run: python -c "import app.worker.agent"

  docs:
    name: docs · docs-check e livro-razão do plano-100
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-isolado
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pytest
      - run: python scripts/docs-check.py
      - run: python -m pytest -q scripts/tests/test_docs_check.py scripts/tests/test_claude_plan_100.py
