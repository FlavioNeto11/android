name: CI

# Achado #161 — não havia CI: pytest (SQLite), tsc, vitest e a corrida em PostgreSQL dependiam de alguém
# lembrar de rodar. Seis jobs (mais o `backend-tipos`, mypy gradual, desde 27/09), cada um cobrindo uma
# promessa feita em outro lugar do projeto:
#   1) backend em SQLite — o padrão de todo mundo, a cada push;
#   2) backend em PostgreSQL — paridade de dialeto (docs/banco.md), agendada: cara demais para todo push;
#   3) frontend — tsc --noEmit + vitest, a cada push;
#   4) dependências — pip-audit (backend + agente) e npm audit (frontend, Appium), a cada push e na corrida diária;
#   5) smoke do agente do worker — instala só com worker-requirements.txt e importa app.worker.agent, provando
#      que as "seis dependências" (docs/worker.md) continuam sendo as seis, sem o resto do backend de carona.
#
#   6) documentação — scripts/docs-check.py (links, mapa do plano-100, IDs, migrações) e os testes do
#      livro-razão e do próprio checador; Python puro, sem dependências.
#
# Lacunas conhecidas: de `scripts/tests` só rodam os testes puros do job 6 (o `npm run build` entrou no job 3 em
# 27/09, B7) — os
# demais chamam pwsh com caminhos do Windows (ver docs/operacao.md §5).
#
# Nenhum destes jobs precisa de Android SDK, emulador ou adb: a suíte fala com aparelhos FALSOS (ver
# tests/fake_device.py e tests/fake_instagram.py) e o único teste que chama um binário externo de verdade
# (tests/test_backup.py, via pwsh) se pula sozinho fora do venv Windows do projeto — confira o skipif ali.

on:
  # 29.176: este arquivo SÓ dispara pelo cron e pelo disparo manual (travado por `scripts/tests/test_ci_gatilhos.py`): push de
  # branch e PR nunca acionam o runner central. O check de PR é o `pr-leve.yml`, hospedado.
  # Push só na main (28/09): com um runner próprio só, o push de cada branch com PR rodava duas vezes (push e
  # pull_request) e enchia a fila.
  # PUSH DESLIGADO em 30/09/2026 (decisão do dono: o ambiente ainda não é produção e esperar o CI atrasava todo o
  # processo). Para voltar a rodar em todo push da main: devolver `push: branches: [main]` aqui.
  # PULL_REQUEST DESLIGADO em 05/10/2026 (29.102, decisão da orquestradora): cada PR custava de 62 a 115 min serial no
  # runner do central, que é a máquina das suítes e das medidas de latência, e o `[skip ci]` na ponta falhou três
  # vezes no mesmo dia. Os PRs são cobertos pelo funil da suíte (SQLite inteira, PG dirigido, front). A rede é a
  # corrida diária abaixo e o disparo manual. Para voltar: devolver `pull_request:` aqui.
  workflow_dispatch:
    inputs:
      somente_postgres:
        description: 'Roda so o job backend-postgres (hospedado), sem ocupar o runner do central com o SQLite'
        type: boolean
        default: false
  schedule:
    - cron: "17 5 * * *"      # corrida diária em PostgreSQL — paridade de dialeto sem custar em todo push

# Onde roda (28/09): com o limite de gasto do Actions atingido e o dono sem pagar mais, os jobs passaram a poder
# rodar num runner PRÓPRIO na máquina central (tarefa `farm-ci-runner`, docs/operacao.md §CI), que não consome os
# minutos da conta. Quem escolhe é a variável do repositório `CI_RUNS_ON` (JSON, ex.: ["self-hosted","central"]);
# sem ela, tudo volta ao runner da GitHub. O job de PostgreSQL fica SEMPRE na GitHub: usa contêiner de serviço,
# que só existe em runner Linux com Docker. `shell: pwsh` nos dois sistemas (existe no ubuntu da GitHub e na
# máquina central): no Windows o runner resolve `bash` para o `system32\bash.exe` do WSL mesmo com o bash do Git
# no PATH (medido em 28/09), e o WSL não é lugar de CI. Cada job de Python tem venv próprio
# (.github/actions/python-isolado), porque no runner próprio o Python do toolcache é compartilhado.

# 29.184: o padrão do repositório é só leitura de conteúdo; o passo `Resumo do job` lê a API de jobs do próprio run e precisa de
# `actions: read`. Nenhum passo deste arquivo escreve pelo token.
permissions:
  contents: read
  actions: read

concurrency:
  # Um push novo no mesmo ref cancela o CI anterior (o runner próprio é um só: a fila crescia a cada push das
  # sessões). O evento entra na chave para a corrida agendada não ser cancelada por um push.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22.12.0"

jobs:
  # 29.102: a corrida diária desiste se o runner do central já tem um pytest vivo (a suíte do funil ou uma medida).
  # Em 05/10 o SQLite do cron disputou a máquina com a suíte 35 e foi cancelado pelo limite de 60 min; e a medida de
  # latência não pode ter um pytest serial no meio (K-101). Desistir é um aviso visível; o disparo manual roda sempre
  # (quem dispara sabe o que está rodando). Rede PARCIAL quando pula: o `backend-postgres` (hospedado) roda assim mesmo.
  # Para não ficar sem rede em silêncio:
  # - pytest vivo há mais de 6 h é órfão: não conta para a porta e sai como `::error::` com o PID;
  # - mais de 48 h sem corrida de verdade (a marca `farm-porta-ultima-corrida.txt` na pasta de trabalho do runner, que a
  #   própria porta grava quando deixa rodar) e a porta reprova: o run fica VERMELHO em vez de pular de novo.
  # PREMISSA: o `CommandLine` de processo de OUTRO usuário só vem preenchido para quem está elevado. O runner do central
  # roda como Administrator, nível Highest (tarefa `farm-ci-runner`), e as suítes e medidas também rodam como
  # Administrator: hoje a porta vê todos. Se o runner deixar de ser elevado, a porta passa a ver zero e nunca pula.
  porta:
    name: porta · o runner está livre?
    # O disparo só-PG não roda nada no central, nem esta porta (antes ela ainda ia para o runner do central por 5 s, a conferir
    # processos): sem ela, os jobs que dependem dela também são pulados, que é o que `somente_postgres` já pedia.
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.somente_postgres) }}
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 5
    outputs:
      livre: ${{ steps.conferir.outputs.livre }}
    steps:
      - id: conferir
        run: |
          $agora = (Get-Date).ToUniversalTime()
          $marca = Join-Path (Split-Path $env:RUNNER_TEMP) 'farm-porta-ultima-corrida.txt'
          $vivos = @(); $orfaos = @()
          if ($IsWindows) {
            $todos = @(Get-CimInstance Win32_Process -Filter "Name='python.exe'" |
                       Where-Object { $_.CommandLine -match 'pytest' })
            $orfaos = @($todos | Where-Object { ($agora - $_.CreationDate.ToUniversalTime()).TotalHours -gt 6 })
            $vivos = @($todos | Where-Object { ($agora - $_.CreationDate.ToUniversalTime()).TotalHours -le 6 })
          }
          foreach ($o in $orfaos) {
            Write-Host "::error::pytest órfão no runner (PID $($o.ProcessId), desde $($o.CreationDate.ToUniversalTime().ToString('u'))): não conta para a porta; encerre-o"
          }
          if ($vivos.Count -gt 0 -and '${{ github.event_name }}' -eq 'schedule') {
            if (-not (Test-Path $marca)) { $agora.ToString('o') | Set-Content $marca }   # primeira vez: começa a contar
            try {
              $ultima = [datetime]::Parse((Get-Content $marca -Raw).Trim(), $null, 'RoundtripKind').ToUniversalTime()
            } catch {
              Write-Host "::warning::marca da porta ilegível ($marca): regravada com a hora de agora"
              $agora.ToString('o') | Set-Content $marca
              $ultima = $agora
            }
            $horas = [int]($agora - $ultima).TotalHours
            $pids = ($vivos | ForEach-Object { $_.ProcessId }) -join ', '
            "livre=false" >> $env:GITHUB_OUTPUT
            if ($horas -gt 48) {
              Write-Host "::error::corrida diária pulada de novo (pytest vivo: PID $pids) e a última de verdade foi há $horas h: sem rede há mais de 48 h"
              exit 1
            }
            Write-Host "::warning::corrida diária pulada: pytest vivo no runner (PID $pids); última corrida de verdade há $horas h"
          } else {
            "livre=true" >> $env:GITHUB_OUTPUT
            # O disparo só-PG não roda nada no central: não conta como corrida de verdade (senão um por dia mantinha a
            # marca fresca e o central podia pular por dias sem o vermelho das 48 h).
            if (-not ('${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ inputs.somente_postgres }}' -eq 'true')) {
              $agora.ToString('o') | Set-Content $marca
            }
          }

  backend-sqlite:
    name: backend · pytest (SQLite)
    needs: porta
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 60
    if: ${{ needs.porta.outputs.livre == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.somente_postgres) }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/esperar-parque
      - uses: ./.github/actions/python-isolado
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      # 29.184: uma linha por job (tempo por etapa, soma, minutos cobrados estimados) no job summary e no log; só leitura, nunca
      # derruba o job (continue-on-error; o script sai com 0 mesmo se o `gh` faltar). Sem contagem de testes aqui: o pytest deste
      # job não passa por `tee` para não mexer no comando da rede da noite.
      - name: Resumo do job
        if: ${{ !cancelled() }}
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/pr_leve_resumo.py --nome "backend · pytest (SQLite)" --repo $env:GITHUB_REPOSITORY --run $env:GITHUB_RUN_ID --tentativa $env:GITHUB_RUN_ATTEMPT --runner $env:RUNNER_NAME | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

  # 29.193: o job do PostgreSQL custa ~42 min hospedados por noite. Este porteiro (hospedado, ~1 min) lê pela API a última corrida
  # em que ele PASSOU e só deixa rodar se algo que ele testa (backend/, .github/actions/, este arquivo) mudou desde então; sem corrida
  # verde recente, com erro de API, comparação truncada ou disparo manual, roda sempre. Código e regra: scripts/pg_necessario.py.
  pg-necessario:
    name: pg · precisa rodar hoje?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    outputs:
      rodar: ${{ steps.decidir.outputs.rodar }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: decidir
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/pg_necessario.py --repo "$GITHUB_REPOSITORY" --evento "$GITHUB_EVENT_NAME" --head "$GITHUB_SHA" --run "$GITHUB_RUN_ID"

  backend-postgres:
    name: backend · pytest (PostgreSQL)
    runs-on: ubuntu-latest
    needs: pg-necessario
    # 90 min (era 60, e 25 antes): o cron de 01/10/2026 (run 36819958569) foi CANCELADO pelo limite de 25 min com o runner
    # hospedado de 2 núcleos, e o de 06/10 (run 37418749690) pelo de 60: a suíte cresceu de 6,2 mil testes (40 min, 03/10) para
    # 10,7 mil (55 min, 05/10) e o cancelamento escondia o resultado da noite. Só este job é hospedado; o teto do SQLite no
    # runner do central (60 min) NÃO mudou. `workflow_dispatch` com `somente_postgres` roda só este job.
    timeout-minutes: 90
    # `!cancelled()` e `!= 'false'`: se o porteiro falhar ou não devolver nada, o PostgreSQL RODA (erro nunca vira "pulou").
    if: ${{ !cancelled() && needs.pg-necessario.outputs.rodar != 'false' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: farm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:teste@localhost:5432/farm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      # 29.179: o job é o maior consumidor de minutos hospedados (489 de 641 na semana de 06/10: 42 a 69 min, crescendo com a suíte).
      # O runner hospedado tem 2 núcleos; `-n 2` (pytest-xdist, o mesmo pino do requirements-dev.txt) divide a suíte, e o conftest cria
      # um esquema por teste (uuid), então os workers não se pisam. O xdist NÃO está no requirements.txt (deploy.ps1 o instala no venv
      # de produção), por isso entra só aqui.
      - run: pip install -r requirements.txt pytest-xdist==3.8.0
      - name: pytest
        shell: bash   # bash explícito liga o pipefail: o `tee` não esconde a falha do pytest
        run: python -m pytest -q -n 2 2>&1 | tee "$RUNNER_TEMP/pytest.out"
        # conftest.pytest_sessionfinish apaga, no fim, os schemas que esta corrida criou (achado #163) — o
        # serviço 'postgres' nasce vazio a cada job de qualquer forma, mas o hábito é o que vale.
      # 29.184: uma linha por job (tempo por etapa, soma, minutos cobrados e testes) no job summary e no log; só leitura, nunca derruba o job.
      - name: Resumo do job
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/pr_leve_resumo.py --nome "backend · pytest (PostgreSQL)" --repo "$GITHUB_REPOSITORY" --run "$GITHUB_RUN_ID" --tentativa "$GITHUB_RUN_ATTEMPT" --runner "$RUNNER_NAME" --pytest "$RUNNER_TEMP/pytest.out" | tee -a "$GITHUB_STEP_SUMMARY"

  frontend:
    name: frontend · typecheck + vitest
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 30
    needs: porta
    if: ${{ needs.porta.outputs.livre == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.somente_postgres) }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/esperar-parque
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Runner próprio: poucos workers — dezenas de processos do vitest disputavam CPU com os emuladores (28/09).
      - run: npm test -- --maxWorkers=${{ runner.environment == 'self-hosted' && '3' || '100%' }}
      # B7: o `dist` que o backend serve sai deste build; um erro que só o Vite pega (import dinâmico, asset)
      # passava pelo typecheck e pelo vitest e só aparecia no deploy.
      - run: npm run build

  dependencias:
    # Achado #131 — nada avisava quando surgisse CVE em fastapi/starlette/cryptography, e o Appium local já
    # carregava 7 vulnerabilidades moderadas (morgan <1.12.0, log forging, via @appium/base-driver) sem que
    # ninguém soubesse. Roda a cada push E na corrida diária: CVE nova aparece num repositório parado.
    #
    # `--audit-level=high` no npm de propósito: reprovar em MODERADA travaria todo push por causa do morgan do
    # Appium, que é dependência transitiva sem correção publicada e está preso a 127.0.0.1. O relatório completo
    # (`|| true` na listagem) fica no log do job, então a moderada continua VISÍVEL sem virar portão.
    name: dependências · pip-audit + npm audit
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 35
    needs: porta
    if: ${{ needs.porta.outputs.livre == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.somente_postgres) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/esperar-parque
      - uses: ./.github/actions/python-isolado
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pip install pip-audit
      - name: pip-audit (backend e agente do worker)
        run: pip-audit --strict -r backend/requirements.txt -r backend/worker-requirements.txt -r backend/requirements-dev.txt
      - name: npm audit (frontend)
        working-directory: frontend
        run: |
          npm audit --omit=dev
          npm audit --omit=dev --audit-level=high
      - name: npm audit (Appium)
        working-directory: tools/appium
        run: |
          npm audit
          npm audit --audit-level=high
      # 30/09: o driver UiAutomator2 traz dependências DENTRO do tarball (`bundleDependencies`). O `npm audit` lê só
      # o lock; um lock corrigido com a cópia vulnerável ainda no disco passaria calado (medido: `npm ci` deixa a
      # 5.0.9 empacotada do brace-expansion mesmo com o lock dizendo 5.0.12). Por isso instala de verdade — o
      # `postinstall` troca a cópia empacotada — e confere o DISCO. Um passo por comando: no runner Windows o shell
      # é o pwsh, em que só o último comando de um bloco decide o passo.
      - name: Appium · instala (o postinstall troca a cópia empacotada vulnerável)
        working-directory: tools/appium
        run: npm ci --no-audit --no-fund
      - name: Appium · o instalado bate com o lock
        working-directory: tools/appium
        run: node corrigir-empacotados.mjs --conferir
      - name: Appium · testes do corretor
        working-directory: tools/appium
        run: npm test

  backend-tipos:
    # Tipagem gradual (ADR-030, fase A da evolução arquitetural). O código novo da arquitetura modular
    # (`app.contracts`, `app.modules`) nasce estrito e REPROVA; o legado só é MEDIDO (124 erros em fc5f1eb, com o
    # padrão do mypy) até cada pacote ser ligado. O mypy vem de requirements-dev.txt e nunca do requirements.txt:
    # deploy.ps1 instala este último no venv de produção.
    name: backend · mypy (gradual)
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 30
    needs: porta
    if: ${{ needs.porta.outputs.livre == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.somente_postgres) }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/esperar-parque
      - uses: ./.github/actions/python-isolado
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: backend/.mypy_cache
          key: mypy-${{ hashFiles('backend/requirements*.txt') }}-${{ github.sha }}
          restore-keys: mypy-${{ hashFiles('backend/requirements*.txt') }}-
      # 1) código novo: catraca de contagem (29.102). Nasceu bloqueante com zero erro e derivou até 254 (cron de 05/10):
      #    reprovava toda noite e ninguém olhava. Agora reprova só se a contagem SOBE acima do teto em
      #    `backend/mypy-teto.txt`; quem baixa a contagem baixa o teto no mesmo commit. Nunca `continue-on-error`.
      - run: python ../scripts/mypy-catraca.py
      # 2) legado: só mede (a contagem fica no log), não reprova.
      - run: python -m mypy
        continue-on-error: true

  worker-agent-smoke:
    name: worker · instala só o agente e importa
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 30
    needs: porta
    if: ${{ needs.porta.outputs.livre == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.somente_postgres) }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/esperar-parque
      - uses: ./.github/actions/python-isolado
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache-dependency-path: backend/worker-requirements.txt
      - run: pip install -r worker-requirements.txt
      - run: python -c "import app.worker.agent"

  docs:
    name: docs · docs-check e livro-razão do plano-100
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 25
    needs: porta
    if: ${{ needs.porta.outputs.livre == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.somente_postgres) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/esperar-parque
      - uses: ./.github/actions/python-isolado
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # 29.166 (a): o docs-check COMPLETO precisa de PyYAML e pydantic (esquema do config.example.yaml); com `-c` as versões saem de
      # backend/requirements.txt (a mesma trava do backend), sem pip install a mais do que o docs-check usa e sem depender de shell.
      - run: pip install -c backend/requirements.txt pytest pyyaml pydantic pydantic-settings
      # 29.166 (a): com pyyaml, pydantic e pydantic-settings instalados o docs-check confere o formato dos arquivos de configuração.
      # Sem eles ele só AVISA "NAO conferido" e sai com 0; aqui isso não vale como verde (conferência que não rodou não é prova).
      - name: docs-check completo (falha se algum formato ficar NAO conferido)
        run: |
          $saida = Join-Path $env:RUNNER_TEMP 'docs-check-saida.txt'
          python scripts/docs-check.py | Tee-Object -FilePath $saida
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String -Path $saida -Pattern 'NAO conferido' -Quiet) { Write-Host 'docs-check deixou algo NAO conferido: instale as dependencias do formato'; exit 1 }
      - run: python -m pytest -q scripts/tests/test_docs_check.py scripts/tests/test_claude_plan_100.py scripts/tests/test_ci_issue_falha.py scripts/tests/test_github_rotulos.py scripts/tests/test_github_rotina.py scripts/tests/test_workflows_pins.py scripts/tests/test_secret_scan_resumo.py scripts/tests/test_limpar_branches_revisao.py scripts/tests/test_coletar_achados_revisao.py scripts/tests/test_rotulo_do_pr.py scripts/tests/test_ci_gatilhos.py scripts/tests/test_issue_do_pacote.py scripts/tests/test_github_custo.py scripts/tests/test_pr_leve_resumo.py scripts/tests/test_custo_semanal_issue.py scripts/tests/test_agente_nuvem.py scripts/tests/test_pg_necessario.py
      # 29.184: uma linha por job (tempo por etapa, soma, minutos cobrados estimados) no job summary e no log; só leitura, nunca
      # derruba o job (continue-on-error; o script sai com 0 mesmo se o `gh` faltar). Sem contagem de testes aqui: o pytest deste
      # job não passa por `tee` para não mexer no comando da rede da noite.
      - name: Resumo do job
        if: ${{ !cancelled() }}
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/pr_leve_resumo.py --nome "docs · docs-check e livro-razão do plano-100" --repo $env:GITHUB_REPOSITORY --run $env:GITHUB_RUN_ID --tentativa $env:GITHUB_RUN_ATTEMPT --runner $env:RUNNER_NAME | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
