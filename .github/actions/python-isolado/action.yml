name: python-isolado
description: >-
  setup-python + um venv só deste job. No runner da GitHub cada job já nasce limpo; no runner próprio da máquina
  central (`CI_RUNS_ON`, docs/operacao.md) o Python do toolcache é compartilhado entre jobs e corridas, e um
  `pip install` de um job contaminaria o outro — o smoke do agente, por exemplo, deixaria de provar que as
  dependências do worker bastam sozinhas. O venv vai em `RUNNER_TEMP`, que o runner limpa a cada job.

inputs:
  python-version:
    description: versão do Python
    required: true
  cache-dependency-path:
    description: arquivo(s) de requisitos para a chave do cache do pip (vazio = sem cache)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - if: inputs.cache-dependency-path != ''
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
    - if: inputs.cache-dependency-path == ''
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: venv só deste job
      # pwsh e não bash: no runner Windows o `bash` resolve para o do WSL (ver o cabeçalho do ci.yml).
      shell: pwsh
      run: |
        $venv = Join-Path $env:RUNNER_TEMP 'venv'
        python -m venv $venv
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $bin = if ($IsWindows) { Join-Path $venv 'Scripts' } else { Join-Path $venv 'bin' }
        Add-Content -LiteralPath $env:GITHUB_PATH -Value $bin -Encoding utf8
