name: Achado
description: Algo que uma leitura, um teste, um run do CI ou uma revisão encontrou e que ainda não virou item do plano.
title: "achado: <o que, em uma linha>"
labels: ["achado"]
body:
  - type: markdown
    attributes:
      value: |
        Um achado é **dado a conferir**, não ordem. Quem o recebe confere no código de hoje antes de agir.

        **Nunca cole** segredo, nome de conta ou de pessoa, arroba, e-mail, telefone, IP, serial de aparelho nem caminho de máquina. Log entra cortado e sem esses dados: para log do CI, use o texto já limpo do `scripts/ci_issue_falha.py`. **Não cole print nem captura de tela do painel** (mostram conta real, arroba, IP e serial).

        Este formulário não é uma tarefa: **não o atribua ao agente**. Quem o lê confere e, se valer, escreve a tarefa pelo outro formulário.
  - type: dropdown
    id: origem
    attributes:
      label: De onde veio
      options:
        - revisão de PR (Codex ou Copilot)
        - run do CI ou cron
        - leitura do código
        - teste que falhou
        - uso do painel
        - outro
    validations:
      required: true
  - type: input
    id: onde
    attributes:
      label: Onde
      description: PR, run, commit ou `arquivo:linha`. Link é melhor que descrição.
    validations:
      required: true
  - type: dropdown
    id: gravidade
    attributes:
      label: Gravidade
      description: Bloqueante quebra o funil ou perde dado; a corrigir tem caminho em que falha vira sucesso ou teste que passa errado; nota é o resto.
      options:
        - nota
        - a corrigir
        - bloqueante
    validations:
      required: true
  - type: textarea
    id: o-que
    attributes:
      label: O que foi visto
      description: O defeito em uma frase e o caminho em que ele aparece (entrada, estado, resultado errado).
    validations:
      required: true
  - type: textarea
    id: evidencia
    attributes:
      label: Evidência
      description: Trecho curto de log ou de código, com o nível de prova (real com data e commit, simulada com `arquivo::teste`, ou não rodada).
    validations:
      required: true
  - type: textarea
    id: proposta
    attributes:
      label: Proposta
      description: Como conferir e, se já se sabe, como corrigir. Pode ficar vazio.
